<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#07110d" />

  <title>EPG Caddy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #17372a 0%,
          #0b1b14 35%,
          #050a08 75%
        );

      color: white;

      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;

      padding:
        28px
        14px
        40px;

      display: flex;
      flex-direction: column;
    }

    .brand {
      text-align: center;
      margin-top: 30px;
    }

    .brand h1 {
      margin: 0;

      font-size: 36px;
      letter-spacing: 2px;
    }

    .brand p {
      margin: 8px 0 0;

      color: #a8b7af;

      font-size: 15px;
    }

    .course {
      margin-top: 35px;

      padding: 20px;

      border:
        1px solid
        rgba(255,255,255,.12);

      border-radius: 18px;

      background:
        rgba(255,255,255,.05);
    }

    .course-name {
      font-size: 22px;
      font-weight: 700;
    }

    .course-info {
      margin-top: 7px;

      color: #b8c4be;
    }

    .status {
      margin-top: 18px;

      min-height: 24px;

      text-align: center;

      color: #b8c4be;

      font-size: 14px;
    }

    .controls {
      flex: 1;

      width: 100%;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      padding: 35px 0;
    }

    #talkButton {
      width: 170px;
      height: 170px;

      flex-shrink: 0;

      border-radius: 50%;

      border:
        1px solid
        rgba(255,255,255,.18);

      background: #2d8c5a;

      color: white;

      font-size: 20px;
      font-weight: 700;

      box-shadow:
        0 15px 45px
        rgba(0,0,0,.4);

      cursor: pointer;

      touch-action: manipulation;
    }

    #talkButton:active {
      transform: scale(.97);
    }

    #talkButton.active {
      background: #b64242;
    }

    .instruction {
      margin-top: 22px;

      color: #aebbb4;

      text-align: center;

      line-height: 1.5;
    }

    .score-summary {
      width: 100%;

      margin-top: 25px;

      display: none;

      padding: 14px 10px;

      border-radius: 16px;

      background:
        rgba(255,255,255,.06);

      border:
        1px solid
        rgba(255,255,255,.1);

      overflow: hidden;
    }

    .score-summary.visible {
      display: block;
    }

    .score-summary h2 {
      margin: 0 0 12px;

      font-size: 18px;
    }

    .summary-grid {
      width: 100%;

      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 6px;

      text-align: center;
    }

    .summary-grid > div {
      min-width: 0;

      padding: 9px 3px;

      border-radius: 10px;

      background:
        rgba(255,255,255,.05);
    }

    .label {
      display: block;

      color: #91a099;

      font-size: 11px;

      margin-bottom: 6px;
    }

    .value {
      display: block;

      font-size: 12px;
      font-weight: 700;

      line-height: 1.45;

      white-space: pre-line;

      overflow-wrap: anywhere;
    }

    .scorecard {
      width: 100%;

      margin-top: 18px;

      padding: 14px 6px;

      border-radius: 14px;

      background:
        rgba(255,255,255,.04);

      border:
        1px solid
        rgba(255,255,255,.08);

      overflow: hidden;
    }

    .scorecard-title {
      margin-bottom: 12px;

      text-align: center;

      font-size: 14px;
      font-weight: 700;

      color: #d5ded9;
    }

    .nine-title {
      margin:
        14px
        0
        7px;

      font-size: 11px;
      font-weight: 700;

      color: #91a099;

      text-transform: uppercase;

      letter-spacing: .5px;
    }

    .nine-title:first-of-type {
      margin-top: 0;
    }

    .score-table-wrap {
      width: 100%;

      overflow: hidden;
    }

    .score-table {
      width: 100%;

      border-collapse: separate;

      border-spacing: 2px;

      table-layout: fixed;

      text-align: center;
    }

    .score-table th,
    .score-table td {
      height: 29px;

      padding: 2px 0;

      border-radius: 4px;

      font-size: 10px;

      background:
        rgba(255,255,255,.05);

      overflow: hidden;
    }

    .score-table th {
      color: #9caaa3;

      font-weight: 600;
    }

    .score-table .row-label {
      width: 42px;

      text-align: left;

      padding-left: 3px;

      color: #9caaa3;

      font-size: 10px;

      font-weight: 700;

      background: transparent;
    }

    .score-table .total-column {
      width: 34px;

      font-size: 9px;

      font-weight: 700;

      background:
        rgba(255,255,255,.09);
    }

    .score-table .gross-cell {
      font-size: 12px;
      font-weight: 700;
    }

    .scorecard-total {
      margin-top: 12px;

      padding-top: 11px;

      border-top:
        1px solid
        rgba(255,255,255,.08);

      display: flex;

      justify-content: space-between;
      align-items: center;

      font-size: 13px;
    }

    .scorecard-total-label {
      color: #91a099;

      font-weight: 700;
    }

    .scorecard-total-value {
      font-size: 17px;
      font-weight: 700;
    }

    #newRoundButton {
      display: block;

      margin:
        18px
        auto
        0;

      border:
        1px solid
        rgba(255,255,255,.15);

      border-radius: 10px;

      padding: 10px 16px;

      background:
        rgba(255,255,255,.04);

      color: #9daca4;

      font-size: 12px;

      cursor: pointer;

      touch-action: manipulation;
    }

    footer {
      text-align: center;

      color: #65736c;

      font-size: 12px;

      padding-top: 15px;
    }

    @media (max-width: 390px) {
      .app {
        padding-left: 10px;
        padding-right: 10px;
      }

      .score-summary {
        padding-left: 7px;
        padding-right: 7px;
      }

      .scorecard {
        padding-left: 3px;
        padding-right: 3px;
      }

      .score-table {
        border-spacing: 1px;
      }

      .score-table .row-label {
        width: 38px;

        font-size: 9px;
      }

      .score-table .total-column {
        width: 31px;
      }

      .score-table th,
      .score-table td {
        font-size: 9px;
      }

      .score-table .gross-cell {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="brand">

      <h1>EPG CADDY</h1>

      <p>
        Tu caddie profesional de golf por voz
      </p>

    </header>


    <section class="course">

      <div
        class="course-name"
        id="courseName"
      >
        El Pulté
      </div>

      <div
        class="course-info"
        id="courseInfo"
      >
        Blancas · Par 72 · 18 hoyos
      </div>

    </section>


    <div
      class="status"
      id="status"
    >
      Preparando EPG Caddy…
    </div>


    <section class="controls">

      <button
        id="talkButton"
        type="button"
      >
        Iniciar Caddy
      </button>


      <div class="instruction">

        Toca una vez y di:
        “Hoyo 5, 3”

      </div>


      <section
        class="score-summary"
        id="scoreSummary"
      >

        <h2>Ronda guardada</h2>


        <div class="summary-grid">

          <div>

            <span class="label">
              Primera
            </span>

            <span
              class="value"
              id="front9"
            >
              —
            </span>

          </div>


          <div>

            <span class="label">
              Segunda
            </span>

            <span
              class="value"
              id="back9"
            >
              —
            </span>

          </div>


          <div>

            <span class="label">
              Total
            </span>

            <span
              class="value"
              id="total"
            >
              —
            </span>

          </div>

        </div>


        <section class="scorecard">

          <div class="scorecard-title">
            Tarjeta Gross
          </div>


          <div class="nine-title">
            Primera Vuelta
          </div>


          <div class="score-table-wrap">

            <table class="score-table">

              <tbody>

                <tr id="frontHoleRow">
                  <th class="row-label">Hoyo</th>
                </tr>

                <tr id="frontParRow">
                  <th class="row-label">Par</th>
                </tr>

                <tr id="frontGrossRow">
                  <th class="row-label">Gross</th>
                </tr>

              </tbody>

            </table>

          </div>


          <div class="nine-title">
            Segunda Vuelta
          </div>


          <div class="score-table-wrap">

            <table class="score-table">

              <tbody>

                <tr id="backHoleRow">
                  <th class="row-label">Hoyo</th>
                </tr>

                <tr id="backParRow">
                  <th class="row-label">Par</th>
                </tr>

                <tr id="backGrossRow">
                  <th class="row-label">Gross</th>
                </tr>

              </tbody>

            </table>

          </div>


          <div class="scorecard-total">

            <span class="scorecard-total-label">
              TOTAL GROSS
            </span>

            <span
              class="scorecard-total-value"
              id="scorecardTotalGross"
            >
              —
            </span>

          </div>

        </section>


        <button
          id="newRoundButton"
          type="button"
        >
          Nueva ronda
        </button>

      </section>

    </section>


    <footer>
      EPG Caddy
    </footer>

  </main>


  <script>

    const STORAGE_KEY =
      "epg-caddy-current-round-v1";

    const GAME_HANDICAP = 14;


    const FALLBACK_COURSE = {

      name: "El Pulté",

      tees: "Blancas",

      par: 72,

      holes: [

        { hole: 1,  par: 4, hcp: 9 },
        { hole: 2,  par: 4, hcp: 5 },
        { hole: 3,  par: 4, hcp: 7 },
        { hole: 4,  par: 4, hcp: 11 },
        { hole: 5,  par: 3, hcp: 17 },
        { hole: 6,  par: 5, hcp: 3 },
        { hole: 7,  par: 5, hcp: 1 },
        { hole: 8,  par: 3, hcp: 15 },
        { hole: 9,  par: 4, hcp: 13 },

        { hole: 10, par: 3, hcp: 18 },
        { hole: 11, par: 5, hcp: 2 },
        { hole: 12, par: 4, hcp: 8 },
        { hole: 13, par: 4, hcp: 16 },
        { hole: 14, par: 5, hcp: 4 },
        { hole: 15, par: 4, hcp: 6 },
        { hole: 16, par: 4, hcp: 12 },
        { hole: 17, par: 3, hcp: 10 },
        { hole: 18, par: 4, hcp: 14 }

      ]

    };


    const FRONT =
      [1,2,3,4,5,6,7,8,9];

    const BACK =
      [10,11,12,13,14,15,16,17,18];


    const talkButton =
      document.getElementById("talkButton");

    const statusEl =
      document.getElementById("status");

    const courseName =
      document.getElementById("courseName");

    const courseInfo =
      document.getElementById("courseInfo");

    const scoreSummary =
      document.getElementById("scoreSummary");

    const front9El =
      document.getElementById("front9");

    const back9El =
      document.getElementById("back9");

    const totalEl =
      document.getElementById("total");

    const newRoundButton =
      document.getElementById("newRoundButton");

    const frontHoleRow =
      document.getElementById("frontHoleRow");

    const frontParRow =
      document.getElementById("frontParRow");

    const frontGrossRow =
      document.getElementById("frontGrossRow");

    const backHoleRow =
      document.getElementById("backHoleRow");

    const backParRow =
      document.getElementById("backParRow");

    const backGrossRow =
      document.getElementById("backGrossRow");

    const scorecardTotalGross =
      document.getElementById(
        "scorecardTotalGross"
      );


    let course =
      structuredClone(
        FALLBACK_COURSE
      );

    let pc = null;
    let dc = null;

    let localStream = null;
    let micTrack = null;

    let audioElement = null;

    let connected = false;
    let listening = false;

    let waitingForToolAnswer = false;
    let waitingForAudioFinish = false;

    let responseInProgress = false;


    function emptyRound() {

      return {

        version: 1,

        course: "El Pulté",

        tees: "Blancas",

        handicap:
          GAME_HANDICAP,

        holes: {},

        lastHole: null,

        createdAt:
          new Date().toISOString(),

        updatedAt:
          new Date().toISOString()

      };

    }


    function loadRound() {

      try {

        const raw =
          localStorage.getItem(
            STORAGE_KEY
          );

        if (!raw) {

          return emptyRound();

        }

        const parsed =
          JSON.parse(raw);

        if (
          !parsed ||
          typeof parsed !== "object" ||
          !parsed.holes
        ) {

          return emptyRound();

        }

        return parsed;

      } catch (error) {

        console.error(
          "No se pudo leer la ronda:",
          error
        );

        return emptyRound();

      }

    }


    let round =
      loadRound();


    function saveRound() {

      round.updatedAt =
        new Date().toISOString();

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(round)
      );

      updateSummary();

    }


    function holeDefinition(
      number
    ) {

      return course.holes.find(
        item =>
          Number(item.hole) ===
          Number(number)
      );

    }


    function strokeForHole(
      definition
    ) {

      if (!definition) {

        return 0;

      }

      return (
        Number(definition.hcp) <=
        GAME_HANDICAP
      )
        ? 1
        : 0;

    }


    function registeredHoles() {

      return Object.values(
        round.holes
      );

    }


    function totalsForHoles(
      holeNumbers
    ) {

      const items =
        holeNumbers
          .map(
            number =>
              round.holes[
                String(number)
              ]
          )
          .filter(Boolean);

      const gross =
        items.reduce(
          (sum, item) =>
            sum +
            Number(item.gross),
          0
        );

      const net =
        items.reduce(
          (sum, item) =>
            sum +
            Number(item.net),
          0
        );

      const par =
        items.reduce(
          (sum, item) =>
            sum +
            Number(item.par),
          0
        );

      return {

        items,
        gross,
        net,
        par,
        diff:
          net - par

      };

    }


    function allRegisteredTotals() {

      const items =
        registeredHoles();

      return {

        items,

        gross:
          items.reduce(
            (sum, item) =>
              sum +
              Number(item.gross),
            0
          ),

        net:
          items.reduce(
            (sum, item) =>
              sum +
              Number(item.net),
            0
          ),

        par:
          items.reduce(
            (sum, item) =>
              sum +
              Number(item.par),
            0
          )

      };

    }


    function individualResult(
      diff
    ) {

      if (diff === 0) {

        return "Par";

      }

      if (diff < 0) {

        return (
          `${Math.abs(diff)} bajo par`
        );

      }

      return (
        `${diff} sobre par`
      );

    }


    function aggregateResult(
      diff
    ) {

      if (diff === 0) {

        return "Even";

      }

      if (diff < 0) {

        return (
          `${Math.abs(diff)} bajo par`
        );

      }

      return (
        `${diff} sobre par`
      );

    }


    function isComplete(
      numbers
    ) {

      return numbers.every(
        number =>
          Boolean(
            round.holes[
              String(number)
            ]
          )
      );

    }


    function roundStatusBeforeUpdate() {

      return {

        front:
          isComplete(FRONT),

        back:
          isComplete(BACK),

        total:
          registeredHoles()
            .length === 18

      };

    }


    function buildRecordSpeech(
      score,
      before
    ) {

      const all =
        allRegisteredTotals();

      const accumulatedDiff =
        all.net -
        all.par;

      const lines = [

        `Hoyo ${score.hole}`,

        `Gross ${score.gross}`,

        `Neto ${score.net}`,

        `Resultado: ${
          individualResult(
            score.diff
          )
        }`,

        "Acumulado",

        `Gross ${all.gross}`,

        `Neto ${all.net}`,

        `Acumulado ${
          aggregateResult(
            accumulatedDiff
          )
        }`

      ];


      const frontNow =
        isComplete(FRONT);

      const backNow =
        isComplete(BACK);

      const totalNow =
        registeredHoles()
          .length === 18;


      if (
        !before.front &&
        frontNow
      ) {

        const front =
          totalsForHoles(
            FRONT
          );

        lines.push(
          "",
          "Primera Vuelta",
          `Gross ${front.gross}`,
          `Neto ${front.net}`,
          `Resultado: ${
            aggregateResult(
              front.net -
              front.par
            )
          }`
        );

      }


      /*
        IMPORTANTE:

        Al terminar el hoyo 18,
        la Segunda Vuelta se agrega
        ANTES que el Total de la ronda.
      */

      if (
        !before.back &&
        backNow
      ) {

        const back =
          totalsForHoles(
            BACK
          );

        lines.push(
          "",
          "Segunda Vuelta",
          `Gross ${back.gross}`,
          `Neto ${back.net}`,
          `Resultado: ${
            aggregateResult(
              back.net -
              back.par
            )
          }`
        );

      }


      if (
        !before.total &&
        totalNow
      ) {

        const total =
          totalsForHoles([
            ...FRONT,
            ...BACK
          ]);

        lines.push(
          "",
          "Total de la Ronda",
          `Gross ${total.gross}`,
          `Neto ${total.net}`,
          `Resultado: ${
            aggregateResult(
              total.net -
              total.par
            )
          }`
        );

      }


      return lines.join("\n");

    }


    function recordScore(
      hole,
      gross
    ) {

      hole =
        Number(hole);

      gross =
        Number(gross);


      if (
        !Number.isInteger(hole) ||
        hole < 1 ||
        hole > 18
      ) {

        return {

          ok: false,

          speech:
            "Número de hoyo inválido."

        };

      }


      if (
        !Number.isInteger(gross) ||
        gross < 1 ||
        gross > 30
      ) {

        return {

          ok: false,

          speech:
            "Score inválido."

        };

      }


      const definition =
        holeDefinition(hole);


      if (!definition) {

        return {

          ok: false,

          speech:
            `Hoyo ${hole} sin datos.`

        };

      }


      const before =
        roundStatusBeforeUpdate();


      const handicapStroke =
        strokeForHole(
          definition
        );


      const net =
        gross -
        handicapStroke;


      const score = {

        hole,

        gross,

        par:
          Number(
            definition.par
          ),

        hcp:
          Number(
            definition.hcp
          ),

        handicapStroke,

        net,

        diff:
          net -
          Number(
            definition.par
          ),

        updatedAt:
          new Date()
            .toISOString()

      };


      round.holes[
        String(hole)
      ] = score;

      round.lastHole =
        hole;

      saveRound();


      return {

        ok: true,

        action:
          "record_score",

        score,

        speech:
          buildRecordSpeech(
            score,
            before
          )

      };

    }


    function speechForHole(
      hole
    ) {

      const score =
        round.holes[
          String(hole)
        ];


      if (!score) {

        return (
          `Hoyo ${hole} sin score.`
        );

      }


      return [

        `Hoyo ${score.hole}`,

        `Gross ${score.gross}`,

        `Neto ${score.net}`,

        `Resultado: ${
          individualResult(
            score.diff
          )
        }`

      ].join("\n");

    }


    function getHole(
      hole
    ) {

      hole =
        Number(hole);

      return {

        ok: true,

        action:
          "get_hole",

        speech:
          speechForHole(
            hole
          )

      };

    }


    function getRange(
      from,
      to
    ) {

      from =
        Number(from);

      to =
        Number(to);


      if (
        !Number.isInteger(from) ||
        !Number.isInteger(to)
      ) {

        return {

          ok: false,

          speech:
            "Rango inválido."

        };

      }


      const start =
        Math.min(
          from,
          to
        );

      const end =
        Math.max(
          from,
          to
        );

      const speeches = [];


      for (
        let hole = start;
        hole <= end;
        hole++
      ) {

        if (
          round.holes[
            String(hole)
          ]
        ) {

          speeches.push(
            speechForHole(
              hole
            )
          );

        }

      }


      if (
        speeches.length === 0
      ) {

        return {

          ok: true,

          action:
            "get_range",

          speech:
            "No hay scores registrados en ese rango."

        };

      }


      return {

        ok: true,

        action:
          "get_range",

        speech:
          speeches.join(
            "\n\n"
          )

      };

    }


    function getList(
      holes
    ) {

      if (
        !Array.isArray(holes) ||
        holes.length === 0
      ) {

        return {

          ok: false,

          speech:
            "Lista de hoyos inválida."

        };

      }


      const speeches =
        holes.map(
          hole =>
            speechForHole(
              Number(hole)
            )
        );


      return {

        ok: true,

        action:
          "get_list",

        speech:
          speeches.join(
            "\n\n"
          )

      };

    }


    function getLast() {

      if (!round.lastHole) {

        return {

          ok: true,

          action:
            "get_last",

          speech:
            "No hay scores registrados."

        };

      }


      return {

        ok: true,

        action:
          "get_last",

        speech:
          speechForHole(
            round.lastHole
          )

      };

    }


    function processAction(
      args
    ) {

      switch (
        args.action
      ) {

        case "record_score":

          return recordScore(
            args.hole,
            args.gross
          );


        case "get_hole":

          return getHole(
            args.hole
          );


        case "get_range":

          return getRange(
            args.from,
            args.to
          );


        case "get_list":

          return getList(
            args.holes
          );


        case "get_last":

          return getLast();


        default:

          return {

            ok: false,

            speech:
              "Comando no reconocido."

          };

      }

    }


    function visualResult(
      diff
    ) {

      if (diff === 0) {

        return "Even";

      }

      if (diff < 0) {

        return (
          `${Math.abs(diff)} bajo par`
        );

      }

      return (
        `${diff} sobre par`
      );

    }


    function visualSummary(
      totals,
      expected
    ) {

      if (
        totals.items.length === 0
      ) {

        return `0/${expected}`;

      }


      const diff =
        totals.net -
        totals.par;


      return [

        `${totals.items.length}/${expected}`,

        `G ${totals.gross}`,

        `N ${totals.net}`,

        visualResult(diff)

      ].join("\n");

    }


    function clearGeneratedRow(
      row
    ) {

      while (
        row.children.length > 1
      ) {

        row.removeChild(
          row.lastChild
        );

      }

    }


    function appendCell(
      row,
      text,
      className = ""
    ) {

      const cell =
        document.createElement(
          "td"
        );

      cell.textContent =
        text;

      if (className) {

        cell.className =
          className;

      }

      row.appendChild(
        cell
      );

    }


    function renderNineScorecard(
      numbers,
      holeRow,
      parRow,
      grossRow,
      totalLabel
    ) {

      clearGeneratedRow(
        holeRow
      );

      clearGeneratedRow(
        parRow
      );

      clearGeneratedRow(
        grossRow
      );


      let grossTotal = 0;
      let registeredCount = 0;


      numbers.forEach(
        number => {

          const definition =
            holeDefinition(
              number
            );

          const score =
            round.holes[
              String(number)
            ];


          appendCell(
            holeRow,
            number
          );


          appendCell(
            parRow,
            definition
              ? definition.par
              : "—"
          );


          appendCell(
            grossRow,
            score
              ? score.gross
              : "—",
            "gross-cell"
          );


          if (score) {

            grossTotal +=
              Number(
                score.gross
              );

            registeredCount++;

          }

        }
      );


      appendCell(
        holeRow,
        totalLabel,
        "total-column"
      );


      const fullPar =
        numbers.reduce(
          (sum, number) => {

            const definition =
              holeDefinition(
                number
              );

            return (
              sum +
              Number(
                definition?.par ||
                0
              )
            );

          },
          0
        );


      appendCell(
        parRow,
        fullPar,
        "total-column"
      );


      appendCell(
        grossRow,
        registeredCount > 0
          ? grossTotal
          : "—",
        "total-column gross-cell"
      );

    }


    function updateScorecard() {

      renderNineScorecard(
        FRONT,
        frontHoleRow,
        frontParRow,
        frontGrossRow,
        "OUT"
      );


      renderNineScorecard(
        BACK,
        backHoleRow,
        backParRow,
        backGrossRow,
        "IN"
      );


      const total =
        totalsForHoles([
          ...FRONT,
          ...BACK
        ]);


      scorecardTotalGross.textContent =
        total.items.length > 0
          ? total.gross
          : "—";

    }


    function updateSummary() {

      const count =
        registeredHoles()
          .length;


      updateScorecard();


      if (count === 0) {

        scoreSummary
          .classList
          .remove(
            "visible"
          );

        return;

      }


      scoreSummary
        .classList
        .add(
          "visible"
        );


      const front =
        totalsForHoles(
          FRONT
        );

      const back =
        totalsForHoles(
          BACK
        );

      const total =
        totalsForHoles([
          ...FRONT,
          ...BACK
        ]);


      front9El.textContent =
        visualSummary(
          front,
          9
        );

      back9El.textContent =
        visualSummary(
          back,
          9
        );

      totalEl.textContent =
        visualSummary(
          total,
          18
        );


      statusEl.textContent =
        `Ronda guardada · ${count}/18 hoyos`;

    }


    async function loadCourse() {

      try {

        const response =
          await fetch(
            "/api/score",
            {
              cache:
                "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "No se pudo cargar el campo"
          );

        }


        const data =
          await response.json();


        if (
          data.course &&
          Array.isArray(
            data.course.holes
          )
        ) {

          course =
            data.course;

        }


        courseName.textContent =
          course.name ||
          "El Pulté";


        courseInfo.textContent =
          `${course.tees || "Blancas"} · ` +
          `Par ${course.par || 72} · ` +
          `${course.holes.length} hoyos`;


        updateSummary();


        if (
          registeredHoles()
            .length === 0
        ) {

          statusEl.textContent =
            "Listo para iniciar.";

        }

      } catch (error) {

        console.error(error);


        course =
          structuredClone(
            FALLBACK_COURSE
          );


        updateSummary();


        if (
          registeredHoles()
            .length === 0
        ) {

          statusEl.textContent =
            "Listo para iniciar.";

        }

      }

    }


    function sendEvent(
      event
    ) {

      if (
        !dc ||
        dc.readyState !== "open"
      ) {

        throw new Error(
          "Canal Realtime no disponible."
        );

      }


      dc.send(
        JSON.stringify(
          event
        )
      );

    }


    function sendToolOutput(
      call,
      result
    ) {

      waitingForToolAnswer =
        true;

      waitingForAudioFinish =
        true;

      responseInProgress =
        true;


      /*
        En cuanto ya tenemos el comando,
        cerramos el micrófono para impedir
        que el audio de EPG Caddy vuelva
        a entrar por el micrófono.
      */

      setMicEnabled(
        false,
        false
      );


      sendEvent({

        type:
          "conversation.item.create",

        item: {

          type:
            "function_call_output",

          call_id:
            call.call_id,

          output:
            JSON.stringify(
              result
            )

        }

      });


      sendEvent({

        type:
          "response.create",

        response: {

          instructions:
            "Pronuncia exactamente el campo speech " +
            "del resultado de la herramienta. " +
            "Habla exclusivamente en español neutro. " +
            "Pronuncia todos los números en español. " +
            "Conserva la misma voz durante toda la respuesta. " +
            "No añadas, quites, reformules ni repitas nada."

        }

      });

    }


    function handleResponseDone(
      event
    ) {

      const output =
        event?.response?.output;


      if (
        !Array.isArray(output)
      ) {

        /*
          No cerramos nada aquí
          si todavía esperamos audio.
        */

        if (
          !waitingForAudioFinish
        ) {

          finishListening();

        }

        return;

      }


      const functionCalls =
        output.filter(
          item =>
            item.type ===
            "function_call" &&
            item.name ===
            "epg_caddy_action"
        );


      if (
        functionCalls.length > 0
      ) {

        for (
          const call
          of functionCalls
        ) {

          try {

            const args =
              JSON.parse(
                call.arguments ||
                "{}"
              );


            const result =
              processAction(
                args
              );


            sendToolOutput(
              call,
              result
            );

          } catch (error) {

            console.error(
              "Error procesando herramienta:",
              error
            );


            sendToolOutput(
              call,
              {

                ok: false,

                speech:
                  "No se pudo procesar el comando."

              }
            );

          }

        }


        return;

      }


      /*
        Este response.done corresponde
        normalmente a la respuesta hablada
        después de la herramienta.
      */

      if (
        waitingForToolAnswer
      ) {

        waitingForToolAnswer =
          false;

      }


      if (
        waitingForAudioFinish
      ) {

        /*
          Esperamos el evento de audio.done.
          No finalizamos prematuramente.
        */

        return;

      }


      responseInProgress =
        false;

      finishListening();

    }


    function handleRealtimeEvent(
      message
    ) {

      try {

        const event =
          JSON.parse(
            message.data
          );


        if (
          event.type ===
          "response.created"
        ) {

          responseInProgress =
            true;

          return;

        }


        if (
          event.type ===
          "response.done"
        ) {

          handleResponseDone(
            event
          );

          return;

        }


        /*
          La API puede enviar cualquiera
          de estos eventos dependiendo
          de la versión/configuración.
        */

        if (
          event.type ===
            "response.audio.done" ||
          event.type ===
            "response.output_audio.done"
        ) {

          waitingForAudioFinish =
            false;

          waitingForToolAnswer =
            false;

          responseInProgress =
            false;

          finishListening();

          return;

        }


        if (
          event.type ===
          "error"
        ) {

          console.error(
            "Realtime error:",
            event
          );


          waitingForToolAnswer =
            false;

          waitingForAudioFinish =
            false;

          responseInProgress =
            false;


          finishListening();

        }

      } catch (error) {

        console.error(
          "Evento Realtime inválido:",
          error
        );

      }

    }


    function setMicEnabled(
      enabled,
      refresh = true
    ) {

      if (micTrack) {

        micTrack.enabled =
          enabled;

      }


      listening =
        enabled;


      if (enabled) {

        talkButton
          .classList
          .add(
            "active"
          );


        talkButton.textContent =
          "Escuchando";


        statusEl.textContent =
          "Escuchando…";

      } else {

        talkButton
          .classList
          .remove(
            "active"
          );


        talkButton.textContent =
          connected
            ? "Hablar"
            : "Iniciar Caddy";


        if (refresh) {

          updateSummary();

        }


        if (
          registeredHoles()
            .length === 0
        ) {

          statusEl.textContent =
            connected
              ? "EPG Caddy listo."
              : "Listo para iniciar.";

        }

      }

    }


    function finishListening() {

      setMicEnabled(
        false
      );

    }


    function connectionAlive() {

      if (!pc) {

        return false;

      }


      return [
        "new",
        "connecting",
        "connected"
      ].includes(
        pc.connectionState
      );

    }


    async function ensureSession() {

      if (
        connected &&
        connectionAlive() &&
        dc &&
        dc.readyState === "open"
      ) {

        return;

      }


      cleanupConnection();


      statusEl.textContent =
        "Conectando…";


      localStream =
        await navigator
          .mediaDevices
          .getUserMedia({
            audio: {

              echoCancellation: true,

              noiseSuppression: true,

              autoGainControl: true

            }
          });


      micTrack =
        localStream
          .getAudioTracks()[0];


      /*
        MUY IMPORTANTE:

        Al crear la conexión dejamos
        inicialmente el micrófono apagado.

        Sólo startTalking() lo habilita.
      */

      micTrack.enabled =
        false;


      pc =
        new RTCPeerConnection();


      audioElement =
        document.createElement(
          "audio"
        );


      audioElement.autoplay =
        true;

      audioElement.playsInline =
        true;


      pc.ontrack =
        event => {

          audioElement.srcObject =
            event.streams[0];


          const playPromise =
            audioElement.play();


          if (
            playPromise &&
            typeof playPromise.catch ===
              "function"
          ) {

            playPromise.catch(
              error => {

                console.warn(
                  "Audio autoplay:",
                  error
                );

              }
            );

          }

        };


      pc.addTrack(
        micTrack,
        localStream
      );


      dc =
        pc.createDataChannel(
          "oai-events"
        );


      dc.addEventListener(
        "message",
        handleRealtimeEvent
      );


      dc.addEventListener(
        "open",
        () => {

          connected = true;

          setMicEnabled(
            false
          );

        }
      );


      dc.addEventListener(
        "close",
        () => {

          connected = false;
          listening = false;

          waitingForToolAnswer =
            false;

          waitingForAudioFinish =
            false;

          responseInProgress =
            false;


          talkButton
            .classList
            .remove(
              "active"
            );


          talkButton.textContent =
            "Iniciar Caddy";

        }
      );


      pc.addEventListener(
        "connectionstatechange",
        () => {

          if (!pc) {

            return;

          }


          if (
            [
              "failed",
              "closed",
              "disconnected"
            ].includes(
              pc.connectionState
            )
          ) {

            connected = false;

            listening = false;

          }

        }
      );


      const offer =
        await pc.createOffer();


      await pc.setLocalDescription(
        offer
      );


      await new Promise(
        resolve => {

          if (
            pc.iceGatheringState ===
            "complete"
          ) {

            resolve();

            return;

          }


          const checkState =
            () => {

              if (
                pc.iceGatheringState ===
                "complete"
              ) {

                pc.removeEventListener(
                  "icegatheringstatechange",
                  checkState
                );


                resolve();

              }

            };


          pc.addEventListener(
            "icegatheringstatechange",
            checkState
          );

        }
      );


      const response =
        await fetch(
          "/api/session",
          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/sdp"

            },

            body:
              pc.localDescription.sdp

          }
        );


      const answer =
        await response.text();


      if (!response.ok) {

        throw new Error(
          answer ||
          "No se pudo iniciar la sesión."
        );

      }


      await pc.setRemoteDescription({

        type:
          "answer",

        sdp:
          answer

      });


      await new Promise(
        (resolve, reject) => {

          const timeout =
            setTimeout(
              () => {

                reject(
                  new Error(
                    "El canal Realtime no abrió."
                  )
                );

              },
              10000
            );


          if (
            dc.readyState ===
            "open"
          ) {

            clearTimeout(
              timeout
            );

            resolve();

            return;

          }


          dc.addEventListener(
            "open",
            () => {

              clearTimeout(
                timeout
              );

              resolve();

            },
            {
              once: true
            }
          );

        }
      );


      connected = true;

      setMicEnabled(
        false
      );

    }


    async function startTalking() {

      try {

        /*
          Mientras EPG Caddy está hablando
          no permitimos abrir nuevamente
          el micrófono.
      */

        if (
          responseInProgress ||
          waitingForAudioFinish
        ) {

          return;

        }


        talkButton.disabled =
          true;


        await ensureSession();


        talkButton.disabled =
          false;


        if (listening) {

          setMicEnabled(
            false
          );

          return;

        }


        waitingForToolAnswer =
          false;

        waitingForAudioFinish =
          false;

        responseInProgress =
          false;


        /*
          El usuario controla el comienzo.
          Ya no cerramos el micrófono por
          un evento intermedio de Realtime.
      */

        setMicEnabled(
          true
        );

      } catch (error) {

        console.error(error);


        talkButton.disabled =
          false;


        statusEl.textContent =
          "No se pudo iniciar EPG Caddy.";


        cleanupConnection();

      }

    }


    function cleanupConnection() {

      if (localStream) {

        localStream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );

      }


      localStream = null;
      micTrack = null;


      if (dc) {

        try {

          dc.close();

        } catch {}

      }


      dc = null;


      if (pc) {

        try {

          pc.close();

        } catch {}

      }


      pc = null;


      if (audioElement) {

        try {

          audioElement.pause();

        } catch {}


        audioElement.srcObject =
          null;

      }


      audioElement = null;

      connected = false;
      listening = false;

      waitingForToolAnswer =
        false;

      waitingForAudioFinish =
        false;

      responseInProgress =
        false;

    }


    function newRound() {

      const confirmed =
        window.confirm(
          "¿Iniciar una nueva ronda? " +
          "Se borrarán los scores actuales."
        );


      if (!confirmed) {

        return;

      }


      /*
        Cerramos también la sesión Realtime.

        Así la nueva ronda comienza con
        tarjeta Y conversación nuevas.
      */

      cleanupConnection();


      round =
        emptyRound();


      localStorage.removeItem(
        STORAGE_KEY
      );


      saveRound();


      scoreSummary
        .classList
        .remove(
          "visible"
        );


      updateScorecard();


      talkButton.disabled =
        false;


      talkButton
        .classList
        .remove(
          "active"
        );


      talkButton.textContent =
        "Iniciar Caddy";


      statusEl.textContent =
        "Nueva ronda lista.";

    }


    talkButton.addEventListener(
      "click",
      startTalking
    );


    newRoundButton.addEventListener(
      "click",
      newRound
    );


    window.addEventListener(
      "beforeunload",
      () => {

        saveRound();

      }
    );


    loadCourse();

  </script>

</body>
