<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Invitación · Golf Score Card GT</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#020402;color:#fff;font:700 18px Arial,sans-serif;padding:24px}main{width:min(520px,100%);border:1px solid #53605b;border-radius:20px;background:#070b08;padding:28px;text-align:center}p{line-height:1.5;color:#c7ceca}a{display:inline-block;margin-top:16px;padding:14px 22px;border:2px solid #31ff00;border-radius:14px;color:#31ff00;text-decoration:none}</style></head>
<body><main><h1>Golf Score Card GT</h1><p id="status">Abriendo invitación…</p><a id="open" href="/index-grupal.html?inicio=1" hidden>Abrir aplicación</a></main><script>
const $=id=>document.getElementById(id),match=location.pathname.match(/^\/invite\/([A-Za-z0-9_-]{43})$/),query=new URL(location.href).searchParams.get('invite')||'',hash=location.hash.match(/^#invite=([A-Za-z0-9_-]{43})$/),token=match?.[1]||(/^[A-Za-z0-9_-]{43}$/.test(query)?query:(hash?.[1]||''));
if(!token){location.replace('/index-grupal.html?inicio=1')}
else fetch(`/api/app-access?action=redeem&token=${encodeURIComponent(token)}`,{method:'POST',credentials:'include'}).then(response=>{if(!response.ok)throw new Error('La invitación está vencida o ya fue utilizada');location.replace('/index-grupal.html?inicio=1')}).catch(error=>{$('status').textContent=error.message+' Puedes abrir la aplicación libremente.';$('open').hidden=false});
</script></body></html>
