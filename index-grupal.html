const CURRENT_APP_BUILD=document.querySelector('meta[name="gscg-release"]')?.content||"";

function appVersionLabel(build){
  const match=String(build||"").match(/-R(\d+(?:\.\d+)?)(?:-[A-Z0-9]+)?$/i);
  return match?`R${match[1]}`:String(build||"—");
}
function paintAppVersionBadge(latestBuild=""){
  const badge=$("appReleaseBadge");
  const current=SERVER_RELEASE_LABEL||appVersionLabel(CURRENT_APP_BUILD),latest=appVersionLabel(latestBuild);
  if(badge)badge.textContent=latestBuild&&latestBuild!==CURRENT_APP_BUILD?`VERSIÓN ${current} · ÚLTIMA ${latest}`:`VERSIÓN ${current}`;

let appBuildCheckRunning=false,appBuildReloading=false,pendingPublishedBuild="";
function showBuildCheckFailure(needsAccess=false){

}
function showCurrentBuild(){
  $("mandatoryUpdateButton").dataset.needsAccess="0";

  $("mandatoryUpdateAction").textContent="ACTUALIZADO";
  const updateBox=$("mandatoryUpdate");updateBox.classList.remove("available");updateBox.style.display="none";

function showMandatoryUpdate(build){
  if(!build||build===CURRENT_APP_BUILD)return false;
  pendingPublishedBuild=build;
  const button=$("mandatoryUpdateButton");button.disabled=false;button.setAttribute("aria-disabled","false");
  $("mandatoryUpdateAction").textContent="ACTUALIZAR";
  const updateBox=$("mandatoryUpdate");updateBox.style.display="";updateBox.classList.add("available");
  paintAppVersionBadge(build);

}
async function installMandatoryUpdate(){
  if(appBuildReloading)return;
  if(!pendingPublishedBuild){
    if($("mandatoryUpdateButton").dataset.needsAccess==="1")location.assign(new URL("/access.html",location.origin).href);
    else await syncPublishedAppVersion();
    return;
  }
  appBuildReloading=true;
  if($("setupOverlay")?.classList.contains("visible")){captureVisibleRegistrationValues();syncDraftPlayersFromManualRows({strict:false,renderAfter:false});persistDraftState()}
  persist();
  try{
    if("caches" in window)for(const key of await caches.keys())if(key.startsWith("gscg-mobile-"))await caches.delete(key);
  }catch(error){console.warn("APP_UPDATE_RESET",error?.message||error)}
  const nextUrl=new URL("/index-grupal.html",location.origin);nextUrl.searchParams.set("__gscg_build_check","1");nextUrl.searchParams.set("app_version",pendingPublishedBuild);nextUrl.searchParams.set("update_check",String(Date.now()));location.replace(nextUrl.toString());

async function syncPublishedAppVersion(){
  if(appBuildCheckRunning||appBuildReloading||document.hidden)return;
  appBuildCheckRunning=true;
  try{
    const checkUrl=new URL("/release.json",location.origin);
    checkUrl.searchParams.set("t",String(Date.now()));
    const response=await fetch(checkUrl,{cache:"no-store",headers:{"Cache-Control":"no-cache"}});
    if(!response.ok){showBuildCheckFailure();return}
    const release=await response.json().catch(()=>({}));
    const published=String(release.release||"");
    if(!published){showBuildCheckFailure();return}
    if(published===CURRENT_APP_BUILD)showCurrentBuild();else showMandatoryUpdate(published);
  }catch(error){showBuildCheckFailure();console.warn("APP_VERSION_SYNC",error?.message||error)}
  finally{appBuildCheckRunning=false}
}
