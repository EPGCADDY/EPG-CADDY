async function guardVisibleRegistrationBeforeOk(event){
  const button=$("setupOk");
  if(!button||event?.target!==button)return;
  const rows=[...document.querySelectorAll("#detectedBody [data-draft-row]")];
  for(const rowElement of rows){
    const index=Number(rowElement.dataset.draftRow);
    const name=String(rowElement.querySelector("[data-draft-name]")?.value||"").trim();
    const category=String(rowElement.querySelector("[data-draft-category]")?.value||"").trim();
    const handicapText=String(rowElement.querySelector("[data-draft-hcp]")?.value??"").trim();
    const tee=String(rowElement.querySelector("[data-draft-tee]")?.value||"").trim();
    const whatsapp=String(rowElement.querySelector("[data-draft-whatsapp]")?.value||"").trim();
    const hasData=!!(name||category||handicapText||tee||whatsapp);
    if(!hasData)continue;
    let field="";
    if(!name)field="name";
    else if(!category)field="category";
    else if(handicapText===""||!Number.isSafeInteger(Number(handicapText)))field="handicap";
    else if(!tee)field="tee";
    if(!field)continue;
    event.preventDefault();
    event.stopImmediatePropagation();
    captureVisibleRegistrationValues();
    const ignored=await registrationMissingPrompt(index,field);
    if(ignored)setTimeout(()=>button.click(),0);
    return;
  }
}

  }
  async function activeTournaments(){
    const response=await fetch("/api/live",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"list_active_tournaments"}),cache:"no-store"});
    const data=await response.json().catch(()=>({})); if(!response.ok||data?.ok!==true)throw new Error(data?.code||"LIVE_TOURNAMENT_LIST_FAILED");
    return Array.isArray(data.tournaments)?data.tournaments:[];
  }
  function openExistingConnect(pick){
    const launch=document.getElementById("gscLiveLaunch");if(launch)launch.click();
    setTimeout(()=>{
      const toggle=document.getElementById("liveOrganizerToggle"),panel=document.getElementById("liveOrganizerPanel");
      if(toggle&&panel?.classList.contains("hidden"))toggle.click();
      const group=document.getElementById("liveGroupLabel");
      if(group&&!group.value.trim())group.value="GRUPO";
      const owned=live().tournamentOwned;
      const code=document.getElementById("liveJoinCode");
      if(code&&owned?.name===pick.label&&owned?.joinCode)code.value=owned.joinCode;
      document.getElementById("liveJoinTournament")?.scrollIntoView({block:"center",behavior:"smooth"});
    },80);
  }
  document.querySelectorAll("[data-gsc-tournament-picker]").forEach(button=>button.addEventListener("click",async()=>{
    const panel=button.closest(".gsc-tournament-connect"),list=panel.querySelector("[data-gsc-tournament-list]");
    list.innerHTML='<button type="button">BUSCANDO TORNEOS EN JUEGO…</button>';list.classList.remove("hidden");
    try{
      const items=await activeTournaments();
      list.innerHTML=items.length?items.map((item,i)=>'<button type="button" data-tour-i="'+i+'">'+esc(item.name)+'</button>').join(""):'<button type="button" disabled>NO HAY TORNEOS EN JUEGO</button>';
      list.querySelectorAll("[data-tour-i]").forEach((row,i)=>row.onclick=()=>{const item=items[i];write(PENDING_KEY,{label:item.name,id:item.id,mode:item.mode||""});list.classList.add("hidden");render()});
    }catch(error){list.innerHTML='<button type="button" disabled>NO SE PUDO CARGAR TORNEOS</button>'}
  }));
  document.querySelectorAll("[data-gsc-tournament-create]").forEach(button=>button.addEventListener("click",async()=>{
    const name=prompt("NOMBRE DEL TORNEO");if(!name?.trim())return;
    button.disabled=true;button.textContent="CREANDO…";
    try{
      const mode=(window.round?.mode||"general"),result=await window.GSCLiveControl?.createTournamentDirect?.(name.trim(),mode);
      if(!result?.ok)throw new Error(result?.code||"LIVE_CREATE_FAILED");
      write(PENDING_KEY,{label:result.name,id:result.tournamentId,mode:result.mode||mode});render();button.textContent="TORNEO CREADO";
    }catch(error){button.textContent=String(error?.message||"NO SE PUDO CREAR").replace(/^LIVE_/,"").replaceAll("_"," ")}
    finally{button.disabled=false;setTimeout(()=>{button.textContent="CREAR TORNEO";render()},1800)}
  }));
  document.querySelectorAll("[data-gsc-tournament-action]").forEach(button=>button.addEventListener("click",async()=>{
    button.disabled=true;
    try{
      if(connected()){
        const result=await window.GSCLiveControl?.disconnectTournament?.();
        if(!result?.ok)throw new Error(result?.code||"LIVE_LEAVE_FAILED");
        render();return;
      }
      const pick=selected();if(!pick.id){button.textContent="SELECCIONA TORNEO";return}
      const groupLabel=(window.round?.liveGroupLabel||window.round?.players?.[0]?.name&&("GRUPO "+window.round.players[0].name)||"GRUPO");
      const result=await window.GSCLiveControl?.connectTournamentById?.(pick.id,groupLabel);
      if(!result?.ok)throw new Error(result?.code||"LIVE_JOIN_FAILED");
      render();
    }catch(error){button.textContent=String(error?.message||"NO SE PUDO CONECTAR").replace(/^LIVE_/,"").replaceAll("_"," ")}
    finally{button.disabled=false;setTimeout(render,1800)}
  }));
  window.addEventListener("storage",render);document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});render();
});
</script>
