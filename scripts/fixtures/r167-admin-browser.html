const baseline={"html": "<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Administrar torneos y grupos</title><link rel=\"stylesheet\" href=\"/gsc-design-system.css\"><style>[hidden]{display:none!important}body{margin:0;background:#050705;color:#fff;font:16px Arial}main{max-width:680px;margin:24px auto;padding:20px}h1,h2{color:#31ff00}h1{font-size:28px}summary{cursor:pointer;color:#31ff00;font-weight:bold;padding:16px 0}details{margin:18px 0}article h3{margin-top:0}button,a{min-height:44px;padding:12px;border:1px solid #31ff00;border-radius:10px;background:#080808;color:#31ff00;display:inline-block;margin:8px 4px 8px 0;font-weight:bold}input{display:block;box-sizing:border-box;width:100%;padding:12px;margin:8px 0;background:#111;color:white;border:1px solid #666;border-radius:8px}article,fieldset{border:1px solid #555;border-radius:12px;padding:16px;margin:16px 0}output{display:block;overflow-wrap:anywhere;color:#31ff00}button.danger{color:#ff5555;border-color:#ff5555}label{display:block}dialog{background:#080808;color:#fff;max-width:520px;width:80%;border:1px solid #31ff00;border-radius:14px}dialog::backdrop{background:#000c}</style></head><body class=\"gsc-admin-page\"><main><a data-gsc-close aria-label=\"Cerrar\" href=\"/index-grupal.html?round_return=1\">ATRÁS · MI TARJETA</a><h1>ADMINISTRAR TORNEOS Y GRUPOS</h1><button id=\"refresh\">ACTUALIZAR LISTA</button><p id=\"status\" role=\"status\" aria-live=\"polite\"></p><details id=\"administrativePermissions\"><summary>PERMISOS ADMINISTRATIVOS</summary><p>Estos permisos permiten administrar eventos. Para jugar un torneo, ingresa el código en TORNEO, dentro de Modalidad.</p><button id=\"ownerLogin\">INICIAR SESIÓN DE PROPIETARIO</button><p id=\"identity\"></p><button id=\"organizerPermissions\" hidden>AUTORIZAR ORGANIZADORES</button><section><label>Código administrativo<input id=\"code\" autocomplete=\"off\"></label><button id=\"redeem\">ACTIVAR MI PERMISO</button></section></details><section id=\"events\"></section><dialog id=\"actionDialog\"><form method=\"dialog\"><button data-gsc-close aria-label=\"Cerrar\">×</button><button data-gsc-menu type=\"button\" onclick=\"this.closest('dialog').close();window.GSCShortcutsUI.open()\">MENÚ</button></form><section id=\"action\"></section><p id=\"actionStatus\" role=\"status\"></p></dialog><script src=\"/auth-gate.js\"><\/script><script src=\"/whatsapp-invitations.js\"><\/script><script src=\"/personal-events.js\"><\/script><script type=\"module\" src=\"/event-administration-ui.js\"><\/script></main><script src=\"/shortcuts-ui.js\"><\/script></body></html>\n", "ui": "const $=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst messages={EVENT_ADMIN_REQUIRED:'NO TIENES PERMISO PARA ELIMINAR ESTE EVENTO',EVENT_NAME_CONFIRMATION_REQUIRED:'ESCRIBE EL NOMBRE EXACTO DEL EVENTO',EVENT_DELETE_REASON_REQUIRED:'ESCRIBE EL MOTIVO',ADMIN_RECIPIENT_REQUIRED:'INDICA EL NOMBRE Y CÓDIGO PERSONAL DE LA PERSONA',ADMIN_CODE_INVALID:'CÓDIGO INCORRECTO, USADO, VENCIDO O ASIGNADO A OTRA PERSONA',ACCOUNT_UNAUTHORIZED:'INICIA TU SESIÓN DE PROPIETARIO PARA TENER CONTROL PLENO',LIVE_EXPIRED:'EL EVENTO O PERMISO VENCIÓ'};\nasync function call(action,payload={}){try{const response=await fetch('/api/event-administration',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...payload})});return{...await response.json(),ok:response.ok}}catch{return{ok:false,code:'NETWORK_ERROR'}}}\nfunction showStatus(result,id='status'){ $(id).textContent=result.ok?'LISTO':messages[result.code]||'NO SE PUDO COMPLETAR · '+result.code }\nlet requestedEventOpened=false;\nconst format=at=>new Date(at).toLocaleString('es-GT',{timeZone:'America/Guatemala'});\nasync function refresh(){const result=await call('list');showStatus(result);if(!result.ok)return;$('organizerPermissions').hidden=!result.owner;$('ownerLogin').hidden=!!result.owner;$('identity').textContent=(result.owner?'PROPIETARIO · CONTROL PLENO':'MI CÓDIGO PERSONAL: '+result.accountCode);await window.GSCPersonalEvents.sync();const codes=await window.GSCPersonalEvents.organizerCodes();$('events').innerHTML='<h2>TORNEOS Y GRUPOS</h2>'+result.events.map(e=>'<article><h3>'+escape(e.name)+'</h3><p>'+escape(e.event_kind==='private'?'GRUPO':'TORNEO')+'</p>'+(codes[e.id]?'<p>ID DE TORNEO · UN SOLO USO</p><output>'+escape(codes[e.id])+'</output><button data-copy-tournament=\"'+escape(e.id)+'\">COPIAR ID</button><button data-share-tournament=\"'+escape(e.id)+'\">COMPARTIR POR WHATSAPP</button>':'')+'<button class=\"danger\" data-delete=\"'+escape(e.id)+'\">ELIMINAR</button>'+(e.authority!=='delegate'?'<details><summary>PERMISOS</summary><button data-grants=\"'+escape(e.id)+'\">COMPARTIR / REVOCAR PERMISO</button></details>':'')+'</article>').join('');if(!result.events.length)$('events').insertAdjacentHTML('beforeend','<p>NO HAY TORNEOS NI GRUPOS DISPONIBLES.</p>');document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(result.events.find(e=>e.id===b.dataset.delete)));document.querySelectorAll('[data-grants]').forEach(b=>b.onclick=()=>grants(result.events.find(e=>e.id===b.dataset.grants)));document.querySelectorAll('[data-copy-tournament]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(codes[b.dataset.copyTournament]);$('status').textContent='ID COPIADO'}catch{$('status').textContent='NO SE PUDO COPIAR'}});document.querySelectorAll('[data-share-tournament]').forEach(b=>b.onclick=async()=>{const e=result.events.find(e=>e.id===b.dataset.shareTournament);const grant=await window.GSCPersonalEvents.request('organizer-entry-code',{eventId:e.id,eventKind:'tournament'});if(!grant.ok){showStatus(grant);return}window.GSCWhatsAppInvitations.open({kind:'tournament',code:grant.joinCode,eventName:e.name},()=>{})});const params=new URLSearchParams(location.search),requested=result.events.find(e=>e.id===params.get('eventId')&&e.event_kind===params.get('eventKind'));if(requested&&!requestedEventOpened){requestedEventOpened=true;remove(requested)}}\nfunction event(e){return{eventId:e.id,eventKind:e.event_kind}}\nfunction preserveReturnTarget(){const link=document.querySelector('[data-gsc-close]'),target=new URLSearchParams(location.search).get('returnTo');if(!link||!target)return;try{const destination=new URL(target,location.origin);if(destination.origin===location.origin&&destination.pathname==='/index-grupal.html')link.href=destination.pathname+destination.search+destination.hash}catch{}}\npreserveReturnTarget();\nfunction open(content){$('action').innerHTML=content;$('actionStatus').textContent='';$('actionDialog').showModal()}\nfunction remove(e){open('<h2>CONFIRMAR ELIMINAR</h2><p>'+escape(e.name)+'</p><button class=\"danger\" id=\"confirmDelete\">ELIMINAR</button>');$('confirmDelete').onclick=async()=>{const b=$('confirmDelete');b.disabled=true;const result=await call('delete',{...event(e),confirmName:e.name,reason:'Eliminación confirmada por el usuario'});showStatus(result,'actionStatus');if(result.ok){$('actionDialog').close();await refresh()}else b.disabled=false}}\nasync function grants(e){const result=await call('grants',event(e));if(!result.ok){showStatus(result);return}open('<h2>PERMISOS · '+escape(e.name)+'</h2><p>Cada código sólo puede activarlo la persona a quien se asignó. Pídele su código personal de esta pantalla.</p><label>Nombre de la persona<input id=\"recipientName\" maxlength=\"120\"></label><label>Su código personal<input id=\"recipientAccountId\" maxlength=\"160\"></label><button id=\"issue\">GENERAR CÓDIGO</button><output id=\"issued\"></output>'+result.grants.map(g=>'<article><p>'+escape(g.recipient_name)+' · ADM-'+escape(g.id)+'</p><p>'+escape(g.revoked_at?'REVOCADO':'VENCE '+format(g.expires_at))+'</p>'+(!g.revoked_at?'<button data-revoke=\"'+escape(g.id)+'\">REVOCAR PERMISO</button>':'')+'</article>').join(''));$('issue').onclick=async()=>{const b=$('issue');b.disabled=true;const response=await call('issue',{...event(e),recipientName:$('recipientName').value,recipientAccountId:$('recipientAccountId').value});showStatus(response,'actionStatus');if(response.ok){$('issued').textContent=response.codeLabel+' · COPIA Y COMPARTE ESTE CÓDIGO: '+response.code+' · VENCE '+format(response.expiresAt)}else b.disabled=false};document.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=async()=>{const response=await call('revoke',{...event(e),grantId:b.dataset.revoke});showStatus(response,'actionStatus');if(response.ok){$('actionDialog').close();await grants(e)}})}\n$('ownerLogin').onclick=()=>window.GSCOpenAccountLogin();window.addEventListener('gsc-account-ready',refresh);\n$('redeem').onclick=async()=>{const result=await call('redeem',{code:$('code').value.trim()});showStatus(result);if(result.ok){$('code').value='';await refresh()}};$('refresh').onclick=refresh;\n// Prepare only a device identity, never create a tournament or round.\nawait fetch('/api/personal-events',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'identity'})});await refresh();\n\nasync function organizers(){const result=await call('organizer-list');if(!result.ok){showStatus(result);return}open('<h2>AUTORIZAR ORGANIZADORES</h2><p>Permiso individual para crear torneos durante 24 horas; no concede eliminación de eventos ajenos.</p><label>Nombre<input id=\"organizerName\" maxlength=\"120\"></label><label>Código personal del destinatario<input id=\"organizerAccount\" maxlength=\"160\"></label><button id=\"issueOrganizer\">GENERAR AUTORIZACIÓN</button><output id=\"organizerIssued\"></output>'+result.grants.map(g=>'<article>'+escape(g.recipient_name)+' · '+escape(g.recipient_account_id)+' · '+escape(g.revoked_at?'REVOCADO':format(g.expires_at))+(!g.revoked_at?'<button data-revoke-organizer=\"'+escape(g.id)+'\">REVOCAR</button>':'')+'</article>').join(''));$('issueOrganizer').onclick=async()=>{const granted=await call('organizer-issue',{recipientName:$('organizerName').value,recipientAccountId:$('organizerAccount').value});showStatus(granted,'actionStatus');if(granted.ok){$('organizerIssued').textContent=granted.code+' · VENCE '+format(granted.expiresAt);const copy=document.createElement('button');copy.textContent='COPIAR CÓDIGO';copy.onclick=()=>navigator.clipboard.writeText(granted.code);$('organizerIssued').after(copy)}};document.querySelectorAll('[data-revoke-organizer]').forEach(button=>button.onclick=async()=>{const result=await call('organizer-revoke',{grantId:button.dataset.revokeOrganizer});showStatus(result,'actionStatus');if(result.ok)await organizers()})}\n$('organizerPermissions').onclick=organizers;\n"};const setup="window.fetch=async(url,options={})=>{let data={};try{data=JSON.parse(options.body||'{}')}catch{}const e={eventId:'qa-event',id:'qa-event',name:'EPG QA',eventKind:'tournament',event_kind:'tournament',role:'organizer',status:'active',authority:'creator'};let result={ok:true,personalCode:'qa-account',accountCode:'qa-account',owner:true,events:[e],aliases:[]};if(data.action==='organizer-entry-code')result={ok:true,joinCode:'QA12345678'};if(data.action==='read')result={ok:true,tournament:{name:'EPG QA',configuration:{}},membership:{role:'organizer'}};return new Response(JSON.stringify(result),{status:200,headers:{'Content-Type':'application/json'}})};navigator.share=async({text})=>{let log=document.getElementById('qaShareLog');if(!log){log=document.createElement('pre');log.id='qaShareLog';log.style.cssText='position:fixed;bottom:0;left:0;z-index:50000;background:#fff;color:#000;font-size:12px;max-height:120px;overflow:auto';document.body.append(log)}log.textContent+=text+'\\n---\\n'};";async function show(before){await new Promise(resolve=>setTimeout(resolve,0));let html=before?baseline.html:await (await fetch('/event-administration.html')).text();if(before)html=html.replace('<script type="module" src="/event-administration-ui.js"></'+'script>','<script type="module">'+baseline.ui+'</'+'script>');html=html.replace('<script src="/auth-gate.js"></'+'script>','');html=html.replace('<script src="/whatsapp-invitations.js">','<script>'+setup+'</'+'script><script src="/whatsapp-invitations.js">');document.open();document.write(html);document.close()}const params=new URLSearchParams(location.search);if(params.has('frame'))show(params.has('before'));else{const frame=document.getElementById('app');document.getElementById('before').onclick=()=>frame.src=location.pathname+'?frame=1&before=1';document.getElementById('after').onclick=()=>frame.src=location.pathname+'?frame=1';frame.src=location.pathname+'?frame=1'+(params.has('before')?'&before=1':'')}
