name: Stableford V218 roster fallback
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v218-roster-fallback.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
          fetch-depth: 0
      - name: Fill emergency Stableford roster
        shell: python
        run: |
          from pathlib import Path
          p=Path('stableford.js'); s=p.read_text(encoding='utf-8')
          old='''    const categoryButtons=[...document.querySelectorAll("[data-stableford-category]")];'''
          new='''    if(new URLSearchParams(location.search).get("stableford_emergency")==="countryclub"){const names=["Jaime","Junior","Adolfo","Herny"];document.querySelectorAll("[data-stableford-name]").forEach((el,i)=>{if(i<4){el.value=names[i];el.dispatchEvent(new Event("input",{bubbles:true}));el.dispatchEvent(new Event("change",{bubbles:true}))}})}\n    const categoryButtons=[...document.querySelectorAll("[data-stableford-category]")];'''
          if s.count(old)!=1: raise SystemExit('roster anchor mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "stableford.js"
          grep -Fq '["Jaime","Junior","Adolfo","Herny"]' stableford.js
          node --check stableford.js
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stableford.js
          git commit -m 'Stableford V218 preload emergency qualifying roster'
          git push origin stableford-tournament-final