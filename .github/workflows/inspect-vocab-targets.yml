name: Inspect vocab targets
on:
  push:
    branches: [grupal-dev]
    paths: ['.github/workflows/inspect-vocab-targets.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grupal-dev
      - name: Inspect functions
        shell: python
        run: |
          from pathlib import Path
          s=Path('index-grupal.html').read_text(encoding='utf-8')
          for key in ['function parseRoundQueryTranscript','function renderDraft','function finalizeRoundDictation']:
              i=s.find(key)
              print('\n###',key,'at',i)
              print(s[i:i+7000] if i>=0 else 'NOT FOUND')
