name: Stableford V210 emergency group
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v210-emergency-group.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
          fetch-depth: 0
      - name: Preload tomorrow Country Club Stableford group only
        shell: python
        run: |
          from pathlib import Path
          p=Path('stableford.js'); s=p.read_text(encoding='utf-8')
          anchor='''      const inputs=[...document.querySelectorAll("[data-stableford-name]")];\n      for(const input of inputs)input.value="";'''
          replacement='''      const inputs=[...document.querySelectorAll("[data-stableford-name]")];\n      const emergencyCountryClubGroup=["Jaime","Junior","Adolfo","Herny"];\n      for(const [i,input] of inputs.entries())input.value=emergencyCountryClubGroup[i]||"";'''
          if s.count(anchor)!=1: raise SystemExit(f'preload anchor count={s.count(anchor)}')
          p.write_text(s.replace(anchor,replacement,1),encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "stableford.js"
          grep -Fq '["Jaime","Junior","Adolfo","Herny"]' stableford.js
          git diff --quiet HEAD -- index-grupal.html api/session-grupal.js stableford-torneo.html
          node --check stableford.js
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stableford.js
          git commit -m 'Stableford V210 preload Country Club qualifying group'
          git push origin stableford-tournament-final