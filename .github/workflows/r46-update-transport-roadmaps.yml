name: R46 Update Transport Roadmaps
on:
  push:
    branches:
      - lab/update-transport-validation-r46
permissions:
  contents: write
jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/update-transport-validation-r46
          fetch-depth: 2
      - name: Register R46 transport validation atomically
        shell: python
        run: |
          from pathlib import Path
          block='''\n## V407-R46 LAB · prueba física aislada del transporte ACTUALIZAR · 11 de septiembre de 2026\n\n- Prueba de transporte pura desde R43: no incorpora R44/R45 ni cambios funcionales; únicamente avanza la identidad publicada a R46 para demostrar en iPhone el ciclo R43 → ACTUALIZAR → R46 conservando la ronda.\n- `scripts/apply-update-e.mjs` conserva el motor aprobado `update-client-e.js` intacto y genera el shell instalado por Arquitectura E.\n- Criterio bloqueante: no se considera aprobado hasta prueba física en el iPhone instalado. La publicación funcional queda detenida hasta cerrar este circuito.\n- Incidencia detectada: el candado anterior verificaba motor/release/shell, pero no obligaba a que cambios funcionales posteriores avanzaran candidato + release; ese hueco debe convertirse en FAIL automático antes de futuras publicaciones.\n- Archivos de esta prueba: `scripts/apply-update-e.mjs`, `api/release.js`, `ROADMAP_OVERALL.md`, `ROADMAP_A_DETALLE.md`. MAIN y MAESTRO permanecen intactos.\n'''
          for name in ('ROADMAP_OVERALL.md','ROADMAP_A_DETALLE.md'):
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              if 'V407-R46 LAB · prueba física aislada del transporte ACTUALIZAR' not in text:
                  p.write_text(text+block,encoding='utf-8')
      - name: Commit both roadmaps in one commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ROADMAP_OVERALL.md ROADMAP_A_DETALLE.md
          git commit -m "R46 LAB: register updater transport validation in both roadmaps"
          git push origin HEAD:lab/update-transport-validation-r46
