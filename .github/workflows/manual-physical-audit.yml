name: LAB physical manual visual audit
on:
  push:
    branches: [laboratorio]
permissions:
  contents: read
jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: laboratorio
      - name: Install browser renderer
        run: |
          mkdir -p /tmp/manual-render
          cd /tmp/manual-render
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-audit --no-fund
          npx playwright install chromium
          python3 -m pip install --user pillow
      - name: Render all 61 manual pages physically
        run: |
          python3 -m http.server 8765 >/tmp/manual-http.log 2>&1 &
          sleep 2
          mkdir -p manual-physical-audit
          cat > /tmp/manual-render/render.cjs <<'NODE'
          const { chromium }=require('/tmp/manual-render/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:430,height:932},deviceScaleFactor:2});
            await page.goto('http://127.0.0.1:8765/manual.html',{waitUntil:'networkidle'});
            const count=await page.locator('.page').count();
            if(count!==61) throw new Error('Expected 61 pages, got '+count);
            const rows=[];
            for(let i=0;i<count;i++){
              await page.evaluate(n=>show(n),i);
              await page.waitForTimeout(60);
              const p=page.locator('.page').nth(i);
              const box=await p.boundingBox();
              const text=(await p.innerText()).replace(/\s+/g,' ').trim();
              const overflow=await p.evaluate(el=>({scrollWidth:el.scrollWidth,clientWidth:el.clientWidth,scrollHeight:el.scrollHeight,clientHeight:el.clientHeight}));
              await p.screenshot({path:`manual-physical-audit/p${String(i).padStart(2,'0')}.png`});
              rows.push({page:i,id:await p.getAttribute('id'),height:Math.round(box?.height||0),width:Math.round(box?.width||0),textChars:text.length,...overflow});
            }
            require('fs').writeFileSync('manual-physical-audit/metrics.json',JSON.stringify(rows,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/manual-render/render.cjs
          python3 - <<'PY'
          from PIL import Image,ImageOps,ImageDraw
          from pathlib import Path
          files=sorted(Path('manual-physical-audit').glob('p*.png'))
          thumbs=[]
          for f in files:
              im=Image.open(f).convert('RGB')
              im.thumbnail((220,420))
              canvas=Image.new('RGB',(230,450),'white')
              canvas.paste(im,((230-im.width)//2,20))
              d=ImageDraw.Draw(canvas); d.text((8,5),f.stem,fill='black')
              thumbs.append(canvas)
          cols=5
          rows=(len(thumbs)+cols-1)//cols
          sheet=Image.new('RGB',(cols*230,rows*450),'white')
          for i,im in enumerate(thumbs): sheet.paste(im,((i%cols)*230,(i//cols)*450))
          sheet.save('manual-physical-audit/contact-sheet.jpg',quality=88)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: manual-physical-audit-61-pages
          path: manual-physical-audit
          retention-days: 1
