name: Stableford V211 emergency reset
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v211-emergency-reset.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
          fetch-depth: 0
      - name: Add explicit emergency launch flag only
        shell: python
        run: |
          from pathlib import Path
          p=Path('stableford.js'); s=p.read_text(encoding='utf-8')
          marker='''  function installStablefordUi(){\n    if(typeof document==="undefined")return false;'''
          replacement='''  function installStablefordUi(){\n    if(typeof document==="undefined")return false;\n    try{\n      const params=new URLSearchParams(location.search);\n      if(params.get("stableford_emergency")==="countryclub"){\n        localStorage.removeItem("gscg_round_v1");\n        localStorage.removeItem("gscg_round");\n        sessionStorage.setItem("gscg_stableford_emergency","countryclub");\n      }\n    }catch{}'''
          if s.count(marker)!=1: raise SystemExit(f'install anchor count={s.count(marker)}')
          p.write_text(s.replace(marker,replacement,1),encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "stableford.js"
          grep -Fq 'stableford_emergency' stableford.js
          git diff --quiet HEAD -- index-grupal.html api/session-grupal.js stableford-torneo.html
          node --check stableford.js
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stableford.js
          git commit -m 'Stableford V211 add explicit emergency stale-round reset'
          git push origin stableford-tournament-final