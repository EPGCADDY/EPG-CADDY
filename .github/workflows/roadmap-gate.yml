name: ROADMAP mandatory gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  roadmap-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Block any change missing from both ROADMAPS
        env:
          ROADMAP_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          ROADMAP_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/roadmap-gate.mjs "$ROADMAP_BASE_SHA" "$ROADMAP_HEAD_SHA"

      - name: Block visible differences between sister registration cards
        run: node test-v304-homogeneous-registration-actions.mjs

      - name: Block navigation, history and overlap regressions
        run: node test-v305-history-navigation-zero-error.mjs

      - name: Block false registration guides and mismatched OK states
        run: node test-v305-registration-guides-parser-truth.mjs

      - name: Block Match Play net, indicator and closure regressions
        run: node test-v306-match-play.mjs

      - name: Block thin Match Play arrows and verbose format labels
        run: node test-v307-match-arrows-format.mjs

      - name: R75 diagnostic · tournament navigation
        run: node test-lab-tournament-navigation.mjs

      - name: R75 diagnostic · release contract
        run: node test-lab-r60-production-refresh.mjs

      - name: R75 diagnostic · physical matrix
        run: node test-lab-r60-physical-matrix.mjs

      - name: R75 diagnostic · final-card actions
        run: node test-lab-r60-card-actions-physical.mjs

      - name: R75 diagnostic · manual parity
        run: node scripts/manual-screen-parity-gate.mjs

      - name: R80 card diagnostic · general clean header
        run: node scripts/r80-card-diagnostic.mjs general

      - name: R80 card diagnostic · stableford clean header
        run: node scripts/r80-card-diagnostic.mjs stableford

      
      - name: R80 card diagnostic · category matrix
        run: node scripts/r80-card-diagnostic.mjs matrix

      - name: R80 card diagnostic · stableford extended
        run: node scripts/r80-card-diagnostic.mjs stableford2

      - name: R80 card diagnostic · universales
        run: node scripts/r80-card-diagnostic.mjs universales

      - name: R80 card diagnostic · legacy contamination
        run: node scripts/r80-card-diagnostic.mjs legacy

      - name: R80 card diagnostic · baseline extras
        run: node scripts/r80-card-last-diagnostic.mjs baseline

      - name: R80 card diagnostic · matrix personal
        run: node scripts/r80-card-last-diagnostic.mjs personal-matrix

      - name: R80 card diagnostic · stableford title only
        run: node scripts/r80-card-title-diagnostic.mjs title

      - name: R80 card diagnostic · stableford hash only
        run: node scripts/r80-card-title-diagnostic.mjs hash

      - name: R80 card diagnostic · stableford hash/title
        run: node scripts/r80-card-last-diagnostic.mjs stableford-hash

      - name: R80 diagnostic · card artifacts
        run: node test-card-artifacts.mjs

      - name: R80 diagnostic · card viewer actions
        run: node test-lab-r60-card-actions-physical.mjs

      - name: R80 diagnostic · shortcuts navigation
        run: node test-lab-shortcuts-navigation.mjs

      - name: R80 diagnostic · release sync
        run: node test-lab-r60-production-refresh.mjs

      - name: Block retired microphone and AI regressions; preserve current LAB profile
        run: node scripts/build-manual-lab.mjs
