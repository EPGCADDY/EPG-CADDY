name: ROADMAP mandatory gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  roadmap-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Block any change missing from both ROADMAPS
        env:
          ROADMAP_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          ROADMAP_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/roadmap-gate.mjs "$ROADMAP_BASE_SHA" "$ROADMAP_HEAD_SHA"

      - name: Block visible differences between sister registration cards
        run: node test-v304-homogeneous-registration-actions.mjs

      - name: Block navigation, history and overlap regressions
        run: node test-v305-history-navigation-zero-error.mjs

      - name: Block false registration guides and mismatched OK states
        run: node test-v305-registration-guides-parser-truth.mjs

      - name: Block Match Play net, indicator and closure regressions
        run: node test-v306-match-play.mjs

      - name: Block thin Match Play arrows and verbose format labels
        run: node test-v307-match-arrows-format.mjs

      - name: Block iPhone microphone and universal voice regressions
        run: node test-v357-ios-voice-transport-recovery.mjs

      - name: Block delayed multi-hole rendering and round-loss regressions
        run: node test-v357-synchronized-progressive-voice.mjs

      - name: Block synchronized parser, persistence and male-voice regressions
        run: npm run intocables:gate && npm run behavior:recorded-gate && node test-v359-ios-score-parser-recovery.mjs && node test-v361-synchronized-voice.mjs && node test-v362-physical-voice-recovery.mjs && node test-v363-external-service-recovery.mjs && node test-v364-voice-traffic-live-recovery.mjs && node test-v365-multiprovider-male-voice.mjs

      - name: Preserve approved voice behavior V354 through V356
        run: node test-v354-voice-fallback.mjs && node test-v355-ios-audio-dictation.mjs && node test-v356-voice-only-cedar-quality.mjs

      - name: Preserve approved traffic and weather behavior
        run: node test-v324-real-traffic.mjs && node test-v337-universal-weather.mjs && node test-v356-traffic-weather-accuracy.mjs
