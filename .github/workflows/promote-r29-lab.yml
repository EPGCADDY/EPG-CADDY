name: Promote verified R29 to stable LAB alias
on:
  push:
    branches:
      - lab/v407-r24-whatsapp-registration
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Promote exact READY R29 deployment inside LAB project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          npx --yes vercel@48.10.0 promote https://golf-sc-gt-mh94nha57-epgcaddys-projects.vercel.app --scope epgcaddys-projects --token "$VERCEL_TOKEN" --yes
