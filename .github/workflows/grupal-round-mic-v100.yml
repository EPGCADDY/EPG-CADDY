name: Grupal round mic V100
on:
  push:
    branches: [grupal-dev]
    paths: ['.github/workflows/grupal-round-mic-v100.yml']
permissions:
  contents: write
jobs:
  patch-audit-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grupal-dev
          fetch-depth: 0
      - name: Patch round transcription prompt only
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index-grupal.html')
          s=p.read_text(encoding='utf-8')
          oldmeta='<meta name="gscg-build" content="V99-CARD-MIC-TOUCH-HARDENED-20260817">'
          if s.count(oldmeta)!=1: raise SystemExit('Unexpected build baseline')
          s=s.replace(oldmeta,'<meta name="gscg-build" content="V100-ROUND-MIC-SESSION-STABLE-20260817">',1)
          start=s.index('function roundSessionConfig(){')
          end=s.index('async function configureSessionFor(context)', start)
          block=s[start:end]
          pat=r'prompt:`Golf Guatemala\. Jugadores actuales: \$\{knownNames\}\..*?`\},noise_reduction:'
          repl='prompt:`Golf Guatemala. Jugadores actuales: ${knownNames}. Transcribe literalmente nombres, hoyo y score o Gross. Vocabulario esperado: águila, eagle, birdie, par, even par, bogey, doble bogey, triple bogey, doble par, corrección, corrijo, corregir, acumulado, agregar jugador, quitar jugador, corregir nombre, corregir handicap, rectificación de handicap y Stop. Conserva exactamente los nombres registrados. Jessie se escribe siempre Jessie. No reordenes nombres ni números.`},noise_reduction:'
          newblock,n=re.subn(pat,repl,block,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'round prompt replacement count={n}')
          s=s[:start]+newblock+s[end:]
          p.write_text(s,encoding='utf-8')
      - name: Audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index-grupal.html').read_text(encoding='utf-8')
          assert 'V100-ROUND-MIC-SESSION-STABLE-20260817' in s
          assert s.count('function roundSessionConfig()') == 1
          assert s.count('function setupSessionConfig()') == 1
          assert s.count('function recordScore') == 1
          assert s.count('function recordScores') == 1
          assert 'fetch("/api/session-grupal"' in s
          assert 'silence_duration_ms:3000' in s
          assert 'Jugadores actuales: ${knownNames}. Transcribe literalmente nombres, hoyo y score o Gross.' in s
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/g.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/g.js
          git diff --check
          test "$(git diff --name-only)" = "index-grupal.html"
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "grupal-dev"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-grupal.html
          git commit -m "[mic] stabilize round Realtime session prompt"
          git push origin HEAD:grupal-dev
