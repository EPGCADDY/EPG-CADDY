name: Grupal V110C mic tap recovery

on:
  push:
    branches: [grupal-dev]
    paths:
      - '.github/workflows/grupal-v110c-mic-tap-recovery.yml'

permissions:
  contents: write

jobs:
  patch-audit-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grupal-dev
          fetch-depth: 0
      - name: Patch V110 mic tap recovery
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html'); s=p.read_text(encoding='utf-8')
          def rep(old,new,count=1):
              global s
              n=s.count(old)
              if n!=count: raise SystemExit(f'Expected {count}, found {n}: {old[:140]!r}')
              s=s.replace(old,new,count)
          rep('<meta name="gscg-build" content="V109-MIC-REARM-20260817">','<meta name="gscg-build" content="V110-MIC-TAP-RECOVERY-20260817">')

          old='''async function toggleVoice(context){\n  if(voiceActivationPromise){\n    if(voiceActivationContext===context)setMicConnecting(context,true);\n    return voiceActivationPromise;\n  }\n  recoverRealtimeAfterResumeSync();\n  if(context==="round"&&(phase==="processing"||roundFinalizeRequested||roundPendingItems.size)){\n    $("status").textContent="PROCESANDO…";\n    return false;\n  }\n  if(context==="setup"&&(setupFinalizeRequested||setupLocked)){\n    $("setupStatus").textContent="PROCESANDO…";\n    return false;\n  }\n'''
          new='''async function toggleVoice(context){\n  setMicConnecting(context,true);\n  if(voiceActivationPromise){\n    return voiceActivationPromise;\n  }\n  recoverRealtimeAfterResumeSync();\n  if(context==="round"&&!listening&&(phase==="processing"||roundFinalizeRequested||roundPendingItems.size)&&!roundFinalizeTimer){\n    resetRoundCapture();phase="idle";\n  }\n  if(context==="round"&&(phase==="processing"||roundFinalizeRequested||roundPendingItems.size)){\n    setMicConnecting(context,false);\n    $("status").textContent="PROCESANDO…";\n    return false;\n  }\n  if(context==="setup"&&(setupFinalizeRequested||setupLocked)){\n    setMicConnecting(context,false);\n    $("setupStatus").textContent="PROCESANDO…";\n    return false;\n  }\n'''
          rep(old,new)

          old='''function bindMicActivation(id,context){\n  const el=$(id);let pointerAt=0;\n  const fire=e=>{e.preventDefault();const now=Date.now();if(e.type==="click"&&now-pointerAt<600)return;if(e.type==="pointerup")pointerAt=now;toggleVoice(context)};\n  if(window.PointerEvent)el.addEventListener("pointerup",fire,{passive:false});\n  el.addEventListener("click",fire,{passive:false});\n}\n'''
          new='''function bindMicActivation(id,context){\n  const el=$(id);let pointerAt=0,touchAt=0;\n  const fire=e=>{\n    e.preventDefault();\n    const now=Date.now();\n    if(e.type==="click"&&(now-pointerAt<700||now-touchAt<700))return;\n    if(e.type==="pointerup")pointerAt=now;\n    if(e.type==="touchend")touchAt=now;\n    setMicConnecting(context,true);\n    toggleVoice(context);\n  };\n  if(window.PointerEvent)el.addEventListener("pointerup",fire,{passive:false});\n  el.addEventListener("touchend",fire,{passive:false});\n  el.addEventListener("click",fire,{passive:false});\n}\n'''
          rep(old,new)
          p.write_text(s,encoding='utf-8')
      - name: Audit V110
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index-grupal.html').read_text(encoding='utf-8')
          for needle in ['V110-MIC-TAP-RECOVERY-20260817','touchend','!roundFinalizeTimer','setMicConnecting(context,true);','function realtimeReusableFor(context)']:
              assert needle in s, needle
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/g.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/g.js
          git diff --check
          test "$(git diff --name-only)" = "index-grupal.html"
          git diff --quiet HEAD -- index.html api/session.js api/score.js api/session-grupal.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-grupal.html
          git commit -m "V110 recover iPhone card mic on tap"
          git push origin grupal-dev