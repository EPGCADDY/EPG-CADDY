name: Publish R18 manual in Support
on:
  push:
    branches: [main]
    paths: [.publish-r18-support]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install pillow pypdf reportlab numpy
      - name: Install manual and update signal
        run: |
          curl -L --fail --cookie-jar /tmp/vcookies "https://golf-sc-gt-lab-v374-9j42qcngx-epgcaddys-projects.vercel.app/?_vercel_share=t1VBRc01GJXvzNpc2hMcUMvkfW2jKvRA" -o /tmp/access.html
          curl -L --fail --cookie /tmp/vcookies "https://golf-sc-gt-lab-v374-9j42qcngx-epgcaddys-projects.vercel.app/docs/manual/v311/Manual_Golf_Score_Card_GT_COMPLETO.pdf" -o docs/manual/v311/Manual_Golf_Score_Card_GT_COMPLETO.pdf
          cp docs/manual/v311/Manual_Golf_Score_Card_GT_COMPLETO.pdf docs/manual/v311/Manual_de_Funciones_Golf_Score_Card_GT_01-16.pdf
          curl -L --fail --cookie /tmp/vcookies "https://golf-sc-gt-lab-v374-9j42qcngx-epgcaddys-projects.vercel.app/docs/manual/v311/page-00.png" -o docs/manual/v311/page-00.png
          python3 - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          from PIL import Image
          pdf=Path("docs/manual/v311/Manual_Golf_Score_Card_GT_COMPLETO.pdf")
          assert len(PdfReader(pdf).pages)==74
          assert Image.open("docs/manual/v311/page-00.png").size==(2160,4320)
          p=Path("index-grupal.html"); s=p.read_text()
          s=s.replace('href="/manual-scg"','href="/manual.pdf"').replace('Abrir el Manual vivo de Golf Score Card GT','Abrir el Manual de Usuario V407 R.18 de Golf Score Card GT')
          s=s.replace("V407-R18-LIVE-POINTS-HEADER-20260908","V407-R19-SUPPORT-MANUAL-20260908")
          p.write_text(s)
          p=Path("service-worker.js"); s=p.read_text()
          s=s.replace("v407-r18-live-points-header","v407-r19-support-manual")
          s=s.replace("V407-R18-LIVE-POINTS-HEADER-20260908","V407-R19-SUPPORT-MANUAL-20260908")
          p.write_text(s)
          for p in Path(".").glob("test-*.mjs"):
              s=p.read_text()
              s=s.replace("v407-r18-live-points-header","v407-r19-support-manual")
              s=s.replace("V407-R18-LIVE-POINTS-HEADER-20260908","V407-R19-SUPPORT-MANUAL-20260908")
              if p.name=="test-v311-live-support-link.mjs":
                  s=s.replace('href="/manual-scg"','href="/manual.pdf"').replace('Abrir el Manual vivo de Golf Score Card GT','Abrir el Manual de Usuario V407 R.18 de Golf Score Card GT')
                  s=s.replace("Support debe abrir el Manual vivo exacto en otra pestaña","Support debe abrir el PDF exacto del Manual V407 R.18 en otra pestaña")
              p.write_text(s)
          block="\n## V407-R19-SUPPORT-PRODUCTION · 09 de septiembre de 2026\n\n- `index-grupal.html`, `service-worker.js`, `test-v311-live-support-link.mjs`, `test-v406-r5-simple-tournament-live.mjs`, `test-v407-r9-manual-update.mjs`, `test-v406-r4-mobile-controls.mjs`, `test-v407-r7-ios-scroll.mjs`, `test-v406-r2-professional-design.mjs`, `test-v365-active-round-empty-recovery.mjs` y `test-v407-r1-premium-visual-system.mjs`: Support abre el PDF R.18 y release R19 activa ACTUALIZAR.\n- `docs/manual/v311/Manual_Golf_Score_Card_GT_COMPLETO.pdf`, `docs/manual/v311/Manual_de_Funciones_Golf_Score_Card_GT_01-16.pdf` y `docs/manual/v311/page-00.png`: manual de 74 páginas y portada con logo grande.\n- `.publish-r18-support` y `.github/workflows/publish-r18-support-production.yml`: transporte temporal retirado antes del commit final.\n"
          for name in ("ROADMAP_OVERALL.md","ROADMAP_A_DETALLE.md"):
              p=Path(name); p.write_text(p.read_text().rstrip()+block)
          PY
          git rm .publish-r18-support .github/workflows/publish-r18-support-production.yml
          python3 scripts/rebuild-inventory-pdfs.py
      - name: Verify
        run: |
          node test-v311-live-support-link.mjs
          npm run inventory:gate
          npm run roadmap:gate
          npm run manual:editorial-qc
          npm run manual:visual-qc
          node test-v311-manual-semantic-coverage.mjs
          node test-v311-manual-hosting.mjs
          node test-v311-manual-search.mjs
          node test-project-quality-gate.mjs
          node scripts/project-quality-gate.mjs
      - name: Commit production candidate
        run: |
          git config user.name "Golf Score Card GT"
          git config user.email "jaimekirste@gmail.com"
          git add -A
          git commit -m "feat(support): publish V407 R19 manual"
          git push origin HEAD:main
