name: Grupal V112 vocabulary tee edit
on:
  push:
    branches: [grupal-dev]
    paths: ['.github/workflows/grupal-v112-vocabulary-tee-edit.yml']
permissions:
  contents: write
jobs:
  patch-audit-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grupal-dev
          fetch-depth: 0
      - name: Patch V112
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html'); s=p.read_text(encoding='utf-8')
          def rep(old,new,count=1):
              global s
              n=s.count(old)
              if n!=count: raise SystemExit(f'Expected {count}, found {n}: {old[:180]!r}')
              s=s.replace(old,new,count)

          rep('<meta name="gscg-build" content="V111-DIRECT-MIC-CAPTURE-20260817">','<meta name="gscg-build" content="V112-VOCAB-TEE-CORRECTION-20260817">')

          # Tee selector styling next to name/handicap fields.
          needle='.draft-hcp-input:focus{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime)}'
          rep(needle,needle+'.draft-tee-select{width:100%;min-width:0;background:#050505;border:1px solid #4b4f50;border-radius:5px;padding:8px 5px;font:inherit;font-weight:800;outline:none}.draft-tee-select:focus{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime)}')

          old='''    editHtml+=`<div class="draft-edit-row" data-draft-row="${i}"><span class="draft-slot">${i+1}</span><input class="draft-name-input" data-draft-name="${i}" value="${safeName}" aria-label="Nombre jugador ${i+1}" style="color:${tee.color}"><input class="draft-hcp-input" data-draft-hcp="${i}" type="number" inputmode="numeric" min="0" max="54" step="1" value="${p.handicap}" aria-label="Handicap jugador ${i+1}"><span class="draft-tee" style="color:${tee.color}"><i class="draft-tee-dot" style="background:${tee.color}"></i>${tee.label}</span></div>`;'''
          new='''    const teeOptions=Object.entries(TEES).map(([key,t])=>`<option value="${key}" ${key===p.tee?"selected":""}>${t.label}</option>`).join("");
    editHtml+=`<div class="draft-edit-row" data-draft-row="${i}"><span class="draft-slot">${i+1}</span><input class="draft-name-input" data-draft-name="${i}" value="${safeName}" aria-label="Nombre jugador ${i+1}" style="color:${tee.color}"><input class="draft-hcp-input" data-draft-hcp="${i}" type="number" inputmode="numeric" min="0" max="54" step="1" value="${p.handicap}" aria-label="Handicap jugador ${i+1}"><select class="draft-tee-select" data-draft-tee="${i}" aria-label="Marcas jugador ${i+1}" style="color:${tee.color}">${teeOptions}</select></div>`;'''
          rep(old,new)

          # Tee/color changes use the same single final confirmation as name/handicap.
          marker='''$("setupOk").addEventListener("click",()=>{if(profileCorrectionMode){startConfirmedRound();return}requestSetupFinalize()});'''
          insert='''$("detectedBody").addEventListener("change",e=>{const teeInput=e.target.closest?.("[data-draft-tee]");if(!teeInput)return;const idx=Number(teeInput.dataset.draftTee),tee=normalizeTee(teeInput.value);if(!Number.isInteger(idx)||!draftPlayers[idx]||!tee)return;draftPlayers[idx].tee=tee;persistDraftState();renderDraft();$("setupStatus").textContent=profileCorrectionMode?"CAMBIOS PENDIENTES · CORRIGE NOMBRE, HANDICAP Y/O MARCAS DE TODOS LOS JUGADORES NECESARIOS Y CONFIRMA UNA SOLA VEZ":"MARCAS ACTUALIZADAS · REVISA TODO Y PRESIONA OK";});
'''+marker
          rep(marker,insert)

          rep('CORRIGE MANUALMENTE NOMBRE Y/O HANDICAP · LOS SCORES EXISTENTES SE CONSERVAN','CORRIGE MANUALMENTE NOMBRE, HANDICAP Y/O MARCAS · LOS SCORES EXISTENTES SE CONSERVAN')
          rep('Corregir nombre(s) / handicap(s):','Corregir nombre(s) / handicap(s) / marcas:')
          rep('“Corregir handicap”, “Corregir handicaps” o “Rectificación de handicap”. Todas abren la misma pantalla de registro: puedes editar manualmente nombre y/o handicap de uno o varios jugadores antes de confirmar.','“Corregir handicap”, “Corregir handicaps”, “Rectificación de handicap”, “Corregir marcas”, “Corregir color” o “Cambiar marcas”. Todas abren la misma pantalla de registro: puedes editar manualmente nombre, handicap y/o color de marcas de uno o varios jugadores antes de confirmar una sola vez.')

          # Spoken route to the same profile correction screen for tee/color corrections.
          roster='function parseRosterCommand(transcript){'
          roster_new='''function parseRosterCommand(transcript){
  const profileCorrectionText=normalizeSpeech(transcript);
  if(/\\b(corregir|corrijo|correccion|rectificar|rectificacion|cambiar|cambio|modificar|modificacion)\\b/.test(profileCorrectionText)&&/\\b(marca|marcas|tee|tees|color|colores)\\b/.test(profileCorrectionText))return{matched:true,action:"correct_names"};'''
          rep(roster,roster_new)

          # PULTE is the principal course trigger. Remove a flexible spoken course phrase
          # before interpreting player data, so Club/Golf/Campo never becomes a player name.
          norm='function normalizeSpeech(value){return String(value||"").toLowerCase().normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").replace(/[^a-z0-9ñ]+/g," ").replace(/\\s+/g," ").trim()}'
          course='''function normalizeSpeech(value){return String(value||"").toLowerCase().normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").replace(/[^a-z0-9ñ]+/g," ").replace(/\\s+/g," ").trim()}
const PULTE_COURSE_TRIGGERS=new Set(["pulte","pulté","pulthe","pulteh","pulti","pult"]);
const PULTE_LEFT_WORDS=new Set(["el","campo","club","golf","de","del","en","jugamos","jugando","estamos","hoy","vamos","a","jugar","course","country"]);
const PULTE_RIGHT_WORDS=new Set(["golf","club","de","del","guatemala","course","country","countryclub","golfclub","gc","cc"]);
function stripPulteCourseTokens(tokens){
  const idx=tokens.findIndex(t=>PULTE_COURSE_TRIGGERS.has(t));if(idx<0)return tokens;
  let a=idx,b=idx+1,steps=0;
  while(a>0&&steps++<8&&PULTE_LEFT_WORDS.has(tokens[a-1]))a--;
  steps=0;while(b<tokens.length&&steps++<8&&PULTE_RIGHT_WORDS.has(tokens[b]))b++;
  return tokens.slice(0,a).concat(tokens.slice(b));
}'''
          rep(norm,course)
          old='''function parseSetupTranscript(transcript){
  const text=normalizeSpeech(transcript),tokens=text.split(" ").filter(Boolean);if(!tokens.length)return{ok:false,speech:"Error"};'''
          new='''function parseSetupTranscript(transcript){
  const text=normalizeSpeech(transcript);let tokens=text.split(" ").filter(Boolean);tokens=stripPulteCourseTokens(tokens);if(!tokens.length)return{ok:false,speech:"Error"};'''
          rep(old,new)

          # Two broad local vocabulary matrices: accumulated intent and result/status intent.
          oldfun='''function parseRoundQueryTranscript(transcript){
  const text=normalizeSpeech(transcript),tokens=text.split(" ").filter(Boolean);if(!tokens.length||!tokens.some(t=>QUERY_WORDS.has(t)))return{matched:false};
  if(isAccumulatedQueryTranscript(transcript))return{matched:true,kind:"accumulated",result:cumulativeAllPlayersSpeech()};
  const wantsAccumulated=tokens.some(t=>["acumulado","acumulados"].includes(t));
  const wantsResults=tokens.some(t=>["resultado","resultados","totales"].includes(t));
  if(wantsAccumulated||wantsResults)return{matched:true,kind:"accumulated",result:cumulativeAllPlayersSpeech()};
  // Explicit whole-round query.
  if(tokens.includes("ronda"))return{matched:true,kind:"accumulated",result:cumulativeAllPlayersSpeech()};
  // Explicit player + optional hole query.
  for(let i=0;i<tokens.length;i++){
    const m=matchPlayerAt(tokens,i);if(!m)continue;
    let j=m.next;
    while(j<tokens.length&&SCORE_FILLERS.has(tokens[j]))j++;
    if(tokens[j]==="hoyo"){
      const hn=parseSpanishNumberTokens(tokens,j+1);if(!hn||hn.value<1||hn.value>18)return{matched:true,result:{ok:false,speech:"Error"}};
      return{matched:true,result:getHole({player:m.player.name,hole:hn.value})};
    }
    const speech=compactPlayerSpeech(m.player);
    return speech?{matched:true,result:{ok:true,speech}}:{matched:true,result:{ok:false,speech:"Error"}};
  }
  return{matched:true,result:{ok:false,speech:"Error"}};
}'''
          newfun='''const ACCUMULATED_QUERY_MATRIX=["acumulado","acumulados","score acumulado","subtotal","sub total","actual","score actual","total actual","hasta ahora","como vamos","como voy","como va la vuelta","como va mi vuelta","como va nuestra vuelta","cuanto llevo","cuanto llevamos","que llevo","que llevamos","donde voy","donde vamos","marcador","marcador actual","parcial","parciales"];
const RESULT_QUERY_MATRIX=["resultado","resultados","resultado actual","resultados actuales","como va","como estamos","como esta la vuelta","como esta la ronda","estado actual","estado de la vuelta","estado de la ronda","total","totales","que resultado llevo","que resultado llevamos"];
function matrixPhraseMatch(text,phrases){const padded=` ${text} `;return phrases.some(x=>padded.includes(` ${normalizeSpeech(x)} `))}
function flexibleAccumulatedIntent(transcript){const text=normalizeSpeech(transcript);return matrixPhraseMatch(text,ACCUMULATED_QUERY_MATRIX)||matrixPhraseMatch(text,RESULT_QUERY_MATRIX)}
function parseRoundQueryTranscript(transcript){
  const text=normalizeSpeech(transcript),tokens=text.split(" ").filter(Boolean);if(!tokens.length)return{matched:false};
  const flexible=flexibleAccumulatedIntent(transcript);
  if(!flexible&&!tokens.some(t=>QUERY_WORDS.has(t)))return{matched:false};
  // If a player is explicitly named, an accumulated/status phrase refers to that player.
  if(flexible){
    for(let i=0;i<tokens.length;i++){
      const m=matchPlayerAt(tokens,i);if(!m)continue;
      const speech=compactPlayerSpeech(m.player);
      return speech?{matched:true,kind:"accumulated",result:{ok:true,speech}}:{matched:true,result:{ok:false,speech:"Error"}};
    }
    return{matched:true,kind:"accumulated",result:cumulativeAllPlayersSpeech()};
  }
  if(isAccumulatedQueryTranscript(transcript))return{matched:true,kind:"accumulated",result:cumulativeAllPlayersSpeech()};
  const wantsAccumulated=tokens.some(t=>["acumulado","acumulados"].includes(t));
  const wantsResults=tokens.some(t=>["resultado","resultados","totales"].includes(t));
  if(wantsAccumulated||wantsResults)return{matched:true,kind:"accumulated",result:cumulativeAllPlayersSpeech()};
  if(tokens.includes("ronda"))return{matched:true,kind:"accumulated",result:cumulativeAllPlayersSpeech()};
  for(let i=0;i<tokens.length;i++){
    const m=matchPlayerAt(tokens,i);if(!m)continue;
    let j=m.next;
    while(j<tokens.length&&SCORE_FILLERS.has(tokens[j]))j++;
    if(tokens[j]==="hoyo"){
      const hn=parseSpanishNumberTokens(tokens,j+1);if(!hn||hn.value<1||hn.value>18)return{matched:true,result:{ok:false,speech:"Error"}};
      return{matched:true,result:getHole({player:m.player.name,hole:hn.value})};
    }
    const speech=compactPlayerSpeech(m.player);
    return speech?{matched:true,result:{ok:true,speech}}:{matched:true,result:{ok:false,speech:"Error"}};
  }
  return{matched:true,result:{ok:false,speech:"Error"}};
}'''
          rep(oldfun,newfun)

          p.write_text(s,encoding='utf-8')
      - name: Audit V112
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'V112-VOCAB-TEE-CORRECTION-20260817' index-grupal.html
          grep -q 'data-draft-tee' index-grupal.html
          grep -q 'PULTE_COURSE_TRIGGERS' index-grupal.html
          grep -q 'stripPulteCourseTokens' index-grupal.html
          grep -q 'ACCUMULATED_QUERY_MATRIX' index-grupal.html
          grep -q 'RESULT_QUERY_MATRIX' index-grupal.html
          grep -q 'como vamos' index-grupal.html
          grep -q 'como voy' index-grupal.html
          grep -q 'sub total' index-grupal.html
          grep -q 'Corregir marcas' index-grupal.html
          grep -q 'markUnreportedPlayersOnHole' index-grupal.html
          grep -q 'score_confirmation' index-grupal.html
          grep -q 'setTimeout(()=>{roundFinalizeTimer=null;if(listening)requestRoundFinalize(0)},4000)' index-grupal.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index-grupal.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/g.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/g.js
          git diff --check
          test "$(git diff --name-only)" = "index-grupal.html"
          git diff --quiet HEAD -- index.html api/session.js api/score.js api/session-grupal.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-grupal.html
          git commit -m "V112 expand course/result vocabulary and editable tee correction"
          git push origin grupal-dev
