name: Grupal V117 recovery
on:
  push:
    branches: [grupal-dev]
    paths:
      - .github/workflows/grupal-v117-recover.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grupal-dev
          fetch-depth: 0
      - name: Apply requested scorecard changes
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index-grupal.html')
          s=p.read_text(encoding='utf-8')
          original=s
          s=s.replace('V115-FIELD-MIC-LAYOUT-20260817','V117-LAYOUT-TIMER-20260817',1)
          s=s.replace('<h2>MARCAS - YARDAS</h2>','<h2>YARDAS</h2>',1)
          pat=r'function renderCourseInfo\(\)\{.*?\}\nfunction '
          m=re.search(pat,s,flags=re.S)
          if not m:
              raise SystemExit('renderCourseInfo block not found')
          replacement='''function renderCourseInfo(){const rows=["Negro","Azul","Blanco","Rojo","Amarillo"].map(k=>[k,TEES[k]]);$("courseInfo").innerHTML=`<div class="head">YARDAS</div><div class="head">COURSE RATING</div><div class="head">SLOPE RATING</div>${rows.map(([k,t])=>`<div style="text-align:left"><span class="tee-dot" style="background:${t.color};border:${k==='Negro'?'1px solid #777':'0'}"></span><span style="color:${k==='Negro'?'#000':t.color};font-weight:800;${k==='Negro'?'background:#fff;padding:1px 5px;border-radius:2px;display:inline-block;':''}">${t.total.toLocaleString('en-US')}</span></div><div style="text-align:center">${t.rating.toFixed(1)}</div><div style="text-align:center">${t.slope}</div>`).join("")}`}
function '''
          s=s[:m.start()]+replacement+s[m.end():]
          old='function roundIdleStatus(){return `Ronda activa · ${round.players.length} jugador${round.players.length===1?"":"es"}`}'
          new='function roundElapsedText(){const start=new Date(round.createdAt).getTime(),sec=Math.max(0,Math.floor((Date.now()-start)/1000)),hh=String(Math.floor(sec/3600)).padStart(2,"0"),mm=String(Math.floor((sec%3600)/60)).padStart(2,"0"),ss=String(sec%60).padStart(2,"0");return `${hh}:${mm}:${ss}`}\nfunction roundStartText(){return new Intl.DateTimeFormat("es-GT",{hour:"2-digit",minute:"2-digit"}).format(new Date(round.createdAt))}\nfunction roundIdleStatus(){return `Ronda activa · Inicio ${roundStartText()} · ${roundElapsedText()}`}'
          if old not in s:
              raise SystemExit('roundIdleStatus exact block not found')
          s=s.replace(old,new,1)
          oldstatus='$("status").textContent=round.configured?`Ronda activa · ${round.players.length} jugador${round.players.length===1?"":"es"}`:"";'
          if oldstatus in s:
              s=s.replace(oldstatus,'$("status").textContent=round.configured?roundIdleStatus():"";',1)
          css='''\n/* V117 requested layout only */
.course-info-grid{grid-template-columns:.72fr .72fr .72fr;column-gap:6px;justify-content:start}
.course-info-layout{grid-template-columns:minmax(0,1fr) 165px;gap:8px}
.course-mic{width:153px;height:153px}.course-mic .mic-hit{inset:-50%}
@media(max-width:800px){.official-course-info .course-info-layout{grid-template-columns:minmax(0,1fr) 95px;gap:2px}.course-info-grid{grid-template-columns:.72fr .72fr .72fr;gap:3px 2px;justify-content:start}.official-course-info .course-mic{width:85px;height:85px}.official-course-info .course-mic .mic-visual{font-size:50px;border-width:2px}.official-course-info .course-mic .mic-hit{inset:-50%}.summary td{font-size:12px!important}}
'''
          s=s.replace('</style>',css+'</style>',1)
          marker='$("closeFinalCard")?.addEventListener'
          if marker not in s:
              raise SystemExit('timer insertion marker not found')
          s=s.replace(marker,'setInterval(()=>{if(round.configured&&$("status"))$("status").textContent=roundIdleStatus()},1000);\n'+marker,1)
          if s==original:
              raise SystemExit('no changes produced')
          p.write_text(s,encoding='utf-8')
      - name: Validate exact requested changes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'V117-LAYOUT-TIMER-20260817' index-grupal.html
          grep -q '<h2>YARDAS</h2>' index-grupal.html
          ! grep -q '<div class="head">MARCA</div>' index-grupal.html
          grep -q 'grid-template-columns:.72fr .72fr .72fr' index-grupal.html
          grep -q 'course-mic{width:85px;height:85px}' index-grupal.html
          grep -q 'course-mic .mic-hit{inset:-50%}' index-grupal.html
          grep -q 'function roundElapsedText' index-grupal.html
          grep -q 'Ronda activa · Inicio' index-grupal.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index-grupal.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/g.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/g.js
          git diff --check
          test "$(git diff --name-only)" = "index-grupal.html"
      - name: Commit validated change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-grupal.html
          git commit -m "V117 apply compact yardage layout larger mic and round timer"
          git push origin grupal-dev