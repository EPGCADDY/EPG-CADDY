name: Grupal V121 tighten white yardage box
on:
  push:
    branches: [grupal-dev]
    paths:
      - .github/workflows/grupal-v121-yardas-white-box.yml
permissions:
  contents: write
jobs:
  patch-audit-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grupal-dev
          fetch-depth: 0
      - name: Tighten white yardage background only
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html')
          s=p.read_text(encoding='utf-8')
          old="background:#fff;padding:1px 5px;border-radius:2px;display:inline-block;"
          new="background:#fff;padding:1px 2px;border-radius:2px;display:inline-block;"
          n=s.count(old)
          if n != 1:
              raise SystemExit(f'Expected exactly 1 white yardage box, found {n}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'background:#fff;padding:1px 2px;border-radius:2px;display:inline-block;' index-grupal.html
          ! grep -q 'background:#fff;padding:1px 5px;border-radius:2px;display:inline-block;' index-grupal.html
          git diff --check
          test "$(git diff --name-only)" = "index-grupal.html"
          git diff --quiet HEAD -- index.html api/session.js api/score.js api/session-grupal.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-grupal.html
          git commit -m "V121 tighten white yardage background"
          git push origin grupal-dev
