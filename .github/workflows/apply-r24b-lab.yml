name: Promote verified R24B to stable LAB alias
on:
  push:
    branches:
      - lab/v407-r24-whatsapp-registration
permissions:
  contents: write
jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote exact READY deployment inside LAB project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          npx --yes vercel@48.10.0 promote https://golf-sc-gt-hy2cvmmwn-epgcaddys-projects.vercel.app --scope epgcaddys-projects --token "$VERCEL_TOKEN" --yes
      - name: Remove temporary promotion workflow
        run: |
          git rm .github/workflows/apply-r24b-lab.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary LAB promotion workflow'
          git push origin HEAD:lab/v407-r24-whatsapp-registration
