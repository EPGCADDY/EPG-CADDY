name: Apply R24B LAB exact patch
on:
  push:
    branches:
      - lab/v407-r24-whatsapp-registration
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact traceability repair
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/r24b-traceability.patch
          git apply --index /tmp/r24b-traceability.patch
          git rm .github/workflows/apply-r24b-lab.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: close R24B LAB transport traceability'
          git push origin HEAD:lab/v407-r24-whatsapp-registration
