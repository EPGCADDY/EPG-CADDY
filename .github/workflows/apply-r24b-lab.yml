name: Apply R24B LAB candidate
on:
  push:
    branches:
      - lab/v407-r24-whatsapp-registration
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact audited patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/r24b.patch
          git apply --index /tmp/r24b.patch
          git rm .github/workflows/apply-r24b-lab.yml
          git config user.name EPGCADDY
          git config user.email jaimekirste@gmail.com
          git commit -m 'V407 R24B manual update recovery and browser gate'
          git push origin HEAD:lab/v407-r24-whatsapp-registration
