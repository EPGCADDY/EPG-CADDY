name: Build GSC Final Voice

on:
  push:
    branches: [laboratorio]
    paths:
      - ".github/workflows/build-gsc-final.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download visual and approved voice
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "https://cdn.creativeclaw.co/u/9cfd647d/videos/e022f950-98f9-4a23-814d-cb444edb5fd1.mp4" -o visual.mp4
          curl -L --fail --retry 3 "https://cdn.creativeclaw.co/u/9cfd647d/audio/98c5f21c-ac20-4fb5-8e1e-e3c838d9e760.mp3" -o a1.mp3
          curl -L --fail --retry 3 "https://cdn.creativeclaw.co/u/9cfd647d/audio/49f82fc7-2fc9-4c7e-aebb-79c664d6bfde.mp3" -o a2.mp3
          curl -L --fail --retry 3 "https://cdn.creativeclaw.co/u/9cfd647d/audio/c590c6cc-b101-43fe-ad57-92fd0e000f56.mp3" -o a3.mp3
          curl -L --fail --retry 3 "https://cdn.creativeclaw.co/u/9cfd647d/audio/a0970c60-83f6-4b0a-8c02-be478e1689f9.mp3" -o a4.mp3
          curl -L --fail --retry 3 "https://cdn.creativeclaw.co/u/9cfd647d/audio/849e0aa6-2ee3-4df1-8992-92f82ef24d1f.mp3" -o a5.mp3
          curl -L --fail --retry 3 "https://cdn.creativeclaw.co/u/9cfd647d/audio/b5f9cea1-ba86-47fc-a587-6172075ba23e.mp3" -o a6.mp3

      - name: Split scenes and mux exact approved clear voice
        run: |
          set -euo pipefail
          ffmpeg -y -ss 0  -t 14 -i visual.mp4 -an -c:v copy v1.mp4
          ffmpeg -y -ss 14 -t 24 -i visual.mp4 -an -c:v copy v2.mp4
          ffmpeg -y -ss 38 -t 17 -i visual.mp4 -an -c:v copy v3.mp4
          ffmpeg -y -ss 55 -t 22 -i visual.mp4 -an -c:v copy v4.mp4
          ffmpeg -y -ss 77 -t 15 -i visual.mp4 -an -c:v copy v5.mp4
          ffmpeg -y -ss 92 -t 18 -i visual.mp4 -an -c:v copy v6.mp4

          for i in 1 2 3 4 5 6; do
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 v${i}.mp4)
            ffmpeg -y -i v${i}.mp4 -i a${i}.mp3 -filter_complex "[1:a]apad[a]" -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -ar 48000 -t "$dur" p${i}.mp4
          done

          printf "file 'p1.mp4'\nfile 'p2.mp4'\nfile 'p3.mp4'\nfile 'p4.mp4'\nfile 'p5.mp4'\nfile 'p6.mp4'\n" > list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy -movflags +faststart GSC_GT_FINAL_PROFESIONAL_TELEFONO.mp4

      - name: Triple QA
        run: |
          set -euo pipefail
          test -s GSC_GT_FINAL_PROFESIONAL_TELEFONO.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=nw=1 GSC_GT_FINAL_PROFESIONAL_TELEFONO.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of default=nw=1 GSC_GT_FINAL_PROFESIONAL_TELEFONO.mp4
          ffmpeg -v error -i GSC_GT_FINAL_PROFESIONAL_TELEFONO.mp4 -f null -

      - name: Upload final MP4
        uses: actions/upload-artifact@v4
        with:
          name: GSC_GT_FINAL_PROFESIONAL_TELEFONO
          path: GSC_GT_FINAL_PROFESIONAL_TELEFONO.mp4
          if-no-files-found: error
