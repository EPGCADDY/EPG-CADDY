name: Stableford V203 two second close
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v203-two-second-close.yml']
permissions:
  contents: write
jobs:
  patch-audit-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
          fetch-depth: 0
      - name: Patch only Stableford round close delay
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html')
          s=p.read_text(encoding='utf-8')
          old='roundFinalizeTimer=setTimeout(()=>{roundFinalizeTimer=null;requestRoundFinalize(0,true)},4000);'
          new='roundFinalizeTimer=setTimeout(()=>{roundFinalizeTimer=null;requestRoundFinalize(0,true)},round?.mode==="stableford"?2000:4000);'
          if s.count(old)!=1: raise SystemExit(f'guard close-delay anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Audit frozen scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "index-grupal.html"
          grep -Fq 'round?.mode==="stableford"?2000:4000' index-grupal.html
          git diff --quiet HEAD -- api/session-grupal.js stableford.js stableford-torneo.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index-grupal.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/g.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/g.js
          node test-voice-continuity.mjs
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html
          git commit -m 'Stableford V203 close voice after two seconds'
          git push origin stableford-tournament-final
          git rm .github/workflows/stableford-v203-two-second-close.yml
          git commit -m 'Remove temporary Stableford V203 patch workflow'
          git push origin stableford-tournament-final