name: Stableford V248 return data sync
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v248-return-data-sync.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
      - name: Preserve active Stableford setup on return to data
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html');s=p.read_text(encoding='utf-8')
          anchor='''function returnToData(){'''
          if anchor not in s: raise SystemExit('returnToData anchor missing')
          injection='''function syncStablefordBackToDraft(){if(!round||round.mode!=="stableford")return;try{selectedCourse=round.courseKey||selectedCourse;localStorage.setItem("gscg_selected_course",selectedCourse);const players=(round.players||[]).map(p=>({name:p.name||"",hcp:Number(p.hcp||0),tee:p.tee||"Blanco",whatsapp:p.whatsapp||""}));draftPlayers=players;localStorage.setItem("golf-score-card-guatemala-group-draft-v1",JSON.stringify({courseKey:selectedCourse,players}));sessionStorage.setItem("gscg_stableford_return","1")}catch(e){console.error("Stableford return sync",e)}}\n'''
          s=s.replace(anchor,injection+anchor,1)
          # Ensure sync runs immediately before normal return logic.
          s=s.replace(anchor,anchor+'''if(round?.mode==="stableford")syncStablefordBackToDraft();''',1)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'syncStablefordBackToDraft' index-grupal.html
          grep -Fq 'if(round?.mode==="stableford")syncStablefordBackToDraft()' index-grupal.html
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html
          git commit -m 'Stableford V248 preserve Country Club and roster on return to data'
          git push origin stableford-tournament-final