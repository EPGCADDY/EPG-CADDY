name: Grupal persistence V2
on:
  push:
    branches: [grupal-dev]
    paths: ['.github/workflows/grupal-persistence-v2.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grupal-dev
          fetch-depth: 0
      - name: Patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html'); s=p.read_text(encoding='utf-8')
          def once(old,new):
              global s
              if s.count(old)!=1: raise SystemExit(f'mismatch: {old[:90]} => {s.count(old)}')
              s=s.replace(old,new,1)
          once('V97-MIC-TRANSITION-HARDENED-20260817','V98-PERSISTENT-ROUND-DRAFT-20260817')
          once('const STORAGE_BACKUP_KEY="golf-score-card-guatemala-group-round-v2-backup";','const STORAGE_BACKUP_KEY="golf-score-card-guatemala-group-round-v2-backup";\nconst DRAFT_STORAGE_KEY="golf-score-card-guatemala-group-draft-v1";')
          marker='''function restorePersistedRound(){'''
          helper='''function persistDraftState(){\n  try{if(!draftPlayers.length){localStorage.removeItem(DRAFT_STORAGE_KEY);return}localStorage.setItem(DRAFT_STORAGE_KEY,JSON.stringify({players:draftPlayers.map((p,i)=>normalizePlayer(p,i)),savedAt:new Date().toISOString()}))}catch(e){console.error("No se pudo persistir el registro en curso:",e)}\n}\nfunction loadDraftState(){\n  try{const raw=JSON.parse(localStorage.getItem(DRAFT_STORAGE_KEY)||"null");if(!raw||!Array.isArray(raw.players)||!raw.players.length)return[];return raw.players.slice(0,6).map(normalizePlayer)}catch{return[]}\n}\nfunction clearDraftState(){try{localStorage.removeItem(DRAFT_STORAGE_KEY)}catch{}}\n'''
          once(marker,helper+marker)
          once('draftPlayers=rosterEditMode?round.players.map((p,i)=>normalizePlayer({...p,holes:{...p.holes}},i)):[];','draftPlayers=rosterEditMode?round.players.map((p,i)=>normalizePlayer({...p,holes:{...p.holes}},i)):loadDraftState();')
          s=s.replace('draftPlayers=slots.map((p,i)=>normalizePlayer({...p,id:`p${i+1}`},i));renderDraft();return{ok:true,speech:""};','draftPlayers=slots.map((p,i)=>normalizePlayer({...p,id:`p${i+1}`},i));persistDraftState();renderDraft();return{ok:true,speech:""};',1)
          s=s.replace('draftPlayers=next.map((p,i)=>normalizePlayer({...p,id:`p${i+1}`},i));renderDraft();return{ok:true,speech:""};','draftPlayers=next.map((p,i)=>normalizePlayer({...p,id:`p${i+1}`},i));persistDraftState();renderDraft();return{ok:true,speech:""};',1)
          s=s.replace('draftPlayers=compact.map((p,i)=>normalizePlayer({...p,id:`p${i+1}`},i));renderDraft();return{ok:true,speech:""};','draftPlayers=compact.map((p,i)=>normalizePlayer({...p,id:`p${i+1}`},i));persistDraftState();renderDraft();return{ok:true,speech:""};',1)
          s=s.replace('draftPlayers=[];persist();closeSetup();render();return true;','draftPlayers=[];clearDraftState();persist();closeSetup();render();return true;',1)
          s=s.replace('draftPlayers=[];persist();closeSetup();render();return true\n}','draftPlayers=[];clearDraftState();persist();closeSetup();render();return true\n}',1)
          s=s.replace('draftPlayers[idx].name=value;nameInput.value=value;renderDraft();','draftPlayers[idx].name=value;nameInput.value=value;persistDraftState();renderDraft();',1)
          s=s.replace('draftPlayers[idx].handicap=value;renderDraft();','draftPlayers[idx].handicap=value;persistDraftState();renderDraft();',1)
          p.write_text(s,encoding='utf-8')
      - name: Audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index-grupal.html').read_text(encoding='utf-8')
          assert 'V98-PERSISTENT-ROUND-DRAFT-20260817' in s
          assert s.count('function persistDraftState(')==1
          assert s.count('function loadDraftState(')==1
          assert s.count('function clearDraftState(')==1
          assert s.count('function recordScore(')==1
          assert s.count('function recordScores(')==1
          assert s.count('function startConfirmedRound(')==1
          assert 'localStorage.setItem(STORAGE_KEY,payload)' in s
          assert 'localStorage.setItem(STORAGE_BACKUP_KEY,payload)' in s
          assert 'fetch("/api/session-grupal"' in s
          script=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/g.js').write_text(script,encoding='utf-8')
          PY
          node --check /tmp/g.js
          git diff --check
          test "$(git diff --name-only)" = "index-grupal.html"
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = grupal-dev
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html
          git commit -m '[persistence] preserve active round and draft across reopen'
          git push origin HEAD:grupal-dev
