name: Stableford five player direct patch
on:
  push:
    branches: [stableford-five-player-emergency]
    paths: ['.github/workflows/stableford-five-player-direct-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: stableford-five-player-emergency}
      - shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html');s=p.read_text()
          changes={
          'for(let i=0;i<4;i++)card+=stablefordPlayerBlock(round.players[i]||null,i+1)':'for(let i=0;i<5;i++)card+=stablefordPlayerBlock(round.players[i]||null,i+1)',
          'const STABLEFORD_EMERGENCY_ROSTER=["JAIME","JUNIOR","FITO","HENRY"];':'const STABLEFORD_EMERGENCY_ROSTER=["JAIME","JUNIOR","FITO","HENRY","ALFONSO"];'
          }
          for a,b in changes.items():
            if a not in s: print('already/missing',a[:40])
            else: s=s.replace(a,b,1)
          p.write_text(s)
      - shell: bash
        run: |
          set -e
          grep -Fq 'for(let i=0;i<5;i++)card+=stablefordPlayerBlock' index-grupal.html
          grep -Fq '"ALFONSO"' index-grupal.html
          grep -Fq 'const MAX_PLAYERS=5;' stableford.js
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index-grupal.html
          git commit -m 'Enable fifth Stableford player Alfonso in isolated UI' || true
          git push origin stableford-five-player-emergency