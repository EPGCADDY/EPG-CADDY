name: Stableford V204 direct registration voice
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v204-direct-registration-voice.yml']
permissions:
  contents: write
jobs:
  patch-audit-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
          fetch-depth: 0
      - name: Patch Stableford registration transcript direct to fields
        shell: python
        run: |
          from pathlib import Path
          p=Path('stableford.js'); s=p.read_text(encoding='utf-8')
          old='''        const parser=stablefordParseSetupTranscript||parseSetupTranscript;\n        const parsed=parser(event.transcript||"");\n        if(!parsed?.ok||!Array.isArray(parsed.changes))return;\n        const targets=[...document.querySelectorAll("[data-stableford-name]")];\n        for(const change of parsed.changes){const target=targets[Number(change.position)-1];if(target)target.value=cleanName(change.name)}\n        if(stableStatus)stableStatus.textContent="JUGADORES DETECTADOS";\n        if(listening)setVoice(false);'''
          new='''        const parser=stablefordParseSetupTranscript||parseSetupTranscript;\n        const parsed=parser(event.transcript||"");\n        if(!parsed?.ok||!Array.isArray(parsed.changes)){if(stableStatus)stableStatus.textContent="NO ENTENDÍ · DI JUGADOR UNO PATO";return;}\n        const targets=[...document.querySelectorAll("[data-stableford-name]")];\n        for(const change of parsed.changes){\n          const target=targets[Number(change.position)-1];\n          if(!target)continue;\n          target.value=cleanName(change.name);\n          target.dispatchEvent(new Event("input",{bubbles:true}));\n          target.dispatchEvent(new Event("change",{bubbles:true}));\n        }\n        if(stableStatus)stableStatus.textContent="JUGADORES DETECTADOS";\n        if(listening)setVoice(false);'''
          if s.count(old)!=1: raise SystemExit(f'guard direct registration anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Audit frozen scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "stableford.js"
          grep -Fq 'target.dispatchEvent(new Event("input",{bubbles:true}))' stableford.js
          grep -Fq 'NO ENTENDÍ · DI JUGADOR UNO PATO' stableford.js
          git diff --quiet HEAD -- index-grupal.html api/session-grupal.js stableford-torneo.html
          node --check stableford.js
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stableford.js
          git commit -m 'Stableford V204 write registration voice directly to player fields'
          git push origin stableford-tournament-final
          git rm .github/workflows/stableford-v204-direct-registration-voice.yml
          git commit -m 'Remove temporary Stableford V204 patch workflow'
          git push origin stableford-tournament-final