name: Grupal persistence hardening

on:
  push:
    branches: [grupal-dev]
    paths:
      - '.github/workflows/grupal-persistence-hardening.yml'

permissions:
  contents: write

jobs:
  patch-and-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grupal-dev
          fetch-depth: 0

      - name: Patch persistent active round and setup draft
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html')
          s=p.read_text(encoding='utf-8')
          def rep(old,new,count=1):
              global s
              n=s.count(old)
              if n!=count:
                  raise SystemExit(f'Expected {count}, found {n}: {old[:120]!r}')
              s=s.replace(old,new,count)

          rep('<meta name="gscg-build" content="V96-MIC-CONTEXT-IOS-HARDENED-20260817">','<meta name="gscg-build" content="V97-PERSISTENT-ROUND-DRAFT-20260817">')
          rep('const STORAGE_BACKUP_KEY="golf-score-card-guatemala-group-round-v2-backup";','const STORAGE_BACKUP_KEY="golf-score-card-guatemala-group-round-v2-backup";\nconst DRAFT_STORAGE_KEY="golf-score-card-guatemala-group-draft-v1";')
          anchor='''function persist(){\n  round.updatedAt=new Date().toISOString();\n  const payload=JSON.stringify(round);\n  try{\n    localStorage.setItem(STORAGE_KEY,payload);\n    localStorage.setItem(STORAGE_BACKUP_KEY,payload);\n  }catch(e){console.error("No se pudo persistir la última ronda:",e)}\n}\n'''
          insert=anchor+'''function persistDraftState(){\n  try{\n    if(!draftPlayers.length){localStorage.removeItem(DRAFT_STORAGE_KEY);return}\n    localStorage.setItem(DRAFT_STORAGE_KEY,JSON.stringify({players:draftPlayers.map((p,i)=>normalizePlayer(p,i)),savedAt:new Date().toISOString()}));\n  }catch(e){console.error("No se pudo persistir el registro en curso:",e)}\n}\nfunction loadDraftState(){\n  try{\n    const raw=JSON.parse(localStorage.getItem(DRAFT_STORAGE_KEY)||"null");\n    if(!raw||!Array.isArray(raw.players)||!raw.players.length)return[];\n    return raw.players.slice(0,6).map(normalizePlayer);\n  }catch{return[]}\n}\nfunction clearDraftState(){try{localStorage.removeItem(DRAFT_STORAGE_KEY)}catch{}}\n'''
          rep(anchor,insert)
          rep('draftPlayers=compact.map((p,i)=>normalizePlayer({...p,id:`p${i+1}`},i));renderDraft();return{ok:true,speech:""};','draftPlayers=compact.map((p,i)=>normalizePlayer({...p,id:`p${i+1}`},i));persistDraftState();renderDraft();return{ok:true,speech:""};')
          rep('draftPlayers=slots.map((p,i)=>normalizePlayer({...p,id:`p${i+1}`},i));renderDraft();return{ok:true,speech:""};','draftPlayers=slots.map((p,i)=>normalizePlayer({...p,id:`p${i+1}`},i));persistDraftState();renderDraft();return{ok:true,speech:""};')
          rep('draftPlayers=next.map((p,i)=>normalizePlayer({...p,id:`p${i+1}`},i));renderDraft();return{ok:true,speech:""};','draftPlayers=next.map((p,i)=>normalizePlayer({...p,id:`p${i+1}`},i));persistDraftState();renderDraft();return{ok:true,speech:""};')
          rep('draftPlayers=rosterEditMode?round.players.map((p,i)=>normalizePlayer({...p,holes:{...p.holes}},i)):[];\n  resetSetupCapture();','draftPlayers=rosterEditMode?round.players.map((p,i)=>normalizePlayer({...p,holes:{...p.holes}},i)):loadDraftState();\n  resetSetupCapture();')
          rep('rosterEditMode=false;handicapRectificationMode=false;nameCorrectionMode=false;profileCorrectionMode=false;rosterAddMode=false;rosterEditJoinHole=1;draftPlayers=[];persist();closeSetup();render();return true;','rosterEditMode=false;handicapRectificationMode=false;nameCorrectionMode=false;profileCorrectionMode=false;rosterAddMode=false;rosterEditJoinHole=1;draftPlayers=[];clearDraftState();persist();closeSetup();render();return true;')
          rep('rosterEditMode=false;handicapRectificationMode=false;nameCorrectionMode=false;profileCorrectionMode=false;rosterAddMode=false;rosterEditJoinHole=1;draftPlayers=[];persist();closeSetup();render();return true\n}','rosterEditMode=false;handicapRectificationMode=false;nameCorrectionMode=false;profileCorrectionMode=false;rosterAddMode=false;rosterEditJoinHole=1;draftPlayers=[];clearDraftState();persist();closeSetup();render();return true\n}')
          rep('function closeSetup(){\n  if(!round.configured)return;','function closeSetup(){\n  if(!round.configured)return;\n  clearDraftState();')
          rep('if(nameInput){const idx=Number(nameInput.dataset.draftName);if(Number.isInteger(idx)&&draftPlayers[idx])draftPlayers[idx].name=String(nameInput.value||"").trimStart();return}','if(nameInput){const idx=Number(nameInput.dataset.draftName);if(Number.isInteger(idx)&&draftPlayers[idx]){draftPlayers[idx].name=String(nameInput.value||"").trimStart();persistDraftState()}return}')
          rep('if(Number.isInteger(idx)&&draftPlayers[idx]&&Number.isInteger(value)&&value>=0&&value<=54)draftPlayers[idx].handicap=value}});','if(Number.isInteger(idx)&&draftPlayers[idx]&&Number.isInteger(value)&&value>=0&&value<=54){draftPlayers[idx].handicap=value;persistDraftState()}}});')
          rep('draftPlayers[idx].name=value;nameInput.value=value;renderDraft();','draftPlayers[idx].name=value;nameInput.value=value;persistDraftState();renderDraft();')
          rep('draftPlayers[idx].handicap=value;renderDraft();','draftPlayers[idx].handicap=value;persistDraftState();renderDraft();')
          p.write_text(s,encoding='utf-8')

      - name: Static and differential audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index-grupal.html').read_text(encoding='utf-8')
          assert 'V97-PERSISTENT-ROUND-DRAFT-20260817' in s
          for x in ['DRAFT_STORAGE_KEY','function persistDraftState()','function loadDraftState()','function clearDraftState()']:
              assert x in s
          assert s.count('function persist()') == 1
          assert s.count('function recordScore') == 1
          assert s.count('function recordScores') == 1
          assert s.count('function startConfirmedRound') == 1
          assert 'localStorage.setItem(STORAGE_KEY,payload)' in s
          assert 'localStorage.setItem(STORAGE_BACKUP_KEY,payload)' in s
          assert 'draftPlayers=rosterEditMode?round.players.map((p,i)=>normalizePlayer({...p,holes:{...p.holes}},i)):loadDraftState();' in s
          assert 'fetch("/api/session-grupal"' in s
          script=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/index-grupal.js').write_text(script,encoding='utf-8')
          PY
          node --check /tmp/index-grupal.js
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "index-grupal.html"
          git diff -- index-grupal.html

      - name: Commit audited persistence fix to grupal-dev only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "grupal-dev"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-grupal.html
          git commit -m "[persistence] preserve active round and unfinished registration"
          git push origin HEAD:grupal-dev
