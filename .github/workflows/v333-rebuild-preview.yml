name: V333 rebuild Preview

on:
  push:
    branches:
      - v333-manual-operational-preview
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v333-manual-operational-preview
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message || '', '[v333-generated]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Preview source
        uses: actions/checkout@v4
        with:
          ref: v333-manual-operational-preview
          fetch-depth: 0

      - name: Prepare render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core poppler-utils
          python3 -m pip install --disable-pip-version-check pillow numpy pypdf reportlab

      - name: Rebuild the exact V333 candidate
        env:
          BASE_SHA: d9afc94ec826fc8c4c09247942fd82b8ac6d4efa
        run: |
          set -euo pipefail
          git rm .github/workflows/v333-rebuild-preview.yml
          printf '\n<!-- V333-REMOTE-FINALIZED -->\n' >> ROADMAP_OVERALL.md
          printf '\n<!-- V333-REMOTE-FINALIZED -->\n' >> ROADMAP_A_DETALLE.md
          python3 scripts/rebuild-manual-bets-live-data.py
          python3 scripts/manual-layout-normalize.py --apply
          python3 scripts/rebuild-manual-pdf-from-pages.py
          python3 scripts/rebuild-inventory-pdfs.py
          git add -A
          export ROADMAP_CHANGED_FILES="$(git diff --name-only "$BASE_SHA")"
          npm run audit

      - name: Commit the audited Preview only
        run: |
          set -euo pipefail
          git config user.name "gscg-automation"
          git config user.email "gscg-automation@users.noreply.github.com"
          git commit -m "V333: finalize Manual and operational Preview [v333-generated]"
          git push origin HEAD:v333-manual-operational-preview
