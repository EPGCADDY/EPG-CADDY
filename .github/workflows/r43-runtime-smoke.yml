name: LAB R43 runtime smoke

on:
  push:
    branches:
      - lab/r43-runtime-smoke

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/r43-runtime-smoke
      - name: Install runtime dependencies
        run: npm install --omit=dev --no-package-lock
      - name: Verify R43 wrapper contracts
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import handler from './api/universal-ai-r43.js';

          const originalFetch=globalThis.fetch;
          const originalOpenAI=process.env.OPENAI_API_KEY;
          const originalGateway=process.env.AI_GATEWAY_API_KEY;
          process.env.OPENAI_API_KEY='r43-test-openai';
          process.env.AI_GATEWAY_API_KEY='r43-test-gateway';

          const mkHeaders=(values={})=>({get(name){return values[String(name).toLowerCase()]??null}});
          const mkResponse=(status,payload,headers={})=>({ok:status>=200&&status<300,status,headers:mkHeaders(headers),json:async()=>payload});
          const mkRes=()=>({headers:{},statusCode:200,body:null,setHeader(name,value){this.headers[String(name).toLowerCase()]=value;return this},status(code){this.statusCode=code;return this},json(value){this.body=value;return this}});
          const req=query=>({method:'POST',headers:{host:'epg-caddy.vercel.app'},body:{query,responseMode:'voice',history:[]}});

          try{
            let calls=[];
            globalThis.fetch=async(url)=>{
              calls.push(String(url));
              if(String(url).includes('api.openai.com')) return mkResponse(200,{model:'gpt-5.6',output:[{type:'message',content:[{type:'output_text',text:'PRIMARY_OK'}]}]});
              throw new Error('unexpected fetch '+url);
            };
            let res=mkRes();
            await handler(req('prueba primaria'),res);
            assert.equal(res.statusCode,200);
            assert.equal(res.body.answer,'PRIMARY_OK');
            assert.equal(res.body.mode,undefined);
            assert.equal(calls.filter(x=>x.includes('ai-gateway.vercel.sh')).length,0);
            console.log('PASS R43 primary 200 passthrough');

            calls=[];
            globalThis.fetch=async(url)=>{
              calls.push(String(url));
              if(String(url).includes('api.openai.com')) return mkResponse(400,{error:{code:'invalid_request_error'}});
              if(String(url).includes('ai-gateway.vercel.sh')) return mkResponse(200,{model:'openai/gpt-5.6-sol',output:[{type:'message',content:[{type:'output_text',text:'FALLBACK_RECOVERED'}]}]});
              throw new Error('unexpected fetch '+url);
            };
            res=mkRes();
            await handler(req('prueba fallback'),res);
            assert.equal(res.statusCode,200);
            assert.equal(res.body.answer,'FALLBACK_RECOVERED');
            assert.equal(res.body.mode,'GATEWAY_R43');
            assert.equal(res.body.degraded,true);
            assert.equal(res.headers['x-epg-ai-fallback'],'R43');
            assert.equal(calls.filter(x=>x.includes('ai-gateway.vercel.sh')).length,1);
            console.log('PASS R43 AI failure -> gateway recovery 200');

            calls=[];
            let openAiCount=0;
            globalThis.fetch=async(url)=>{
              calls.push(String(url));
              if(String(url).includes('api.openai.com')){
                openAiCount+=1;
                return mkResponse(200,{model:'gpt-5.6',output:[]});
              }
              if(String(url).includes('ai-gateway.vercel.sh')) return mkResponse(200,{model:'openai/gpt-5.6-sol',output:[{type:'message',content:[{type:'output_text',text:'EMPTY_RECOVERED'}]}]});
              throw new Error('unexpected fetch '+url);
            };
            res=mkRes();
            await handler(req('prueba respuesta vacía'),res);
            assert.equal(openAiCount,1);
            assert.equal(res.statusCode,200);
            assert.equal(res.body.answer,'EMPTY_RECOVERED');
            assert.equal(res.body.mode,'GATEWAY_R43');
            assert.equal(res.headers['x-epg-ai-fallback'],'R43');
            assert.equal(calls.filter(x=>x.includes('ai-gateway.vercel.sh')).length,1);
            console.log('PASS R43 empty 200 -> gateway recovery 200');

            calls=[];
            globalThis.fetch=async(url)=>{calls.push(String(url));throw new Error('network must not run')};
            res=mkRes();
            await handler(req('x'),res);
            assert.equal(res.statusCode,422);
            assert.equal(res.body.error,'QUERY_REQUIRED');
            assert.equal(calls.length,0);
            console.log('PASS R43 non-AI 422 passthrough without gateway');
          } finally {
            globalThis.fetch=originalFetch;
            if(originalOpenAI===undefined) delete process.env.OPENAI_API_KEY; else process.env.OPENAI_API_KEY=originalOpenAI;
            if(originalGateway===undefined) delete process.env.AI_GATEWAY_API_KEY; else process.env.AI_GATEWAY_API_KEY=originalGateway;
          }
          NODE
