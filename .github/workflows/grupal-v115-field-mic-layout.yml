name: Grupal V115 field mic layout
on:
  push:
    branches: [grupal-dev]
    paths:
      - .github/workflows/grupal-v115-field-mic-layout.yml
permissions:
  contents: write
jobs:
  patch-audit-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grupal-dev
          fetch-depth: 0
      - name: Patch V115
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html'); s=p.read_text(encoding='utf-8')
          def rep(old,new,count=1):
              global s
              n=s.count(old)
              if n!=count: raise SystemExit(f'Expected {count}, found {n}: {old[:180]!r}')
              s=s.replace(old,new,count)

          rep('<meta name="gscg-build" content="V114-SCORECARD-LEGIBILITY-20260817">','<meta name="gscg-build" content="V115-FIELD-MIC-LAYOUT-20260817">')

          old_course='  <section class="course-info official-course-info"><h2>INFORMACIÓN DEL CAMPO</h2><div class="course-info-grid" id="courseInfo"></div></section>'
          new_course='  <section class="course-info official-course-info"><div class="course-info-layout"><div class="course-info-data"><h2>MARCAS - YARDAS</h2><div class="course-info-grid" id="courseInfo"></div></div><div class="mic-wrap course-mic" id="headerMicWrap"><button class="mic-hit" id="headerMic" aria-label="Micrófono"></button><div class="mic-visual">🎙</div></div></div></section>'
          rep(old_course,new_course)

          old_mic='    <div class="mic-wrap" id="headerMicWrap"><button class="mic-hit" id="headerMic" aria-label="Micrófono"></button><div class="mic-visual">🎙</div></div>\n'
          rep(old_mic,'')

          # Desktop: keep existing field box, cluster its data left and place mic on right at +30%.
          rep('.course-info{border:1px solid var(--line);padding:6px 12px 8px;align-self:stretch}', '.course-info{border:1px solid var(--line);padding:6px 12px 8px;align-self:stretch}.course-info-layout{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:16px;align-items:center}.course-info-data{min-width:0}.course-mic{width:109px;height:109px;margin:auto}')

          # Mobile: preserve the scorecard horizontal geometry; only reorganize the field info row.
          rep('.official-course-info{padding:7px 7px 8px;min-width:0;margin:0 0 7px;border-radius:4px}', '.official-course-info{padding:7px 7px 8px;min-width:0;margin:0 0 7px;border-radius:4px}.official-course-info .course-info-layout{grid-template-columns:minmax(0,1fr) 72px;gap:5px;align-items:center}.official-course-info .course-info-data{min-width:0}.official-course-info .course-mic{width:61px;height:61px;margin:auto}.official-course-info .course-mic .mic-visual{font-size:36px;border-width:2px}')

          p.write_text(s,encoding='utf-8')
      - name: Audit V115
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'V115-FIELD-MIC-LAYOUT-20260817' index-grupal.html
          grep -q '<h2>MARCAS - YARDAS</h2>' index-grupal.html
          test "$(grep -o 'id=\"headerMicWrap\"' index-grupal.html | wc -l)" -eq 1
          test "$(grep -o 'id=\"headerMic\"' index-grupal.html | wc -l)" -eq 1
          grep -q 'course-mic{width:109px;height:109px' index-grupal.html
          grep -q 'course-mic{width:61px;height:61px' index-grupal.html
          grep -q 'official-round-header .logo{grid-column:1;grid-row:1;width:104px;height:104px}' index-grupal.html
          grep -q 'scorecard{width:980px;min-width:980px' index-grupal.html
          grep -q 'scorecard th,.scorecard td{height:30px' index-grupal.html
          grep -q 'summary th,.summary td{height:44px;font-size:14px' index-grupal.html
          grep -q 'setTimeout(()=>{roundFinalizeTimer=null;if(listening)requestRoundFinalize(0)},4000)' index-grupal.html
          grep -q 'markUnreportedPlayersOnHole' index-grupal.html
          grep -q 'ACCUMULATED_QUERY_MATRIX' index-grupal.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index-grupal.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/g.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/g.js
          git diff --check
          test "$(git diff --name-only)" = "index-grupal.html"
          git diff --quiet HEAD -- index.html api/session.js api/score.js api/session-grupal.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-grupal.html
          git commit -m "V115 move mic beside field info and retitle marks yards"
          git push origin grupal-dev
