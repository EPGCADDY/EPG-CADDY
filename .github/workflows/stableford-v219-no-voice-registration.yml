name: Stableford V219 fixed emergency roster
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v219-no-voice-registration.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
          fetch-depth: 0
      - name: Fix emergency roster without registration voice
        shell: python
        run: |
          from pathlib import Path
          p=Path('stableford.js'); s=p.read_text(encoding='utf-8')
          old='''    const start=document.getElementById("startStablefordRound");'''
          new='''    if(new URLSearchParams(location.search).get("stableford_emergency")==="countryclub"){const names=["Jaime","Junior","Adolfo","Herny"];const apply=()=>document.querySelectorAll("[data-stableford-name]").forEach((el,i)=>{if(i<4)el.value=names[i]});apply();setTimeout(apply,50);setTimeout(apply,250);}\n    const start=document.getElementById("startStablefordRound");'''
          if s.count(old)!=1: raise SystemExit('start anchor mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "stableford.js"
          grep -Fq 'setTimeout(apply,250)' stableford.js
          node --check stableford.js
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stableford.js
          git commit -m 'Stableford V219 force emergency roster into setup'
          git push origin stableford-tournament-final