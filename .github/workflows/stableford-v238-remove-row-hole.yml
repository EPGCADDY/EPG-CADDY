name: Stableford V238 remove repeated hole
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v238-remove-row-hole.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
      - name: Remove only repeated hole labels from player rows
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html');s=p.read_text(encoding='utf-8')
          s=s.replace('grid-template-columns:1fr 92px 1.7fr','grid-template-columns:1fr 1.7fr')
          s=s.replace('<b style="text-align:center">JUGADOR</b><div style="text-align:center"><b>HOYO</b>','<b style="text-align:center">JUGADOR</b><div style="grid-column:2;text-align:center"><b>HOYO</b>')
          s=s.replace('</select></div><b style="text-align:center">GROSS</b>${round.players.map', '</select><b style="display:block;margin-top:6px;text-align:center">GROSS</b></div>${round.players.map')
          s=s.replace('style="min-height:48px;font-size:17px;text-align:center"><span style="text-align:center;font-size:20px">${selectedHole}</span><input class="sfGridGross"','style="min-height:48px;font-size:17px;text-align:center"><input class="sfGridGross"')
          p.write_text(s,encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -Fq '<span style="text-align:center;font-size:20px">${selectedHole}</span>' index-grupal.html
          grep -Fq 'grid-template-columns:1fr 1.7fr' index-grupal.html
          grep -Fq 'id="sfGridHole"' index-grupal.html
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html
          git commit -m 'Stableford V238 show hole number once in manual editor'
          git push origin stableford-tournament-final