name: Stableford V245 remove classification
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v245-remove-classification.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
      - name: Remove classification block from live Stableford DOM
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html');s=p.read_text(encoding='utf-8')
          anchor='''  $("stablefordSeriesSection")?.classList.add("hidden");'''
          new='''  $("stablefordSeriesSection")?.remove();'''
          if s.count(anchor)<1: raise SystemExit('classification anchor missing')
          s=s.replace(anchor,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate accumulated directives
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq '$("stablefordSeriesSection")?.remove()' index-grupal.html
          grep -Fq 'grid-template-columns:82px 72px 72px 1fr 1fr 1.1fr' index-grupal.html
          grep -Fq 'class="sfGridName"' index-grupal.html
          grep -Fq 'class="sfGridGross"' index-grupal.html
          grep -Fq 'id="sfGridEnter"' index-grupal.html
          grep -Fq 'sc.style.overflowX="auto"' index-grupal.html
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html
          git commit -m 'Stableford V245 remove accumulated classification from live round'
          git push origin stableford-tournament-final