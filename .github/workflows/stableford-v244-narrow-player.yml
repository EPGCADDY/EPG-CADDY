name: Stableford V244 narrow player
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v244-narrow-player.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
      - name: Narrow only manual player column
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html');s=p.read_text(encoding='utf-8')
          old='grid-template-columns:minmax(0,1fr) 72px 72px 52px 52px 58px'
          new='grid-template-columns:82px 72px 72px 1fr 1fr 1.1fr'
          if s.count(old)!=1: raise SystemExit('grid anchor mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'grid-template-columns:82px 72px 72px 1fr 1fr 1.1fr' index-grupal.html
          grep -Fq 'class="sfGridName"' index-grupal.html
          grep -Fq 'p.name=name' index-grupal.html
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html
          git commit -m 'Stableford V244 narrow editable player column'
          git push origin stableford-tournament-final