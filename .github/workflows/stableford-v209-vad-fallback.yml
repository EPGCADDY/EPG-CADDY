name: Stableford V209 VAD fallback
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v209-vad-fallback.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
          fetch-depth: 0
      - name: Add Stableford speech-stop finalize fallback only
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html'); s=p.read_text(encoding='utf-8')
          old='''        if(roundTranscriptionWatchdog)clearTimeout(roundTranscriptionWatchdog);\n        roundTranscriptionWatchdog=setTimeout(()=>{roundTranscriptionWatchdog=null;if(!roundPendingItems.size)return;roundPendingItems.clear();if(roundTranscriptCombined())requestRoundFinalize(0,true);else{resetRoundCapture();phase=listening?"listening":"idle";$("status").textContent=listening?"● ESCUCHANDO…":roundIdleStatus()}},10000);'''
          new='''        if(roundTranscriptionWatchdog)clearTimeout(roundTranscriptionWatchdog);\n        const stablefordWatchdog=(typeof round!=="undefined"&&round&&round.mode==="stableford")?3000:10000;\n        roundTranscriptionWatchdog=setTimeout(()=>{roundTranscriptionWatchdog=null;if(!roundPendingItems.size)return;roundPendingItems.clear();if(roundTranscriptCombined())requestRoundFinalize(0,true);else{resetRoundCapture();phase=listening?"listening":"idle";$("status").textContent=listening?"● ESCUCHANDO…":roundIdleStatus()}},stablefordWatchdog);'''
          if s.count(old)!=1: raise SystemExit(f'watchdog anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "index-grupal.html"
          grep -Fq 'stablefordWatchdog' index-grupal.html
          git diff --quiet HEAD -- api/session-grupal.js stableford.js stableford-torneo.html
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html
          git commit -m 'Stableford V209 recover stalled speech-stop transcription'
          git push origin stableford-tournament-final