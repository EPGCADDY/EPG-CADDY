name: LAB manual sync Four Ball and mode

on:
  push:
    branches: [laboratorio]

permissions:
  contents: write

jobs:
  sync-manual:
    if: contains(github.event.head_commit.message, 'manual-sync-trigger')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: laboratorio
          fetch-depth: 0
      - name: Synchronize manual and parity gate
        run: |
          git fetch origin laboratorio
          git reset --hard origin/laboratorio
          node <<'NODE'
          const fs=require('fs');
          const manualPath='manual.html';
          const gatePath='scripts/manual-screen-parity-gate.mjs';
          let manual=fs.readFileSync(manualPath,'utf8');
          let gate=fs.readFileSync(gatePath,'utf8');

          const p03=`<section class="page" id="p03" data-index="3"><div class="kicker">PÁGINA 03 · JUGADORES</div><h1>Registro manual de jugadores y modalidad</h1><p>Completa NOMBRE, CATEGORÍA, HDCP, MARCAS y WhatsApp opcional. Antes de registrar cualquier score puedes cambiar la modalidad desde el registro; después del primer score, para cambiar modalidad debes iniciar una nueva ronda.</p><div class="screen-replica"><div class="sr-title">REGISTRO DE JUGADORES</div><div class="sr-grid"><div class="sr-head">NOMBRE</div><div class="sr-head">CATEGORÍA</div><div class="sr-head">HDCP</div><div class="sr-head">MARCAS</div><div class="sr-cell">CARLOS</div><div class="sr-cell">A</div><div class="sr-cell">12</div><div class="sr-cell">BLANCO</div><div class="sr-cell">ROBERTO</div><div class="sr-cell">—</div><div class="sr-cell">—</div><div class="sr-cell">AZUL</div></div><div class="sr-title" style="margin-top:16px">DATO FALTANTE</div><div class="sr-sub">ROBERTO<br>FALTA CATEGORÍA</div><div class="sr-actions"><div class="sr-button">CORREGIR</div><div class="sr-button muted">IGNORAR</div></div><div class="sr-section"><div class="sr-section-title">CAMBIO DE MODALIDAD</div><div class="sr-note">ANTES DEL PRIMER SCORE: PUEDES CAMBIAR LA MODALIDAD.<br>DESPUÉS: PARA CAMBIAR MODALIDAD DESPUÉS DE REGISTRAR SCORES, INICIA UNA NUEVA RONDA</div></div></div><div class="steps"><div><b>QUÉ ES</b><span>El registro vigente permite completar jugadores y ajustar la modalidad mientras todavía no exista ningún score registrado.</span></div><div><b>TÚ HACES</b><span>Completa los campos; si aún no anotaste scores puedes seleccionar otra modalidad antes de continuar.</span></div><div><b>LA APP HACE</b><span>Valida cada fila. Después del primer score bloquea el cambio de modalidad para proteger la ronda ya iniciada.</span></div><div><b>RESULTADO</b><span>Si ya existen scores, la app indica: PARA CAMBIAR MODALIDAD DESPUÉS DE REGISTRAR SCORES, INICIA UNA NUEVA RONDA.</span></div></div></section>`;
          const p08=`<section class="page" id="p08" data-index="8"><div class="kicker">PÁGINA 08 · FOUR BALL</div><h1>Four Ball · TEAM</h1><p>Four Ball agrupa a los jugadores en TEAM 1, TEAM 2 y TEAM 3, con dos jugadores por TEAM. En cada hoyo cuenta el mejor Neto del TEAM.</p><div class="screen-replica"><div class="sr-title">RESULTADO FOUR BALL</div><div class="sr-section"><div class="sr-section-title">TEAM 1 · 2 JUGADORES</div><div class="sr-note">CUENTA EL MEJOR NETO DE CADA HOYO · ★ MEJOR NETO DEL TEAM</div></div><div class="sr-row" style="grid-template-columns:repeat(5,minmax(0,1fr))"><div class="sr-chip">JUGADOR</div><div class="sr-chip">GROSS</div><div class="sr-chip">NETO</div><div class="sr-chip green">GROSS TEAM</div><div class="sr-chip green">NETO TEAM</div></div><div class="sr-section"><div class="sr-section-title">TEAM 2 / TEAM 3</div><div class="sr-note">Cuando existen más TEAMS, la app compara sus mejores Netos y muestra el resultado por hoyo y acumulado. Las tarjetas exportadas conservan la denominación TEAM.</div></div></div><div class="steps"><div><b>QUÉ ES</b><span>Modalidad por TEAMS de dos jugadores; pueden existir de uno a tres TEAMS.</span></div><div><b>TÚ HACES</b><span>Registra el Gross individual de cada jugador.</span></div><div><b>LA APP HACE</b><span>Calcula Gross y Neto individual, GROSS TEAM y NETO TEAM, e identifica el mejor Neto del TEAM en cada hoyo.</span></div><div><b>RESULTADO</b><span>La Score Card, el resumen Four Ball y las tarjetas exportadas usan la terminología canónica TEAM.</span></div></div></section>`;

          const before03=manual;
          manual=manual.replace(/<section class="page" id="p03" data-index="3">[\s\S]*?<\/section>/,p03);
          if(manual===before03) throw new Error('P03 replacement failed');
          const before08=manual;
          manual=manual.replace(/<section class="page" id="p08" data-index="8">[\s\S]*?<\/section>/,p08);
          if(manual===before08) throw new Error('P08 replacement failed');

          gate=gate.replace('const shortcuts=read("shortcuts-ui.js");','const shortcuts=read("shortcuts-ui.js");\nconst cards=read("card-artifacts.js");');
          gate=gate.replace('"03":["REGISTRO DE JUGADORES","DATO FALTANTE","CORREGIR","IGNORAR","SIN CATEGORÍA"],','"03":["REGISTRO DE JUGADORES","DATO FALTANTE","CORREGIR","IGNORAR","SIN CATEGORÍA","PARA CAMBIAR MODALIDAD DESPUÉS DE REGISTRAR SCORES, INICIA UNA NUEVA RONDA"],\n "08":["RESULTADO FOUR BALL","TEAM 1","GROSS","NETO","GROSS TEAM","NETO TEAM","MEJOR NETO DEL TEAM"],');
          gate=gate.replace('"01":auth,"03":app,"13":app,','"01":auth,"03":app,"08":app,"13":app,');
          gate=gate.replace('assert((manual.match(/class="screen-replica"/g)||[]).length===14,"Manual debe tener 14 réplicas clave");','assert((manual.match(/class="screen-replica"/g)||[]).length===15,"Manual debe tener 15 réplicas clave");');
          gate=gate.replace('assert(page("41").includes("Cuenta personal"),"P41 debe documentar la cuenta personal");','assert(page("41").includes("Cuenta personal"),"P41 debe documentar la cuenta personal");\nassert(page("03").includes("CAMBIO DE MODALIDAD")&&app.includes("canChangeConfiguredRoundMode"),"P03 debe documentar cambio de modalidad únicamente antes de registrar scores");\nassert(page("08").includes("TEAM 1")&&page("08").includes("GROSS TEAM")&&page("08").includes("NETO TEAM"),"P08 debe documentar Four Ball con terminología TEAM y resumen actual");\nassert(cards.includes(\'FOUR_BALL_TEAM_NAMES=["TEAM 1","TEAM 2","TEAM 3"]\')&&cards.includes("<th>TEAM</th>"),"Tarjetas exportadas Four Ball deben conservar terminología TEAM");');
          gate=gate.replace('60 pages · 50 base + 10 tutorial R3 · 14 replicas · universal Atajos · 0 retired features · current LAB controls matched','60 pages · 50 base + 10 tutorial R3 · 15 replicas · pre-score mode edit · Four Ball TEAM · universal Atajos · 0 retired features · current LAB controls matched');

          fs.writeFileSync(manualPath,manual);
          fs.writeFileSync(gatePath,gate);
          NODE
          node scripts/manual-screen-parity-gate.mjs
      - name: Commit synchronized manual
        run: |
          git config user.name "EPGCADDY"
          git config user.email "jaimekirste@gmail.com"
          git rm .github/workflows/manual-sync-fourball-mode.yml
          git add manual.html scripts/manual-screen-parity-gate.mjs
          git commit -m "LAB manual: sync pre-score mode and Four Ball TEAM"
          git pull --rebase origin laboratorio
          node scripts/manual-screen-parity-gate.mjs
          git push origin HEAD:laboratorio
