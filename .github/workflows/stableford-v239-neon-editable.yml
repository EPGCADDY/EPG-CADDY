name: Stableford V239 neon editable
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v239-neon-editable.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
      - name: Apply requested neon labels and Enter
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html');s=p.read_text(encoding='utf-8')
          s=s.replace('<b style="text-align:center">JUGADOR</b>','<b style="text-align:center;color:#72ff42">JUGADOR</b>',1)
          s=s.replace('<b>HOYO</b>','<b style="color:#72ff42">HOYO</b>',1)
          s=s.replace('<b style="display:block;margin-top:6px;text-align:center">GROSS</b>','<b style="display:block;margin-top:6px;text-align:center;color:#72ff42">GROSS</b>',1)
          s=s.replace('font-size:20px;font-weight:800">ENTER</button>','font-size:20px;font-weight:800;background:#72ff42;color:#000;border:1px solid #72ff42">ENTER</button>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validate requested scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'color:#72ff42">JUGADOR' index-grupal.html
          grep -Fq 'color:#72ff42">HOYO' index-grupal.html
          grep -Fq 'color:#72ff42">GROSS' index-grupal.html
          grep -Fq 'background:#72ff42;color:#000' index-grupal.html
          grep -Fq 'class="sfGridName"' index-grupal.html
          grep -Fq 'p.name=name' index-grupal.html
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html
          git commit -m 'Stableford V239 neon manual labels and editable names'
          git push origin stableford-tournament-final