name: Stableford V217 force route
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v217-force-route.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
          fetch-depth: 0
      - name: Force STABLE selector into Stableford setup
        shell: python
        run: |
          from pathlib import Path
          p=Path('stableford.js'); s=p.read_text(encoding='utf-8')
          old='''    const categoryButtons=[...document.querySelectorAll("[data-stableford-category]")];'''
          new='''    const stableSelector=document.querySelector('[data-course-key="stableford"]');\n    if(stableSelector&&!stableSelector.__stablefordRoute){stableSelector.__stablefordRoute=true;stableSelector.addEventListener("click",e=>{e.preventDefault();e.stopImmediatePropagation();overlay.classList.add("visible");overlay.setAttribute("aria-hidden","false");},true)}\n    const categoryButtons=[...document.querySelectorAll("[data-stableford-category]")];'''
          if s.count(old)!=1: raise SystemExit('route anchor mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "stableford.js"
          grep -Fq '__stablefordRoute' stableford.js
          node --check stableford.js
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stableford.js
          git commit -m 'Stableford V217 force STABLE selector to Stableford setup'
          git push origin stableford-tournament-final