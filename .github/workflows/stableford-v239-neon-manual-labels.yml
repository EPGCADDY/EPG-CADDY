name: Stableford V239 neon manual labels
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v239-neon-manual-labels.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
      - name: Apply requested neon green styling only
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html');s=p.read_text(encoding='utf-8')
          s=s.replace('<b style="text-align:center">JUGADOR</b>','<b style="text-align:center;color:#72ff42;text-shadow:0 0 8px #72ff42">JUGADOR</b>')
          s=s.replace('<b>HOYO</b>','<b style="color:#72ff42;text-shadow:0 0 8px #72ff42">HOYO</b>')
          s=s.replace('<b style="display:block;margin-top:6px;text-align:center">GROSS</b>','<b style="display:block;margin-top:6px;text-align:center;color:#72ff42;text-shadow:0 0 8px #72ff42">GROSS</b>')
          s=s.replace('font-size:20px;font-weight:800">ENTER</button>','font-size:20px;font-weight:800;background:#72ff42;color:#000;border:2px solid #72ff42;box-shadow:0 0 14px rgba(114,255,66,.65)">ENTER</button>')
          p.write_text(s,encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'JUGADOR</b>' index-grupal.html
          grep -Fq 'HOYO</b>' index-grupal.html
          grep -Fq 'GROSS</b>' index-grupal.html
          grep -Fq 'background:#72ff42;color:#000' index-grupal.html
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html
          git commit -m 'Stableford V239 neon green manual labels and Enter'
          git push origin stableford-tournament-final