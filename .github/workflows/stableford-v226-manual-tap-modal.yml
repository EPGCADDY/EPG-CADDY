name: Stableford V226 manual tap modal
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v226-manual-tap-modal.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
          fetch-depth: 0
      - name: Replace fragile inline input with tap prompt
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html');s=p.read_text(encoding='utf-8')
          a=s.index('function stablefordPlayerBlock(player,slot){')
          b=s.index('\nplayerBlock=function',a)
          block=s[a:b]
          block=block.replace('''const cell=(key,h)=>{if(key==="points")return`<td class="stableford-points">${player?stablefordCell(player,h,key):""}</td>`;if(!player)return'<td class="gross-cell"></td>';const value=GSCStableford.holeResult(player?.holes?.[h],PAR[h-1]);const shown=value.recorded?(value.status==="x"?"X":String(value.gross??"")):"";return`<td class="gross-cell stableford-manual-cell"><input class="stableford-gross-input" inputmode="numeric" pattern="[0-9]*" maxlength="2" aria-label="${escapeHtml(player.name)} hoyo ${h} Gross" data-sf-player="${escapeHtml(player.id)}" data-sf-hole="${h}" value="${shown}"></td>`};''','''const cell=(key,h)=>{if(key==="points")return`<td class="stableford-points">${player?stablefordCell(player,h,key):""}</td>`;if(!player)return'<td class="gross-cell"></td>';return`<td class="gross-cell stableford-manual-cell" data-sf-player="${escapeHtml(player.id)}" data-sf-hole="${h}" role="button" tabindex="0">${stablefordCell(player,h,"gross")}</td>`};''')
          s=s[:a]+block+s[b:]
          old='''  $("scorecard").querySelectorAll(".stableford-gross-input").forEach(input=>{input.addEventListener("click",e=>e.stopPropagation());input.addEventListener("touchstart",e=>e.stopPropagation(),{passive:true});input.addEventListener("change",()=>{const p=round.players.find(x=>x.id===input.dataset.sfPlayer),hole=Number(input.dataset.sfHole),raw=input.value.trim().toUpperCase();if(!p||!hole)return;if(raw===""){delete p.holes[hole];persist();render();return}const result=saveEntry({player:p.name,hole,status:raw==="X"?"x":null,gross:raw==="X"?null:Number(raw)});if(result.ok){persist();render()}else{input.value=stablefordCell(p,hole,"gross")}})});'''
          new='''  $("scorecard").querySelectorAll(".stableford-manual-cell").forEach(cell=>{const edit=()=>{const p=round.players.find(x=>x.id===cell.dataset.sfPlayer),hole=Number(cell.dataset.sfHole);if(!p||!hole)return;const current=GSCStableford.holeResult(p.holes?.[hole],PAR[hole-1]);const raw=window.prompt(`${p.name} · HOYO ${hole} · GROSS`,current.recorded?(current.status==="x"?"X":String(current.gross??"")):"");if(raw===null)return;const value=raw.trim().toUpperCase();if(value===""){delete p.holes[hole];persist();render();return}const result=saveEntry({player:p.name,hole,status:value==="X"?"x":null,gross:value==="X"?null:Number(value)});if(result.ok){persist();render()}else window.alert("SCORE INVÁLIDO")};cell.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();edit()});cell.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();edit()}})});'''
          if old not in s: raise SystemExit('old manual binding missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Add deterministic test and run suite
        shell: bash
        run: |
          set -euo pipefail
          cat > test-stableford-manual.mjs <<'EOF'
          import assert from 'node:assert/strict';import fs from 'node:fs';
          const h=fs.readFileSync('index-grupal.html','utf8');
          assert.match(h,/stableford-manual-cell/);
          assert.match(h,/window\.prompt\(`\$\{p\.name\} · HOYO \$\{hole\} · GROSS`/);
          assert.match(h,/saveEntry\(\{player:p\.name,hole,status:value==="X"\?"x":null,gross:value==="X"\?null:Number\(value\)\}\)/);
          assert.match(h,/if\(result\.ok\)\{persist\(\);render\(\)\}/);
          assert.match(h,/points:GSCStableford\.pointsFor\(v\.gross,PAR\[v\.hole-1\]\)/);
          console.log('PASS manual Gross -> saveEntry -> points -> persist -> render');
          EOF
          git diff --check
          node test-stableford-manual.mjs
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html test-stableford-manual.mjs
          git commit -m 'Stableford V226 robust manual Gross tap entry with tests'
          git push origin stableford-tournament-final