name: Grupal round capture V103

on:
  push:
    branches: [grupal-dev]
    paths:
      - '.github/workflows/grupal-round-capture-v103.yml'

permissions:
  contents: write

jobs:
  patch-audit-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grupal-dev
          fetch-depth: 0

      - name: Patch capture and unauthorized audio guard
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html')
          s=p.read_text(encoding='utf-8')
          def rep(old,new,count=1):
              global s
              n=s.count(old)
              if n!=count:
                  raise SystemExit(f'Expected {count}, found {n}: {old[:120]!r}')
              s=s.replace(old,new,count)

          rep('<meta name="gscg-build" content="V101-ROUND-MIC-SESSION-STABLE-20260817">','<meta name="gscg-build" content="V103-ROUND-CAPTURE-GOLF-VOCAB-20260817">')
          rep('localAudio.autoplay=true;localAudio.playsInline=true;localAudio.muted=true;','localAudio.autoplay=true;localAudio.playsInline=true;localAudio.muted=true;localAudio.volume=0;')
          rep('if(audioEl&&on)audioEl.muted=true;','if(audioEl&&on){audioEl.muted=true;audioEl.volume=0;}')
          rep('if(!authorized){if(audioEl)audioEl.muted=true;cancelResponseSafe(activeResponseId);clearOutputAudioSafe();activeResponseId=null;speechPlaybackResponseId=null;return}','if(!authorized){if(audioEl){audioEl.muted=true;audioEl.volume=0;}cancelResponseSafe(activeResponseId);clearOutputAudioSafe();activeResponseId=null;speechPlaybackResponseId=null;return}')
          rep('if(audioEl)audioEl.muted=false;\n  sendEvent({type:"response.create",response:responseForActiveShape(reason,token,spokenText)});','if(audioEl){audioEl.volume=1;audioEl.muted=false;}\n  sendEvent({type:"response.create",response:responseForActiveShape(reason,token,spokenText)});')
          s=s.replace('if(audioEl)audioEl.muted=true;','if(audioEl){audioEl.muted=true;audioEl.volume=0;}')

          old='''function readGolfGrossAt(tokens,i,hole){\n  if(!hole||hole<1||hole>18)return null;\n  const par=PAR[hole-1],a=tokens[i],b=tokens[i+1],c=tokens[i+2];\n  if(["aguila","eagle","igle"].includes(a))return{gross:par-2,next:i+1};\n  if(["birdie","birdy","berdie","verdi","verde"].includes(a))return{gross:par-1,next:i+1};\n  if(a==="even"&&b==="par")return{gross:par,next:i+2};\n  if(a==="par"&&b!=="espanol"&&b!=="español")return{gross:par,next:i+1};\n  if(["bogey","boggy","bogui","bogi"].includes(a))return{gross:par+1,next:i+1};\n  if((a==="doble"||a==="double"||a==="w")&&["bogey","boggy","bogui","bogi"].includes(b))return{gross:par+2,next:i+2};\n  if(a==="triple"&&["bogey","boggy","bogui","bogi"].includes(b))return{gross:par+3,next:i+2};\n  if((a==="doble"&&b==="par")||(a==="par"&&(b==="espanol"||b==="español"))){\n    if(par===3)return{gross:6,next:i+2};\n    if(par===4)return{gross:8,next:i+2};\n    return null;\n  }\n  return null;\n}\n'''
          new='''function readGolfGrossAt(tokens,i,hole){\n  if(!hole||hole<1||hole>18)return null;\n  const par=PAR[hole-1],a=tokens[i],b=tokens[i+1],c=tokens[i+2];\n  if(["albatros","albatross"].includes(a)){const gross=par-3;return gross>=1?{gross,next:i+1}:null}\n  if(["aguila","eagle","igle"].includes(a))return{gross:par-2,next:i+1};\n  if(["birdie","birdy","berdie","verdi","verde"].includes(a))return{gross:par-1,next:i+1};\n  if(a==="even"&&b==="par")return{gross:par,next:i+2};\n  if(a==="par"&&b!=="espanol"&&b!=="español")return{gross:par,next:i+1};\n  if(["bogey","boggy","bogui","bogi"].includes(a))return{gross:par+1,next:i+1};\n  if((a==="doble"||a==="double"||a==="w")&&["bogey","boggy","bogui","bogi"].includes(b))return{gross:par+2,next:i+2};\n  if(a==="triple"&&["bogey","boggy","bogui","bogi"].includes(b))return{gross:par+3,next:i+2};\n  if((a==="doble"&&b==="par")||(a==="par"&&(b==="espanol"||b==="español"))){\n    if(par===3)return{gross:6,next:i+2};\n    if(par===4)return{gross:8,next:i+2};\n    return null;\n  }\n  const rel=parseSpanishNumberTokens(tokens,i);\n  if(rel&&["bajo","debajo"].includes(tokens[rel.next])&&tokens[rel.next+1]==="par"){const gross=par-rel.value;return gross>=1?{gross,next:rel.next+2}:null}\n  if(rel&&["sobre","arriba"].includes(tokens[rel.next])&&tokens[rel.next+1]==="par"){const gross=par+rel.value;return gross<=30?{gross,next:rel.next+2}:null}\n  return null;\n}\n'''
          rep(old,new)
          rep('Vocabulario esperado: águila, eagle, birdie, par, even par, bogey, doble bogey, triple bogey, doble par, corrección, corrijo, corregir, acumulado, agregar jugador, quitar jugador, corregir nombre, corregir handicap, rectificación de handicap y Stop.','Dos formas válidas de score: número Gross directo o nombre golfístico. Vocabulario esperado: albatros, águila, eagle, birdie, par, even par, bogey, doble bogey, triple bogey, doble par, uno bajo par, uno sobre par, dos sobre par, tres sobre par, corrección, corrijo, corregir, acumulado, agregar jugador, quitar jugador, corregir nombre, corregir handicap, rectificación de handicap y Stop.')
          p.write_text(s,encoding='utf-8')

      - name: Audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index-grupal.html').read_text(encoding='utf-8')
          assert 'V103-ROUND-CAPTURE-GOLF-VOCAB-20260817' in s
          assert 'localAudio.volume=0' in s
          assert 'audioEl.volume=1' in s
          assert '["albatros","albatross"]' in s
          assert '["bajo","debajo"]' in s
          assert '["sobre","arriba"]' in s
          assert 'create_response:false,interrupt_response:false' in s
          assert s.count('function readGolfGrossAt(') == 1
          assert s.count('function recordScore(a)') == 1
          assert s.count('function recordScores(a)') == 1
          assert s.count('function startConfirmedRound()') == 1
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/g.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/g.js
          git diff --check
          test "$(git diff --name-only)" = "index-grupal.html"

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "grupal-dev"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-grupal.html
          git commit -m "[round-voice] harden score capture and golf vocabulary"
          git push origin HEAD:grupal-dev
