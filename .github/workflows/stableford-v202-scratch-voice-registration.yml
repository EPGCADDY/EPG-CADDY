name: Stableford V202 scratch voice registration
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v202-scratch-voice-registration.yml']
permissions:
  contents: write
jobs:
  patch-audit-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
          fetch-depth: 0
      - name: Patch Stableford-only setup parser
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html'); s=p.read_text(encoding='utf-8')
          anchor='''function parseSetupTranscript(transcript){\n  const text=normalizeSpeech(transcript);let tokens=text.split(" ").filter(Boolean);tokens=stripPulteCourseTokens(tokens);if(!tokens.length)return{ok:false,speech:"Error"};'''
          replacement='''function activeStablefordSetupConfig(){\n  const overlay=$("stablefordSetupOverlay");\n  if(!overlay?.classList?.contains("visible")||typeof GSCStableford==="undefined")return null;\n  const active=document.querySelector("[data-stableford-category].active")||document.querySelector("[data-stableford-category][aria-pressed='true']");\n  const category=active?.dataset?.stablefordCategory||stablefordSetupCategory||null;\n  return GSCStableford.categoryConfig(category);\n}\nfunction parseStablefordScratchSetupTranscript(transcript,cfg){\n  let tokens=normalizeSpeech(transcript).split(" ").filter(Boolean);\n  if(!tokens.length||!cfg)return{ok:false,speech:"Error"};\n  const changes=[];let i=0;\n  while(i<tokens.length){\n    while(i<tokens.length&&["y","luego","despues","después","jugadores","jugadoras"].includes(tokens[i]))i++;\n    if(i>=tokens.length)break;\n    if(["jugador","jugadora"].includes(tokens[i]))i++;\n    const pos=playerPositionToken(tokens[i]);if(!pos||pos<1||pos>4)return{ok:false,speech:"Error"};i++;\n    const start=i;\n    while(i<tokens.length){\n      if(["jugador","jugadora"].includes(tokens[i])&&playerPositionToken(tokens[i+1]))break;\n      i++;\n    }\n    const name=tokens.slice(start,i).filter(t=>!["y","luego","despues","después"].includes(t)).join(" ").trim();\n    if(!name)return{ok:false,speech:"Error"};\n    changes.push({position:pos,name:titleName(name),handicap:0,tee:cfg.tee,matrix:"Caballeros"});\n    if(changes.length>4)return{ok:false,speech:"Error"};\n  }\n  return changes.length?{ok:true,changes}:{ok:false,speech:"Error"};\n}\nfunction parseSetupTranscript(transcript){\n  const stableCfg=activeStablefordSetupConfig();\n  if(stableCfg)return parseStablefordScratchSetupTranscript(transcript,stableCfg);\n  const text=normalizeSpeech(transcript);let tokens=text.split(" ").filter(Boolean);tokens=stripPulteCourseTokens(tokens);if(!tokens.length)return{ok:false,speech:"Error"};'''
          if s.count(anchor)!=1: raise SystemExit(f'guard parser anchor count={s.count(anchor)}')
          s=s.replace(anchor,replacement,1)
          p.write_text(s,encoding='utf-8')
      - name: Audit frozen scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "index-grupal.html"
          grep -q 'parseStablefordScratchSetupTranscript' index-grupal.html
          grep -q 'handicap:0,tee:cfg.tee' index-grupal.html
          grep -q 'pos>4' index-grupal.html
          grep -q 'model: "gpt-live-transcribe"' api/session-grupal.js
          git diff --quiet HEAD -- api/session-grupal.js stableford.js stableford-torneo.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index-grupal.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/g.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/g.js
          node test-voice-continuity.mjs
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html
          git commit -m 'Stableford V202 accept scratch player names by voice'
          git push origin stableford-tournament-final
          git rm .github/workflows/stableford-v202-scratch-voice-registration.yml
          git commit -m 'Remove temporary Stableford V202 patch workflow'
          git push origin stableford-tournament-final