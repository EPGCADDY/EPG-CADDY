name: LAB capture current timer manual screen
on:
  push:
    branches: [laboratorio]
permissions:
  contents: write
jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: laboratorio
      - name: Install Chromium
        run: |
          mkdir -p /tmp/timer-capture
          cd /tmp/timer-capture
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-audit --no-fund
          npx playwright install chromium
      - name: Capture current timer physically
        run: |
          python3 -m http.server 8765 >/tmp/timer-http.log 2>&1 &
          sleep 2
          mkdir -p timer-capture
          cat > /tmp/timer-capture/capture.cjs <<'NODE'
          const {chromium}=require('/tmp/timer-capture/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:430,height:932},deviceScaleFactor:2});
            await page.route('**/api/account**',route=>{
              const u=new URL(route.request().url());
              if(u.searchParams.get('action')==='session') return route.fulfill({status:200,contentType:'application/json',body:'{"ok":true,"user":{"id":"timer-audit","email":"timer@example.com"}}'});
              return route.fulfill({status:200,contentType:'application/json',body:'{"ok":true,"user":{"id":"timer-audit"}}'});
            });
            await page.route('**/api/app-access**',route=>route.fulfill({status:200,contentType:'application/json',body:'{"ok":true,"role":"owner"}'}));
            await page.goto('http://127.0.0.1:8765/index-grupal.html',{waitUntil:'networkidle'});
            await page.waitForTimeout(600);
            await page.evaluate(()=>{
              const title=document.querySelector('#timeMonitorTitle');
              const timer=document.querySelector('.round-status-row.gsc-time-four');
              if(!title||!timer) throw new Error('Timer block not found');
              const wrap=document.createElement('section');
              wrap.id='timerAuditVisible';
              wrap.style.cssText='position:fixed;left:12px;right:12px;top:180px;z-index:2147483647;background:#000;padding:18px 14px;border:1px solid #394239;border-radius:14px;display:block!important;visibility:visible!important;opacity:1!important';
              const titleClone=title.cloneNode(true);
              const timerClone=timer.cloneNode(true);
              titleClone.style.display='block';
              timerClone.style.display='grid';
              wrap.appendChild(titleClone);
              wrap.appendChild(timerClone);
              document.body.appendChild(wrap);
            });
            await page.waitForTimeout(200);
            const block=page.locator('#timerAuditVisible');
            await block.screenshot({path:'timer-capture/MONITOR_TIEMPO_REAL_LAB.png'});
            await page.screenshot({path:'timer-capture/MONITOR_TIEMPO_CONTEXTO_LAB.png',fullPage:false});
            await page.evaluate(()=>{
              const ids=['.device-closure-controls','.summary','#timeMonitorTitle','.round-status-row.gsc-time-four','.round-actions','.round-secondary-actions'];
              const wrap=document.createElement('section');
              wrap.id='roundOpsAuditVisible';
              wrap.style.cssText='position:fixed;left:8px;right:8px;top:70px;bottom:20px;z-index:2147483647;background:#000;padding:14px;border:1px solid #394239;border-radius:14px;display:block!important;visibility:visible!important;opacity:1!important;overflow:auto';
              for(const sel of ids){
                const el=document.querySelector(sel); if(!el) continue;
                const clone=el.cloneNode(true); clone.style.display=clone.classList.contains('round-status-row')?'grid':'block';
                wrap.appendChild(clone);
              }
              document.body.appendChild(wrap);
            });
            await page.waitForTimeout(150);
            await page.locator('#roundOpsAuditVisible').screenshot({path:'timer-capture/OPERACION_RONDA_INFERIOR_REAL_LAB.png'});
            const labels=await block.innerText();
            require('fs').writeFileSync('timer-capture/labels.txt',labels);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/timer-capture/capture.cjs
      - name: Publish current timer screens into manual assets
        run: |
          mkdir -p docs/manual/current
          cp timer-capture/MONITOR_TIEMPO_REAL_LAB.png docs/manual/current/MONITOR_TIEMPO_REAL_LAB.png
          cp timer-capture/MONITOR_TIEMPO_CONTEXTO_LAB.png docs/manual/current/MONITOR_TIEMPO_CONTEXTO_LAB.png
          cp timer-capture/OPERACION_RONDA_INFERIOR_REAL_LAB.png docs/manual/current/OPERACION_RONDA_INFERIOR_REAL_LAB.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/manual/current/MONITOR_TIEMPO_REAL_LAB.png docs/manual/current/MONITOR_TIEMPO_CONTEXTO_LAB.png docs/manual/current/OPERACION_RONDA_INFERIOR_REAL_LAB.png
          if ! git diff --cached --quiet; then
            git commit -m "LAB manual: publish current physical timer screenshots"
            git push origin HEAD:laboratorio
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: current-timer-screen
          path: timer-capture
          retention-days: 1
