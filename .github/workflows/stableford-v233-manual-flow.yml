name: Stableford V233 manual flow
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v233-manual-flow.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
      - name: Add enter progression
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html');s=p.read_text(encoding='utf-8')
          old='''if(result.ok){persist();localStorage.setItem(STABLEFORD_ACTIVE_KEY,JSON.stringify(round));render()}else window.alert("SCORE INVÁLIDO")}});'''
          new='''if(result.ok){persist();localStorage.setItem(STABLEFORD_ACTIVE_KEY,JSON.stringify(round));const inputs=[...manual.querySelectorAll(".sfGridGross")],idx=inputs.indexOf(input);if(idx<inputs.length-1){inputs[idx+1].focus();inputs[idx+1].select()}else{manual.dataset.hole=String(Math.min(18,hole+1));render();setTimeout(()=>manual.querySelector(".sfGridGross")?.focus(),0)}}else window.alert("SCORE INVÁLIDO")}});'''
          if old not in s: raise SystemExit('flow anchor mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'idx<inputs.length-1' index-grupal.html
          grep -Fq 'manual.dataset.hole=String(Math.min(18,hole+1))' index-grupal.html
          grep -Fq 'inputs[idx+1].focus()' index-grupal.html
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html
          git commit -m 'Stableford V233 number-enter flow through players and holes'
          git push origin stableford-tournament-final