name: Stableford V235 hole enter UI
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v235-hole-enter-ui.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
      - name: Add HOYO label and visible Enter button
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html');s=p.read_text(encoding='utf-8')
          old='''<b>JUGADOR</b><select id="sfGridHole" style="min-height:40px;font-size:16px">${ALL.map(h=>`<option value="${h}" ${h===selectedHole?"selected":""}>H${h}</option>`).join("")}</select><b>GROSS</b>'''
          new='''<b>JUGADOR</b><label style="display:flex;flex-direction:column;align-items:center;font-weight:700">HOYO<select id="sfGridHole" style="min-height:40px;font-size:22px;text-align:center;width:72px">${ALL.map(h=>`<option value="${h}" ${h===selectedHole?"selected":""}>${h}</option>`).join("")}</select></label><b>GROSS</b>'''
          if old not in s: raise SystemExit('hole header anchor mismatch')
          s=s.replace(old,new,1)
          old2='''<input class="sfGridGross" data-player="${escapeHtml(p.id)}" inputmode="numeric" type="number" min="1" max="30" style="min-height:40px;font-size:18px;text-align:center" value="${GSCStableford.holeResult(p.holes?.[selectedHole],PAR[selectedHole-1]).recorded?(GSCStableford.holeResult(p.holes?.[selectedHole],PAR[selectedHole-1]).gross??""):""}">'''
          new2='''<span style="display:flex;gap:5px"><input class="sfGridGross" data-player="${escapeHtml(p.id)}" inputmode="numeric" type="number" min="1" max="30" style="min-height:44px;font-size:22px;text-align:center;width:100%" value="${GSCStableford.holeResult(p.holes?.[selectedHole],PAR[selectedHole-1]).recorded?(GSCStableford.holeResult(p.holes?.[selectedHole],PAR[selectedHole-1]).gross??""):""}"><button class="sfGridEnter" data-player="${escapeHtml(p.id)}" type="button" style="min-width:70px;min-height:44px;font-weight:800">ENTER</button></span>'''
          if old2 not in s: raise SystemExit('gross input anchor mismatch')
          s=s.replace(old2,new2,1)
          old3='''manual.querySelectorAll(".sfGridGross").forEach(input=>{input.onkeydown=e=>{if(e.key!=="Enter")return;e.preventDefault();const p=round.players.find(x=>x.id===input.dataset.player),hole=selectedHole,gross=Number(input.value);const result=saveEntry({player:p?.name,hole,gross});'''
          new3='''const commitManual=input=>{const p=round.players.find(x=>x.id===input.dataset.player),hole=selectedHole,gross=Number(input.value);const result=saveEntry({player:p?.name,hole,gross});'''
          if old3 not in s: raise SystemExit('enter handler anchor mismatch')
          s=s.replace(old3,new3,1)
          old4='''else window.alert("SCORE INVÁLIDO")}});'''
          new4='''else window.alert("SCORE INVÁLIDO")};manual.querySelectorAll(".sfGridGross").forEach(input=>input.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();commitManual(input)}});manual.querySelectorAll(".sfGridEnter").forEach(btn=>btn.onclick=()=>{const input=manual.querySelector(`.sfGridGross[data-player="${btn.dataset.player}"]`);if(input)commitManual(input)});'''
          if old4 not in s: raise SystemExit('handler close anchor mismatch')
          s=s.replace(old4,new4,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq '>HOYO<select id="sfGridHole"' index-grupal.html
          grep -Fq 'class="sfGridEnter"' index-grupal.html
          grep -Fq '>ENTER</button>' index-grupal.html
          grep -Fq 'commitManual(input)' index-grupal.html
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html
          git commit -m 'Stableford V235 show HOYO number and explicit Enter'
          git push origin stableford-tournament-final