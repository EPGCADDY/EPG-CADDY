name: Manual R106 H2 diagnostic
on:
  push:
    branches: [diag/manual-r106-h2-audit]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run exact Vercel build command
        run: node scripts/build-manual-lab.mjs
