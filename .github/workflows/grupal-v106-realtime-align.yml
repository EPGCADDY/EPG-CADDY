name: Grupal V106 Realtime align

on:
  push:
    branches: [grupal-dev]
    paths:
      - '.github/workflows/grupal-v106-realtime-align.yml'

permissions:
  contents: write

jobs:
  patch-audit-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grupal-dev
          fetch-depth: 0
      - name: Patch server Realtime config only
        shell: python
        run: |
          from pathlib import Path
          p=Path('api/session-grupal.js')
          s=p.read_text(encoding='utf-8')
          def rep(old,new,count=1):
              global s
              n=s.count(old)
              if n!=count: raise SystemExit(f'Expected {count}, found {n}: {old[:120]!r}')
              s=s.replace(old,new,count)
          rep('const silence = context === "setup" ? 1500 : 3000;','const silence = context === "setup" ? 1500 : 4000;')
          rep('''      : `Golf Guatemala. Dictado de scores. Jugadores actuales: ${players || "los registrados en la tarjeta"}. Transcribe literalmente nombre, hoyo y score o Gross. Regla mandatoria: Jessie se escribe Jessie.`;''','''      : `Golf Guatemala. Dictado de scores. Jugadores actuales: ${players || "los registrados en la tarjeta"}. Transcribe literalmente nombres, hoyo y score o Gross. Acepta número Gross directo o vocabulario golfístico: albatros, águila, eagle, birdie, par, even par, bogey, doble bogey, triple bogey, doble par, uno bajo par, uno sobre par, dos sobre par y tres sobre par. Si un primer nombre es único en el grupo puede dictarse solo ese nombre; si hay dos jugadores con el mismo primer nombre, puede dictarse únicamente el apellido. Regla mandatoria: Jessie se escribe Jessie.`;''')
          rep('speed: 0.92','speed: 1.15')
          p.write_text(s,encoding='utf-8')
      - name: Audit
        shell: bash
        run: |
          set -euo pipefail
          node --check api/session-grupal.js
          git diff --check
          test "$(git diff --name-only)" = "api/session-grupal.js"
          grep -q 'context === "setup" ? 1500 : 4000' api/session-grupal.js
          grep -q 'speed: 1.15' api/session-grupal.js
          grep -q 'doble bogey' api/session-grupal.js
          git diff --quiet HEAD -- index.html index-grupal.html api/session.js api/score.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/session-grupal.js
          git commit -m "V106 align group Realtime server session"
          git push origin grupal-dev
