name: Mobile native package

on:
  push:
    branches:
      - main
      - v284-native-packages-ready
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  native-package:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Block package when ROADMAPS are incomplete
        env:
          ROADMAP_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          ROADMAP_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/roadmap-gate.mjs "$ROADMAP_BASE_SHA" "$ROADMAP_HEAD_SHA"

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact application dependencies
        run: npm ci

      - name: Generate iOS and Android projects
        run: npm run mobile:prepare

      - name: Validate native package contract
        run: node test-v284-native-package-generation.mjs

      - name: Compile unsigned Android App Bundle
        working-directory: native/android
        run: ./gradlew bundleRelease

      - name: Compile unsigned iOS application
        run: |
          if [ -d native/ios/App/App.xcworkspace ]; then
            xcodebuild -workspace native/ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Release -derivedDataPath native/build/ios CODE_SIGNING_ALLOWED=NO build
          else
            xcodebuild -project native/ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Release -derivedDataPath native/build/ios CODE_SIGNING_ALLOWED=NO build
          fi

      - name: Preserve unsigned native source package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golf-score-card-gt-native-unsigned
          if-no-files-found: error
          retention-days: 90
          path: |
            native/ios
            native/android
            mobile-www
            capacitor.config.json
            mobile-release.json
            package.json
