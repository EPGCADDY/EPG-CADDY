name: Promote verified Four Ball TEAM LAB to stable LAB alias
on:
  push:
    branches:
      - laboratorio
permissions:
  contents: write
jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Promote exact READY LAB deployment to stable LAB alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          npx --yes vercel@48.10.0 promote https://golf-sc-gt-h4x75umwp-epgcaddys-projects.vercel.app --scope epgcaddys-projects --token "$VERCEL_TOKEN" --yes
      - uses: actions/checkout@v4
        with:
          ref: laboratorio
      - name: Remove temporary LAB promotion workflow
        run: |
          git rm .github/workflows/promote-fourball-team-lab.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary Four Ball TEAM LAB promotion workflow'
          git push origin HEAD:laboratorio
