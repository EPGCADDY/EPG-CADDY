name: Manual Sync Atajos Logo

on:
  push:
    branches: [laboratorio]
    paths:
      - '.github/workflows/manual-sync-atajos-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: laboratorio
      - name: Update manual and parity gate
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const manualPath='manual.html';
          const gatePath='scripts/manual-screen-parity-gate.mjs';
          let manual=fs.readFileSync(manualPath,'utf8');
          const re=/<section class="page" id="p49" data-index="49">[\s\S]*?<\/section>/;
          const m=manual.match(re);
          if(!m) throw new Error('P49 no encontrada');
          let p49=m[0];
          const logo='/assets/official-logos/golf-score-card-gt-pwa-v345-192.png';
          if(!p49.includes(logo)){
            const marker='<div class="screen-replica">';
            if(!p49.includes(marker)) throw new Error('P49 sin screen-replica');
            const launcher='<div class="sr-section"><div class="sr-section-title">ACCESO ATAJOS</div><div style="display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0"><img src="'+logo+'" alt="Golf Score Card GT" style="width:42px;height:42px;border-radius:9px"><strong style="color:#31ff00;font-size:12px">ATAJOS</strong></div><div class="sr-note">El acceso universal ATAJOS se identifica con el logo oficial de Golf Score Card GT y la palabra ATAJOS debajo.</div></div>';
            p49=p49.replace(marker,marker+launcher);
            manual=manual.replace(re,p49);
            fs.writeFileSync(manualPath,manual);
          }
          let gate=fs.readFileSync(gatePath,'utf8');
          const guard='assert(page("49").includes("/assets/official-logos/golf-score-card-gt-pwa-v345-192.png")&&page("49").includes("logo oficial"),"P49 debe documentar el launcher ATAJOS con logo oficial");\nassert(shortcuts.includes("/assets/official-logos/golf-score-card-gt-pwa-v345-192.png")&&shortcuts.includes("<span>ATAJOS</span>"),"LAB debe usar logo oficial + etiqueta ATAJOS en el launcher universal");\n';
          if(!gate.includes('P49 debe documentar el launcher ATAJOS con logo oficial')){
            const anchor='assert(manual.includes("MIS FAVORITOS")&&manual.includes("REVISADO 100% · PLANTILLA ÚNICA"),"Capítulo tutorial R2 incompleto");\n';
            if(!gate.includes(anchor)) throw new Error('Anchor gate no encontrado');
            gate=gate.replace(anchor,anchor+guard);
            fs.writeFileSync(gatePath,gate);
          }
          NODE
          node scripts/manual-screen-parity-gate.mjs
      - name: Commit synchronized manual
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'NO_CHANGES'
            exit 0
          fi
          git config user.name 'EPGCADDY'
          git config user.email 'jaimekirste@gmail.com'
          git add manual.html scripts/manual-screen-parity-gate.mjs
          git commit -m 'LAB manual: document official-logo Atajos launcher'
          git push origin HEAD:laboratorio
