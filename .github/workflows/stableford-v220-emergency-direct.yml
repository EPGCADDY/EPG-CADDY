name: Stableford V220 emergency direct
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v220-emergency-direct.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
          fetch-depth: 0
      - name: Direct-load qualifying round
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html'); s=p.read_text(encoding='utf-8')
          old='''if(new URLSearchParams(location.search).get("stableford_emergency")==="countryclub"){localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(STORAGE_BACKUP_KEY);localStorage.removeItem(DRAFT_STORAGE_KEY);}\nlet round=loadRound(),draftPlayers=[]'''
          new='''const sfEmergency=new URLSearchParams(location.search).get("stableford_emergency")==="countryclub";\nif(sfEmergency){localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(STORAGE_BACKUP_KEY);localStorage.removeItem(DRAFT_STORAGE_KEY);}\nlet round=loadRound(),draftPlayers=[]'''
          if s.count(old)!=1: raise SystemExit('emergency anchor mismatch')
          s=s.replace(old,new,1)
          marker='''let setupSegmentOrder=[],setupSegmentText=new Map()'''
          inject='''if(sfEmergency){round.configured=true;round.provisional=false;round.courseKey="country_club";round.course="Guatemala Country Club";round.mode="stableford";round.stablefordCategory="senior";round.players=["Jaime","Junior","Adolfo","Herny"].map((name,i)=>({id:`sf${i+1}`,name,handicap:0,tee:"Blanco",matrix:"Caballeros",whatsapp:"",holes:{},lastHole:null,activeFrom:1,slot:i+1}));localStorage.setItem(STORAGE_KEY,JSON.stringify(round));}\nlet setupSegmentOrder=[],setupSegmentText=new Map()'''
          if s.count(marker)!=1: raise SystemExit('setup anchor mismatch')
          p.write_text(s.replace(marker,inject,1),encoding='utf-8')
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "index-grupal.html"
          grep -Fq 'round.mode="stableford"' index-grupal.html
          grep -Fq '["Jaime","Junior","Adolfo","Herny"]' index-grupal.html
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html
          git commit -m 'Stableford V220 direct-load Country Club qualifying group'
          git push origin stableford-tournament-final