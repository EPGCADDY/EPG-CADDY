name: Stableford V240 integrated accumulated
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v240-integrated-accumulated.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
      - name: Move accumulated points into manual panel
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html');s=p.read_text(encoding='utf-8')
          old='''</div><button id="sfGridEnter" type="button"'''
          new='''</div><div style="display:grid;grid-template-columns:1fr 70px 70px 70px;gap:5px;margin-top:8px;align-items:center"><b style="color:#72ff42">ACUMULADO</b><b style="text-align:center;color:#72ff42">IN</b><b style="text-align:center;color:#72ff42">OUT</b><b style="text-align:center;color:#72ff42">TOTAL</b>${round.players.map(p=>{const i=stablefordTotals(p,FRONT),o=stablefordTotals(p,BACK),t=stablefordTotals(p,ALL);return`<span>${escapeHtml(p.name)}</span><strong style="text-align:center">${i.count?i.points:0}</strong><strong style="text-align:center">${o.count?o.points:0}</strong><strong style="text-align:center;color:#72ff42">${t.count?t.points:0}</strong>`}).join("")}</div><button id="sfGridEnter" type="button"'''
          if s.count(old)!=1: raise SystemExit('manual panel anchor mismatch')
          s=s.replace(old,new,1)
          start=s.find('  let today=document.getElementById("stablefordTodayAccumulated");')
          end=s.find('\n  $("scorecard").querySelectorAll(".stableford-manual-cell")',start)
          if start>=0 and end>=0:s=s[:start]+s[end:]
          p.write_text(s,encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq '>IN</b>' index-grupal.html
          grep -Fq '>OUT</b>' index-grupal.html
          grep -Fq '>TOTAL</b>' index-grupal.html
          grep -Fq 'stablefordTotals(p,FRONT)' index-grupal.html
          grep -Fq 'stablefordTotals(p,BACK)' index-grupal.html
          ! grep -Fq 'stablefordTodayAccumulated' index-grupal.html
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html
          git commit -m 'Stableford V240 integrate IN OUT TOTAL into manual panel'
          git push origin stableford-tournament-final