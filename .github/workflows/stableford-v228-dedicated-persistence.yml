name: Stableford V228 dedicated persistence
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v228-dedicated-persistence.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
          fetch-depth: 0
      - name: Add dedicated Stableford storage
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html');s=p.read_text(encoding='utf-8')
          old='''const sfEmergency=new URLSearchParams(location.search).get("stableford_emergency")==="countryclub";\nlet round=loadRound(),draftPlayers=[]'''
          new='''const sfEmergency=new URLSearchParams(location.search).get("stableford_emergency")==="countryclub";\nconst STABLEFORD_ACTIVE_KEY="golf-score-card-guatemala-stableford-active-v1";\nlet round=loadRound();\nif(sfEmergency){try{const saved=JSON.parse(localStorage.getItem(STABLEFORD_ACTIVE_KEY)||"null");if(saved?.configured&&saved?.mode==="stableford")round=saved}catch{}}\nlet draftPlayers=[]'''
          if old not in s: raise SystemExit('load anchor mismatch')
          s=s.replace(old,new,1)
          old2='''if(result.ok){persist();render()}else window.alert("SCORE INVÁLIDO")'''
          new2='''if(result.ok){persist();localStorage.setItem(STABLEFORD_ACTIVE_KEY,JSON.stringify(round));render()}else window.alert("SCORE INVÁLIDO")'''
          if old2 not in s: raise SystemExit('manual persist anchor mismatch')
          s=s.replace(old2,new2,1)
          old3='''parseRoundScoreTranscript=function(transcript){return isStablefordRound()?parseStablefordTranscript(transcript):baseParseRoundScoreTranscript(transcript)};'''
          new3='''parseRoundScoreTranscript=function(transcript){return isStablefordRound()?parseStablefordTranscript(transcript):baseParseRoundScoreTranscript(transcript)};\nconst basePersistStableford=persist;persist=function(){const out=basePersistStableford();if(isStablefordRound())localStorage.setItem(STABLEFORD_ACTIVE_KEY,JSON.stringify(round));return out};'''
          if old3 not in s: raise SystemExit('global persist anchor mismatch')
          s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'STABLEFORD_ACTIVE_KEY' index-grupal.html
          grep -Fq 'if(saved?.configured&&saved?.mode==="stableford")round=saved' index-grupal.html
          grep -Fq 'if(isStablefordRound())localStorage.setItem(STABLEFORD_ACTIVE_KEY,JSON.stringify(round))' index-grupal.html
          grep -Fq 'stableford-manual-cell' index-grupal.html
          grep -Fq 'points:GSCStableford.pointsFor' index-grupal.html
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
          test -f test-stableford-manual.mjs && node test-stableford-manual.mjs || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html
          git commit -m 'Stableford V228 dedicated active-round persistence'
          git push origin stableford-tournament-final