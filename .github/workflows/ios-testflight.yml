name: Golf Score Card GT · iOS TestFlight

on:
  workflow_dispatch:

jobs:
  archive:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Block TestFlight when ROADMAPS are incomplete
        run: node scripts/roadmap-gate.mjs

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive unsigned iOS app
        working-directory: ios
        run: |
          xcodebuild \
            -project EPGCaddy.xcodeproj \
            -scheme EPGCaddy \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GolfScoreCardGT.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Upload archive artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golf-score-card-gt-ios-unsigned-archive
          path: ${{ runner.temp }}/GolfScoreCardGT.xcarchive
          retention-days: 7
