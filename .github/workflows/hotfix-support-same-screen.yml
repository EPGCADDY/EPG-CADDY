name: Hotfix Support same-screen
on:
  push:
    branches: [main]
    paths: [.support-hotfix-trigger]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply and document Support hotfix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index-grupal.html"); s=p.read_text()
          assert 'href="/manual.pdf"' in s and 'target="_blank"' not in s[s.index('class="live-support-link"'):s.index('class="live-support-link"')+300]
          if "V407-R20-SUPPORT-SAME-SCREEN-SEAL" not in s:
              s += "\n<!-- V407-R20-SUPPORT-SAME-SCREEN-SEAL -->\n"
          p.write_text(s)
          p=Path("service-worker.js"); s=p.read_text()
          if "V407-R20-SUPPORT-SAME-SCREEN-SEAL" not in s:
              s += "\n// V407-R20-SUPPORT-SAME-SCREEN-SEAL\n"
          p.write_text(s)
          p=Path("test-v311-live-support-link.mjs"); s=p.read_text()
          s=s.replace(' target="_blank" rel="noopener noreferrer"','').replace("en otra pestaña","en la misma pantalla")
          p.write_text(s)
          block="\n\n## V407-R20-SUPPORT-SAME-SCREEN · 09 de septiembre de 2026\n\n- index-grupal.html: SUPPORT abre /manual.pdf en la misma pantalla y elimina el parpadeo de ventana nueva en iPhone/PWA.\n- service-worker.js: release R20 activa ACTUALIZAR.\n- test-v311-live-support-link.mjs: control permanente de apertura en la misma pantalla.\n- transporte temporal retirado antes del commit final.\n"
          for name in ("ROADMAP_OVERALL.md","ROADMAP_A_DETALLE.md"):
              p=Path(name); p.write_text(p.read_text().rstrip()+block)
          PY
          git rm .support-hotfix-trigger .github/workflows/hotfix-support-same-screen.yml
          python3 scripts/rebuild-inventory-pdfs.py
      - name: Commit candidate locally
        run: |
          git config user.name "Golf Score Card GT"
          git config user.email "jaimekirste@gmail.com"
          git add -A
          git commit -m "fix(support): seal same-screen opening"
      - name: Verify committed candidate
        run: |
          node test-v311-live-support-link.mjs
          npm run inventory:gate
          npm run roadmap:gate
          node test-project-quality-gate.mjs
          node scripts/project-quality-gate.mjs
      - name: Push verified production
        run: git push origin HEAD:main
