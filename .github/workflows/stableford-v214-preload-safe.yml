name: Stableford V214 safe preload
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v214-preload-safe.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
          fetch-depth: 0
      - name: Preload requested Stableford group before restore
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html'); s=p.read_text(encoding='utf-8')
          anchor='let round=loadRound(),draftPlayers=[]'
          insert='''if(new URLSearchParams(location.search).get("stableford_emergency")==="countryclub"){localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(STORAGE_BACKUP_KEY);localStorage.removeItem(DRAFT_STORAGE_KEY);}\nlet round=loadRound(),draftPlayers=[]'''
          if s.count(anchor)!=1: raise SystemExit('anchor mismatch')
          p.write_text(s.replace(anchor,insert,1),encoding='utf-8')
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "index-grupal.html"
          grep -Fq 'localStorage.removeItem(STORAGE_KEY)' index-grupal.html
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html
          git commit -m 'Stableford V214 reset stale round before loadRound'
          git push origin stableford-tournament-final