name: Grupal V104 score confirmation

on:
  push:
    branches: [grupal-dev]
    paths:
      - '.github/workflows/grupal-v104-score-confirmation.yml'

permissions:
  contents: write

jobs:
  patch-audit-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grupal-dev
          fetch-depth: 0

      - name: Patch only authorized grupal behavior
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index-grupal.html')
          s=p.read_text(encoding='utf-8')

          def rep(old,new,count=1):
              global s
              n=s.count(old)
              if n!=count:
                  raise SystemExit(f'Expected {count}, found {n}: {old[:140]!r}')
              s=s.replace(old,new,count)

          rep('<meta name="gscg-build" content="V103-ROUND-CAPTURE-GOLF-VOCAB-20260817">','<meta name="gscg-build" content="V104-SCORE-CONFIRMATION-ALIASES-20260817">')

          # Current El Pulte card: the course is already configured, so registration starts with players.
          rep('“Pulté. NOMBRE 38 rojas. NOMBRE 14 blancas…”','“NOMBRE 38 rojas. NOMBRE 14 blancas…”')
          rep('"Golf Guatemala. El Pulté. Formato preferido: Pulté; NOMBRE 38 rojas; NOMBRE 14 blancas. El número inmediatamente después del nombre es el handicap, de 0 a 54, y el color indica las marcas. También siguen siendo válidos handicap, jugador, posiciones del uno al seis y marca o marcas. Conserva literalmente nombres, números y colores. Para correcciones puede decir corrijo, corrigiendo o corregir seguido del nombre, handicap y color. Si se dicta Damas o Caballeros, consérvalo literalmente."',
              '"Golf Guatemala. El Pulté ya está configurado y no necesita dictarse. Formato preferido: NOMBRE 38 rojas; NOMBRE 14 blancas. El número inmediatamente después del nombre es el handicap, de 0 a 54, y el color indica las marcas. También siguen siendo válidos handicap, jugador, posiciones del uno al seis y marca o marcas. Conserva literalmente nombres, apellidos, números y colores. Para correcciones puede decir corrijo, corrigiendo o corregir seguido del nombre, handicap y color. Si se dicta Damas o Caballeros, consérvalo literalmente."')

          # Voice speed recalled/approved by user.
          old_policy='''const VOICE_POLICY=Object.freeze({\n  voice:"cedar",\n  speed:0.92,\n  accumulatedSpeed:1.056,'''
          new_policy='''const VOICE_POLICY=Object.freeze({\n  voice:"cedar",\n  speed:1.15,\n  accumulatedSpeed:1.15,'''
          rep(old_policy,new_policy)

          rep('const ALLOWED_SPEECH_REASONS=new Set(["setup_confirmation","closure","error","query","query_accumulated"]);',
              'const ALLOWED_SPEECH_REASONS=new Set(["setup_confirmation","score_confirmation","closure","error","query","query_accumulated"]);')

          old_match='''function matchPlayerAt(tokens,start){\n  for(const p of round.players){const nt=canonicalPlayerNameKey(p.name).split(" ").filter(Boolean);let ok=true;for(let j=0;j<nt.length;j++)if(canonicalPlayerNameKey(tokens[start+j])!==nt[j]){ok=false;break}if(ok)return{player:p,next:start+nt.length,exact:true}}\n  for(const p of round.players){const nt=canonicalPlayerNameKey(p.name).split(" ").filter(Boolean);let ok=true;for(let j=0;j<nt.length;j++)if(!tokenNameMatch(canonicalPlayerNameKey(tokens[start+j]),nt[j])){ok=false;break}if(ok)return{player:p,next:start+nt.length,exact:false}}\n  return null\n}\n'''
          new_match='''function playerVoiceAlias(p){\n  const parts=String(p?.name||"").trim().split(/\\s+/).filter(Boolean);\n  if(parts.length<=1)return parts[0]||"";\n  const firstKey=canonicalPlayerNameKey(parts[0]);\n  const sameFirst=round.players.filter(x=>canonicalPlayerNameKey(String(x?.name||"").trim().split(/\\s+/)[0]||"")===firstKey);\n  if(sameFirst.length<=1)return parts[0];\n  const last=parts[parts.length-1],lastKey=canonicalPlayerNameKey(last);\n  const sameLast=sameFirst.filter(x=>{const xp=String(x?.name||"").trim().split(/\\s+/).filter(Boolean);return canonicalPlayerNameKey(xp[xp.length-1]||"")===lastKey});\n  return sameLast.length===1?last:p.name;\n}\nfunction playerMatchForms(p){\n  const full=canonicalPlayerNameKey(p.name).split(" ").filter(Boolean);\n  const alias=canonicalPlayerNameKey(playerVoiceAlias(p)).split(" ").filter(Boolean);\n  const forms=[full,alias].filter(x=>x.length);\n  const seen=new Set();\n  return forms.filter(x=>{const k=x.join(" ");if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>b.length-a.length);\n}\nfunction matchPlayerAt(tokens,start){\n  for(const p of round.players)for(const nt of playerMatchForms(p)){let ok=true;for(let j=0;j<nt.length;j++)if(canonicalPlayerNameKey(tokens[start+j])!==nt[j]){ok=false;break}if(ok)return{player:p,next:start+nt.length,exact:true}}\n  for(const p of round.players)for(const nt of playerMatchForms(p)){let ok=true;for(let j=0;j<nt.length;j++)if(!tokenNameMatch(canonicalPlayerNameKey(tokens[start+j]),nt[j])){ok=false;break}if(ok)return{player:p,next:start+nt.length,exact:false}}\n  return null\n}\n'''
          rep(old_match,new_match)

          old_apply='function applyLiteralScores(parsed){const result=parsed.entries.length===1?recordScore(parsed.entries[0]):recordScores({entries:parsed.entries});if(result.ok&&result.closure)speakClosure(result.closure);return result}'
          new_apply='''function grossGolfSpeech(score){\n  if(!score||!Number.isInteger(score.gross)||!Number.isInteger(score.par))return"";\n  const d=score.gross-score.par;\n  if(d===-3)return"albatros";\n  if(d===-2)return"eagle";\n  if(d===-1)return"birdie";\n  if(d===0)return"par";\n  if(d===1)return"bogey";\n  if(d===2)return"doble bogey";\n  if(d===3)return"triple bogey";\n  if(score.gross===score.par*2)return"doble par";\n  if(d===4)return"cuádruple bogey";\n  if(d===5)return"quíntuple bogey";\n  return`Gross ${score.gross}`;\n}\nfunction scoreConfirmationSpeech(entries){\n  const lines=[];\n  for(const e of entries||[]){\n    const p=playerByRef(e.player);if(!p)continue;\n    const h=Number(e.hole),score=p.holes?.[h];if(!score||isOmittedScore(score))continue;\n    lines.push(`Hoyo ${h}. ${playerVoiceAlias(p)}. ${grossGolfSpeech(score)}. ${parSpeech(score.diff)}.`);\n  }\n  return lines.join(" ");\n}\nfunction applyLiteralScores(parsed){\n  const result=parsed.entries.length===1?recordScore(parsed.entries[0]):recordScores({entries:parsed.entries});\n  if(result.ok){\n    const confirmation=scoreConfirmationSpeech(parsed.entries);\n    const spoken=[confirmation,result.closure].filter(Boolean).join(" ");\n    if(spoken)speakAuthorized("score_confirmation",spoken);\n  }\n  return result;\n}'''
          rep(old_apply,new_apply)

          # Realtime transcription should expect the exact short-name rule during a round.
          rep('Conserva exactamente los nombres registrados. Jessie se escribe siempre Jessie. No reordenes nombres ni números.',
              'Conserva exactamente los nombres registrados. El jugador puede dictarse por primer nombre cuando ese primer nombre es único en el grupo; si dos jugadores comparten primer nombre, puede dictarse únicamente el apellido para diferenciarlos. Jessie se escribe siempre Jessie. No reordenes nombres ni números.')

          p.write_text(s,encoding='utf-8')

      - name: Audit and behavioral checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index-grupal.html').read_text(encoding='utf-8')
          assert 'V104-SCORE-CONFIRMATION-ALIASES-20260817' in s
          assert 'speed:1.15' in s and 'accumulatedSpeed:1.15' in s
          assert 'score_confirmation' in s
          assert 'function playerVoiceAlias' in s
          assert 'function playerMatchForms' in s
          assert 'function scoreConfirmationSpeech' in s
          assert 'function grossGolfSpeech' in s
          assert '“NOMBRE 38 rojas. NOMBRE 14 blancas…”' in s
          assert '“Pulté. NOMBRE 38 rojas. NOMBRE 14 blancas…”' not in s
          assert s.count('function matchPlayerAt') == 1
          assert s.count('function applyLiteralScores') == 1
          assert s.count('function recordScore') == 1
          assert s.count('function recordScores') == 1
          assert s.count('function startConfirmedRound') == 1
          assert 'round={version:2,configured:true,course:"El Pulté Golf"' in s
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/g.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/g.js
          git diff --check
          test "$(git diff --name-only)" = "index-grupal.html"
          # Individual and API are frozen by this patch.
          git diff --quiet HEAD -- index.html api/session.js api/score.js api/session-grupal.js

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-grupal.html
          git commit -m "V104 confirm golf scores and resolve player aliases"
          git push origin grupal-dev
