name: Stableford V237 today accumulated
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v237-today-accumulated.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
      - name: Add simple accumulated box
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html');s=p.read_text(encoding='utf-8')
          anchor='''  $("scorecard").querySelectorAll(".stableford-manual-cell")'''
          insert='''  let today=document.getElementById("stablefordTodayAccumulated");if(!today){today=document.createElement("div");today.id="stablefordTodayAccumulated";today.style.cssText="margin:10px 0;border:1px solid #4b4f52;background:#000;padding:8px";document.querySelector("#stablefordSeriesSection")?.before(today)}today.innerHTML=`<div style="text-align:center;color:#72ff42;font-weight:800;font-size:20px;margin-bottom:5px">ACUMULADO</div>${round.players.map(p=>{const t=stablefordTotals(p,ALL);return`<div style="display:grid;grid-template-columns:1fr 80px;border-top:1px solid #333;padding:6px 4px"><span>${escapeHtml(p.name)}</span><strong style="text-align:center;color:#72ff42">${t.count?t.points:0}</strong></div>`}).join("")}`;\n  $("scorecard").querySelectorAll(".stableford-manual-cell")'''
          if s.count(anchor)!=1: raise SystemExit('accumulated anchor mismatch')
          p.write_text(s.replace(anchor,insert,1),encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'stablefordTodayAccumulated' index-grupal.html
          grep -Fq '>ACUMULADO</div>' index-grupal.html
          grep -Fq 'const t=stablefordTotals(p,ALL)' index-grupal.html
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html
          git commit -m 'Stableford V237 show simple live accumulated points'
          git push origin stableford-tournament-final