name: Golf Score Card GT · Stableford Tournament PASS
on:
  pull_request:
    branches: [main]
  push:
    branches: [stableford-tournament-final]
jobs:
  stableford-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block Stableford tests when ROADMAPS are incomplete
        env:
          ROADMAP_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          ROADMAP_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/roadmap-gate.mjs "$ROADMAP_BASE_SHA" "$ROADMAP_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stableford core
        run: node test-stableford.mjs
      - name: Stableford integrated UI
        run: node test-stableford-ui.mjs
      - name: Stableford tournament card
        run: node test-stableford-torneo.mjs
      - name: Verify tournament page references core
        run: grep -q '<script src="./stableford.js"></script>' stableford-torneo.html
