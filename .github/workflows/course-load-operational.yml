name: Load Mayan Golf operational data
on:
  push:
    branches: [operational-courses-20260821]
    paths: ['.github/workflows/course-load-operational.yml']
permissions:
  contents: write
jobs:
  load-mayan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: operational-courses-20260821
      - name: Patch only Mayan Golf course data
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index-grupal.html')
          s=p.read_text()
          s=s.replace('mayan_golf:{name:"Mayan Golf",configured:false}', 'mayan_golf:{name:"Mayan Golf",displayName:"MAYAN GOLF CLUB",configured:true}')
          anchor='const COURSE_DATA={'
          block='''const MAYAN_GOLF_PAR=[4,3,4,5,4,5,4,3,4,4,3,5,4,4,5,3,4,4];\nconst MAYAN_GOLF_SI=[7,17,1,3,13,5,15,9,11,2,14,4,8,12,6,18,16,10];\nconst MAYAN_GOLF_TEES={\n  Azul:{label:"AZULES",color:"#0878ff",fill:"#0878ff",text:"#fff",yds:[395,186,486,578,363,552,372,204,400,449,202,555,411,389,542,178,348,389],front:3536,back:3463,rating:74.6,slope:140,total:6999},\n  Blanco:{label:"BLANCAS",color:"#fff",fill:"#f3f3f3",text:"#000",yds:[368,162,463,548,336,528,349,180,371,423,178,525,386,362,514,154,328,368],front:3305,back:3238,rating:72.6,slope:137,total:6543},\n  Amarillo:{label:"DORADAS",color:"#ffbf00",fill:"#ffbf00",text:"#000",yds:[333,137,441,515,307,494,326,155,345,395,153,491,357,334,480,129,291,343],front:3053,back:2993,rating:70.5,slope:133,total:6046},\n  Rojo:{label:"ROJAS",color:"#ff1010",fill:"#f51212",text:"#fff",yds:[297,114,407,478,276,459,292,132,301,355,127,454,319,296,442,106,253,303],front:2756,back:2655,rating:72.4,slope:127,total:5411}\n};\n'''
          if 'const MAYAN_GOLF_PAR=' not in s:
              s=s.replace(anchor,block+anchor)
          needle='country_club:{par:COUNTRY_CLUB_PAR,tees:COUNTRY_CLUB_TEES,siMen:COUNTRY_CLUB_SI_WHITE,siWomen:COUNTRY_CLUB_SI_WOMEN,siByTee:{Negro:COUNTRY_CLUB_SI_BLUE,Azul:COUNTRY_CLUB_SI_BLUE,Blanco:COUNTRY_CLUB_SI_WHITE,Amarillo:COUNTRY_CLUB_SI_WOMEN,Rojo:COUNTRY_CLUB_SI_WOMEN}}'
          repl=needle+',\n  mayan_golf:{par:MAYAN_GOLF_PAR,tees:MAYAN_GOLF_TEES,siMen:MAYAN_GOLF_SI,siWomen:MAYAN_GOLF_SI,siByTee:{}}'
          if 'mayan_golf:{par:MAYAN_GOLF_PAR' not in s:
              s=s.replace(needle,repl)
          p.write_text(s)
          PY
      - name: Verify Mayan matrix
        run: |
          python - <<'PY'
          import re
          s=open('index-grupal.html').read()
          assert 'mayan_golf:{name:"Mayan Golf",displayName:"MAYAN GOLF CLUB",configured:true}' in s
          assert 'mayan_golf:{par:MAYAN_GOLF_PAR,tees:MAYAN_GOLF_TEES' in s
          assert 'const MAYAN_GOLF_PAR=[4,3,4,5,4,5,4,3,4,4,3,5,4,4,5,3,4,4]' in s
          assert 'const MAYAN_GOLF_SI=[7,17,1,3,13,5,15,9,11,2,14,4,8,12,6,18,16,10]' in s
          print('MAYAN_GOLF_STATIC_PASS')
          PY
      - name: Commit Mayan Golf
        run: |
          git config user.name 'gscg-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index-grupal.html
          git diff --cached --quiet && exit 0
          git commit -m 'Operational: load Mayan Golf official card data'
          git push origin HEAD:operational-courses-20260821
