name: Grupal V113 scorecard oxygen
on:
  push:
    branches: [grupal-dev]
    paths: ['.github/workflows/grupal-v113-scorecard-oxygen.yml']
permissions:
  contents: write
jobs:
  patch-audit-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grupal-dev
          fetch-depth: 0
      - name: Patch V113
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html'); s=p.read_text(encoding='utf-8')
          def rep(old,new,count=1):
              global s
              n=s.count(old)
              if n!=count: raise SystemExit(f'Expected {count}, found {n}: {old[:160]!r}')
              s=s.replace(old,new,count)

          rep('<meta name="gscg-build" content="V112-VOCAB-TEE-CORRECTION-20260817">','<meta name="gscg-build" content="V113-SCORECARD-OXYGEN-20260817">')

          # Remove only the Routes block from the scorecard screen. Its content is reserved for CONSULTAS.
          start='  <div class="note-box round-note"><strong>Rutas de la APP</strong>'
          i=s.find(start)
          if i<0: raise SystemExit('Routes block start not found')
          j=s.find('</div>\n  <header class="topbar official-round-header">',i)
          if j<0: raise SystemExit('Routes block end not found')
          s=s[:i]+s[j+7:]

          # Reinvest the recovered vertical space into row height and readability only.
          # No horizontal widths, column proportions, top boxes, logo, course info or functions are changed.
          rep('.scorecard th,.scorecard td{height:26px;padding:1px 1px;font-size:9px;line-height:1.05;', '.scorecard th,.scorecard td{height:30px;padding:1px 1px;font-size:10.4px;line-height:1.08;')
          rep('.scorecard .concept{padding-left:3px;font-size:8px;white-space:nowrap}', '.scorecard .concept{padding-left:3px;font-size:9.1px;white-space:nowrap}')
          rep('.scorecard .general td{height:18px}', '.scorecard .general td{height:22px}')
          rep('.scorecard .player-name{font-size:10px;line-height:1.08;padding:0 2px;', '.scorecard .player-name{font-size:11.7px;line-height:1.08;padding:0 2px;')
          rep('.scorecard .player-hcp{margin-top:8px;font-size:11px}', '.scorecard .player-hcp{margin-top:9px;font-size:13px}')
          rep('.scorecard .player-block td{height:28px}', '.scorecard .player-block td{height:32px}')
          rep('.scorecard .stroke2::after,.scorecard .stroke3::after{right:1px;top:1px;font-size:4.8px}', '.scorecard .stroke2::after,.scorecard .stroke3::after{right:1px;top:1px;font-size:5.4px}')
          rep('.summary-title{font-size:9px;padding:4px 0 3px}', '.summary-title{font-size:10px;padding:5px 0 4px}')
          rep('.summary th,.summary td{height:21px;font-size:6.1px;padding:1px}', '.summary th,.summary td{height:25px;font-size:7px;padding:1px}')
          rep('.summary th{font-size:5.5px;line-height:1.05}', '.summary th{font-size:6.3px;line-height:1.08}')

          p.write_text(s,encoding='utf-8')
      - name: Audit V113
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'V113-SCORECARD-OXYGEN-20260817' index-grupal.html
          ! grep -q '<strong>Rutas de la APP</strong>' index-grupal.html
          grep -q 'scorecard th,.scorecard td{height:30px' index-grupal.html
          grep -q 'player-block td{height:32px' index-grupal.html
          grep -q 'summary th,.summary td{height:25px' index-grupal.html
          grep -q 'official-round-header .logo{grid-column:1;grid-row:1;width:104px;height:104px}' index-grupal.html
          grep -q 'official-course-info{padding:7px 7px 8px' index-grupal.html
          grep -q 'scorecard{width:980px;min-width:980px' index-grupal.html
          grep -q 'player-col{width:13%}' index-grupal.html
          grep -q 'concept-col{width:6.5%}' index-grupal.html
          grep -q 'sum-col{width:4.7%}' index-grupal.html
          grep -q 'setTimeout(()=>{roundFinalizeTimer=null;if(listening)requestRoundFinalize(0)},4000)' index-grupal.html
          grep -q 'markUnreportedPlayersOnHole' index-grupal.html
          grep -q 'ACCUMULATED_QUERY_MATRIX' index-grupal.html
          grep -q 'data-draft-tee' index-grupal.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index-grupal.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/g.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/g.js
          git diff --check
          test "$(git diff --name-only)" = "index-grupal.html"
          git diff --quiet HEAD -- index.html api/session.js api/score.js api/session-grupal.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-grupal.html
          git commit -m "V113 remove routes block and reinvest vertical space in scorecard"
          git push origin grupal-dev
