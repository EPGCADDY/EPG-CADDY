name: V334-M1 Layout Finalize

on:
  push:
    branches:
      - v334-quality-repair

permissions:
  contents: write

jobs:
  seal-audit-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: |
          npm install --omit=dev --no-package-lock
          python3 -m pip install --disable-pip-version-check --no-cache-dir numpy pillow pypdf reportlab
      - name: Seal the stable layout candidate
        run: |
          rm .github/workflows/v334-m1-layout-finalize.yml
          git add -u .github/workflows/v334-m1-layout-finalize.yml
          sed -i 's/V334-M1-R6-REMOTE-PENDING/V334-M1-R6-REMOTE-FINALIZED/' ROADMAP_OVERALL.md ROADMAP_A_DETALLE.md
          python3 scripts/rebuild-inventory-pdfs.py
      - name: Commit the exact deployable candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONTROL_PROYECTO_SCIRE/INVENTARIOS_V311.lock.json ROADMAP_OVERALL.md ROADMAP_A_DETALLE.md
          git commit -m "V334-M1-R6 finalize stable Manual layout"
      - name: Audit the final SHA
        run: node audit-project.mjs
      - name: Publish only the Preview branch
        run: git push origin HEAD:v334-quality-repair
