name: V334-M1 Finalize Preview

on:
  push:
    branches:
      - v334-quality-repair

permissions:
  contents: write

jobs:
  rebuild-audit-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          npm install --omit=dev --no-package-lock
          python3 -m pip install --disable-pip-version-check --no-cache-dir numpy pillow pypdf reportlab

      - name: Rebuild the canonical Manual
        run: |
          python3 scripts/rebuild-manual-bets-live-data.py
          python3 scripts/rebuild-manual-pdf-from-pages.py
          rm .github/workflows/v334-m1-finalize-preview.yml
          git add -u .github/workflows/v334-m1-finalize-preview.yml
          sed -i 's/V334-M1-REMOTE-PENDING/V334-M1-REMOTE-FINALIZED/' ROADMAP_OVERALL.md ROADMAP_A_DETALLE.md
          python3 scripts/rebuild-inventory-pdfs.py

      - name: Commit the exact deployable candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/manual/v311 CONTROL_PROYECTO_SCIRE/INVENTARIOS_V311.lock.json ROADMAP_OVERALL.md ROADMAP_A_DETALLE.md .github/workflows/v334-m1-finalize-preview.yml
          git commit -m "V334-M1 finalize rendered Manual and inventories"

      - name: Audit the final SHA
        run: node audit-project.mjs

      - name: Publish only the Preview branch
        run: git push origin HEAD:v334-quality-repair
