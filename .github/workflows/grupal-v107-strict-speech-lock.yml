name: Grupal V107 strict speech lock

on:
  push:
    branches: [grupal-dev]
    paths:
      - '.github/workflows/grupal-v107-strict-speech-lock.yml'

permissions:
  contents: write

jobs:
  patch-audit-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grupal-dev
          fetch-depth: 0
      - name: Patch strict speech policy
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html'); s=p.read_text(encoding='utf-8')
          def rep(old,new,count=1):
              global s
              n=s.count(old)
              if n!=count: raise SystemExit(f'Expected {count}, found {n}: {old[:140]!r}')
              s=s.replace(old,new,count)
          rep('<meta name="gscg-build" content="V105-ROUND-RULES-20260817">','<meta name="gscg-build" content="V107-STRICT-SPEECH-LOCK-20260817">')
          rep('const ALLOWED_SPEECH_REASONS=new Set(["setup_confirmation","score_confirmation","closure","error","query","query_accumulated"]);','const ALLOWED_SPEECH_REASONS=new Set(["setup_confirmation","score_confirmation","closure","query","query_accumulated"]);')
          old='''function speakGlobalError(context=voiceContext){\n  if(listening)setVoice(false);\n  phase="error";\n  if(context==="setup"){$("setupStatus").classList.remove("listening");$("setupStatus").textContent="ERROR"}else $("status").textContent="ERROR";\n  if(!speakAuthorized("error","Error")){phase="idle";if(context==="round")$("status").textContent=roundIdleStatus()}\n}\n'''
          new='''function speakGlobalError(context=voiceContext){\n  if(listening)setVoice(false);\n  phase="idle";\n  if(audioEl){audioEl.muted=true;audioEl.volume=0;}\n  if(activeResponseId)cancelResponseSafe(activeResponseId);\n  clearOutputAudioSafe();\n  activeResponseId=null;speechPlaybackResponseId=null;stopMonitorActive=false;clearSpeechAuthorization();\n  if(context==="setup"){$("setupStatus").classList.remove("listening");$("setupStatus").textContent="ERROR"}else $("status").textContent=roundIdleStatus();\n}\n'''
          rep(old,new)
          old_inst='''instructions:["GROUP_ROUND_LOCK_V88.","REGLA ABSOLUTA: no produzcas ninguna respuesta espontánea.","Durante captura de scores solo transcribe audio. No repitas scores, nombres ni números. No preguntes nada. No uses herramientas.","Los scores y correcciones se procesan exclusivamente en el cliente.","Solo una response.create explícita y autorizada por el cliente puede producir voz.","Toda voz autorizada usa obligatoriamente el mismo locutor masculino adulto, serio, sobrio y profesional, español internacional neutro, sin Spanglish. Pronuncia Gross como gros."].join(" "),'''
          new_inst='''instructions:["GROUP_ROUND_LOCK_V107.","REGLA ABSOLUTA: nunca respondas espontáneamente al usuario.","No hagas preguntas, no ofrezcas ayuda, no pidas aclaraciones, no digas frases conversacionales y no hables ante errores o instrucciones desconocidas.","Durante captura de scores solo transcribe audio.","Los scores y correcciones se procesan exclusivamente en el cliente.","Solo una response.create explícita con token autorizado por el cliente puede producir voz.","Toda voz autorizada se limita al contenido literal enviado por el cliente: confirmación de score, consulta solicitada, acumulado o cierre de vuelta/ronda.","Nunca generes expresiones como por favor, indique, dime, información, problema, ayudar, ayuda, necesitas, necesitas ayuda, entendido, cómo puedo ayudarte o equivalentes.","No uses herramientas.","Toda voz autorizada usa obligatoriamente el mismo locutor masculino adulto, serio, sobrio y profesional, español internacional neutro, sin Spanglish. Pronuncia Gross como gros."].join(" "),'''
          rep(old_inst,new_inst)
          p.write_text(s,encoding='utf-8')

          q=Path('api/session-grupal.js'); a=q.read_text(encoding='utf-8')
          a=a.replace('''      instructions: [\n        "Aplicación grupal de score de golf.",\n        "No produzcas respuestas espontáneas.",\n        "No respondas automáticamente al audio del usuario.",\n        "No uses herramientas.",\n        "Solo procesa audio para transcripción; cualquier respuesta de voz será creada explícitamente por el cliente."\n      ].join(" "),''','''      instructions: [\n        "Aplicación grupal de score de golf.",\n        "REGLA ABSOLUTA: nunca produzcas respuestas espontáneas.",\n        "No respondas automáticamente al audio del usuario.",\n        "No hagas preguntas, no ofrezcas ayuda, no pidas aclaraciones y no hables ante errores o instrucciones desconocidas.",\n        "No digas frases como por favor, indique, dime, información, problema, ayudar, ayuda, necesitas, entendido, cómo puedo ayudarte ni equivalentes.",\n        "No uses herramientas.",\n        "Solo procesa audio para transcripción; cualquier respuesta de voz será creada explícitamente por el cliente."\n      ].join(" "),''')
          q.write_text(a,encoding='utf-8')
      - name: Audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index-grupal.html').read_text(encoding='utf-8')
          a=Path('api/session-grupal.js').read_text(encoding='utf-8')
          assert 'V107-STRICT-SPEECH-LOCK-20260817' in s
          assert '"error"' not in s[s.index('const ALLOWED_SPEECH_REASONS'):s.index('const VOICE_POLICY')]
          assert 'speakAuthorized("error"' not in s
          assert 'GROUP_ROUND_LOCK_V107' in s
          assert 'Nunca generes expresiones como por favor' in s
          assert 'No digas frases como por favor' in a
          assert 'create_response:false' in s and 'interrupt_response:false' in s
          assert 'create_response: false' in a and 'interrupt_response: false' in a
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/g.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/g.js
          node --check api/session-grupal.js
          git diff --check
          names=$(git diff --name-only)
          test "$names" = $'api/session-grupal.js\nindex-grupal.html' || test "$names" = $'index-grupal.html\napi/session-grupal.js'
          git diff --quiet HEAD -- index.html api/session.js api/score.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-grupal.html api/session-grupal.js
          git commit -m "V107 hard lock Realtime speech to authorized output"
          git push origin grupal-dev
