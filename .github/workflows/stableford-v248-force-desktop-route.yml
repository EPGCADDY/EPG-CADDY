name: Stableford V248 force desktop route
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v248-force-desktop-route.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
      - name: Force emergency desktop route without touching score logic
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html');s=p.read_text(encoding='utf-8')
          anchor='''window.addEventListener("load",()=>{'''
          if anchor not in s: raise SystemExit('load anchor missing')
          guard='''window.addEventListener("load",()=>{try{const q=new URLSearchParams(location.search);if(q.get("stableford_emergency")==="countryclub"){const active=JSON.parse(localStorage.getItem(STABLEFORD_ACTIVE_KEY)||"null");if(active?.mode==="stableford"&&active?.players?.length){round=active;round.courseKey="country_club";round.mode="stableford";setCourse("country_club");showRound();render();return}}}catch{}'''
          s=s.replace(anchor,guard,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate minimal scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'q.get("stableford_emergency")==="countryclub"' index-grupal.html
          grep -Fq 'round.courseKey="country_club"' index-grupal.html
          grep -Fq 'round.mode="stableford"' index-grupal.html
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html
          git commit -m 'Stableford V248 force saved desktop access to active Country Club round'
          git push origin stableford-tournament-final