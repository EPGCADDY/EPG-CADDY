name: Grupal V114B scorecard legibility
on:
  push:
    branches: [grupal-dev]
    paths: ['.github/workflows/grupal-v114b-scorecard-legibility.yml']
permissions:
  contents: write
jobs:
  patch-audit-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grupal-dev
          fetch-depth: 0
      - name: Patch V114B
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html')
          s=p.read_text(encoding='utf-8')
          def rep(old,new):
              global s
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'Expected 1 found {n}: {old[:120]}')
              s=s.replace(old,new,1)
          rep('<meta name="gscg-build" content="V113-SCORECARD-OXYGEN-20260817">','<meta name="gscg-build" content="V114-SCORECARD-LEGIBILITY-20260817">')
          rep('.scorecard th,.scorecard td{height:30px;padding:1px 1px;font-size:10.4px;line-height:1.08;','.scorecard th,.scorecard td{height:40px;padding:1px 1px;font-size:15.6px;line-height:1.06;')
          rep('.scorecard .concept{padding-left:3px;font-size:9.1px;white-space:nowrap}', '.scorecard .concept{padding-left:3px;font-size:13.65px;white-space:nowrap}')
          rep('.scorecard .general td{height:22px}', '.scorecard .general td{height:30px}')
          rep('.scorecard .player-name{font-size:11.7px;line-height:1.08;padding:0 2px;', '.scorecard .player-name{font-size:17.55px;line-height:1.04;padding:0 2px;')
          rep('.scorecard .player-hcp{margin-top:9px;font-size:13px}', '.scorecard .player-hcp{margin-top:10px;font-size:19.5px}')
          rep('.scorecard .player-block td{height:32px}', '.scorecard .player-block td{height:42px}')
          rep('.scorecard .stroke2::after,.scorecard .stroke3::after{right:1px;top:1px;font-size:5.4px}', '.scorecard .stroke2::after,.scorecard .stroke3::after{right:1px;top:1px;font-size:8.1px}')
          rep('.summary-title{font-size:10px;padding:5px 0 4px}', '.summary-title{font-size:20px;padding:8px 0 7px}')
          rep('.summary th,.summary td{height:25px;font-size:7px;padding:1px}', '.summary th,.summary td{height:44px;font-size:14px;padding:2px}')
          rep('.summary th{font-size:6.3px;line-height:1.08}', '.summary th{font-size:12.6px;line-height:1.05}')
          start=s.index('<main class="app">')
          header_start=s.index('  <header class="topbar official-round-header">',start)
          header_end=s.index('  </header>',header_start)+len('  </header>\n')
          header=s[header_start:header_end]
          prefix=s[start:header_start]
          expected='<main class="app">\n  <section class="course-info official-course-info"><h2>INFORMACIÓN DEL CAMPO</h2><div class="course-info-grid" id="courseInfo"></div></section>\n  <div class="status" id="status"></div>\n'
          if prefix != expected:
              raise SystemExit('Unexpected scorecard header prefix')
          s=s[:start]+'<main class="app">\n'+header+'  <section class="course-info official-course-info"><h2>INFORMACIÓN DEL CAMPO</h2><div class="course-info-grid" id="courseInfo"></div></section>\n  <div class="status" id="status"></div>\n'+s[header_end:]
          p.write_text(s,encoding='utf-8')
      - name: Audit V114B
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'V114-SCORECARD-LEGIBILITY-20260817' index-grupal.html
          grep -q 'font-size:15.6px' index-grupal.html
          grep -q 'font-size:17.55px' index-grupal.html
          grep -q 'font-size:19.5px' index-grupal.html
          grep -q 'summary-title{font-size:20px' index-grupal.html
          grep -q 'summary th,.summary td{height:44px;font-size:14px' index-grupal.html
          grep -q 'summary th{font-size:12.6px' index-grupal.html
          grep -q 'scorecard{width:980px;min-width:980px;table-layout:fixed}' index-grupal.html
          grep -q 'player-col{width:13%}' index-grupal.html
          grep -q 'concept-col{width:6.5%}' index-grupal.html
          grep -q 'sum-col{width:4.7%}' index-grupal.html
          grep -q 'official-round-header .logo{grid-column:1;grid-row:1;width:104px;height:104px}' index-grupal.html
          grep -q 'official-round-header .mic-wrap{grid-column:2;grid-row:1;width:47px;height:47px}' index-grupal.html
          grep -q 'markUnreportedPlayersOnHole' index-grupal.html
          grep -q 'setTimeout(()=>{roundFinalizeTimer=null;if(listening)requestRoundFinalize(0)},4000)' index-grupal.html
          grep -q 'ACCUMULATED_QUERY_MATRIX' index-grupal.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index-grupal.html').read_text(encoding='utf-8')
          assert s.index('<header class="topbar official-round-header">') < s.index('<section class="course-info official-course-info">')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/g.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/g.js
          git diff --check
          test "$(git diff --name-only)" = "index-grupal.html"
          git diff --quiet HEAD -- index.html api/session.js api/score.js api/session-grupal.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-grupal.html
          git commit -m "V114 enlarge scorecard typography and lift header"
          git push origin grupal-dev
