name: Grupal V111 direct mic capture
on:
  push:
    branches: [grupal-dev]
    paths: ['.github/workflows/grupal-v111-direct-mic-capture.yml']
permissions:
  contents: write
jobs:
  patch-audit-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grupal-dev
          fetch-depth: 0
      - name: Patch direct capture activation
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html'); s=p.read_text(encoding='utf-8')
          def rep(old,new,count=1):
              global s
              n=s.count(old)
              if n!=count: raise SystemExit(f'Expected {count}, found {n}: {old[:180]!r}')
              s=s.replace(old,new,count)
          rep('<meta name="gscg-build" content="V110-MIC-TAP-RECOVERY-20260817">','<meta name="gscg-build" content="V111-DIRECT-MIC-CAPTURE-20260817">')
          old='''function bindMicActivation(id,context){
  const el=$(id);let pointerAt=0,touchAt=0;
  const fire=e=>{
    e.preventDefault();
    const now=Date.now();
    if(e.type==="click"&&(now-pointerAt<700||now-touchAt<700))return;
    if(e.type==="pointerup")pointerAt=now;
    if(e.type==="touchend")touchAt=now;
    setMicConnecting(context,true);
    toggleVoice(context);
  };
  if(window.PointerEvent)el.addEventListener("pointerup",fire,{passive:false});
  el.addEventListener("touchend",fire,{passive:false});
  el.addEventListener("click",fire,{passive:false});
}
bindMicActivation("headerMic","round");bindMicActivation("setupMic","setup");
'''
          new='''let lastMicGestureAt=0;
function fireMicActivation(context,e){
  if(e?.cancelable)e.preventDefault();
  e?.stopPropagation?.();
  const now=Date.now();
  if(now-lastMicGestureAt<350)return false;
  lastMicGestureAt=now;
  setMicConnecting(context,true);
  toggleVoice(context);
  return true;
}
function bindMicActivation(id,context){
  const el=$(id);if(!el)return;
  if(window.PointerEvent)el.addEventListener("pointerdown",e=>fireMicActivation(context,e),{passive:false,capture:true});
  else el.addEventListener("touchstart",e=>fireMicActivation(context,e),{passive:false,capture:true});
  el.addEventListener("click",e=>fireMicActivation(context,e),{passive:false,capture:true});
}
bindMicActivation("headerMic","round");bindMicActivation("setupMic","setup");
// Fallback de captura en el contenedor: iOS Home Screen no puede perder el gesto aunque
// el botón transparente deje de ser el target por reflow/scroll/zoom.
$("headerMicWrap")?.addEventListener(window.PointerEvent?"pointerdown":"touchstart",e=>fireMicActivation("round",e),{passive:false,capture:true});
$("setupMicWrap")?.addEventListener(window.PointerEvent?"pointerdown":"touchstart",e=>fireMicActivation("setup",e),{passive:false,capture:true});
'''
          rep(old,new)
          p.write_text(s,encoding='utf-8')
      - name: Audit V111
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'V111-DIRECT-MIC-CAPTURE-20260817' index-grupal.html
          grep -q 'function fireMicActivation(context,e)' index-grupal.html
          grep -q 'pointerdown' index-grupal.html
          grep -q 'headerMicWrap' index-grupal.html
          grep -q 'setMicConnecting(context,true)' index-grupal.html
          grep -q 'setTimeout(()=>{roundFinalizeTimer=null;if(listening)requestRoundFinalize(0)},4000)' index-grupal.html
          grep -q 'markUnreportedPlayersOnHole' index-grupal.html
          grep -q 'score_confirmation' index-grupal.html
          grep -q 'Primera vuelta.' index-grupal.html
          grep -q 'Segunda vuelta.' index-grupal.html
          grep -q 'Ronda completa.' index-grupal.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index-grupal.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/g.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/g.js
          git diff --check
          test "$(git diff --name-only)" = "index-grupal.html"
          git diff --quiet HEAD -- index.html api/session.js api/score.js api/session-grupal.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-grupal.html
          git commit -m "V111 capture iPhone mic gesture at pointerdown"
          git push origin grupal-dev
