name: Stableford V212 correct storage reset
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v212-correct-storage-reset.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
          fetch-depth: 0
      - name: Correct exact persisted round keys
        shell: python
        run: |
          from pathlib import Path
          p=Path('stableford.js'); s=p.read_text(encoding='utf-8')
          old='''        localStorage.removeItem("gscg_round_v1");\n        localStorage.removeItem("gscg_round");'''
          new='''        localStorage.removeItem("golf-score-card-guatemala-group-round-v2");\n        localStorage.removeItem("golf-score-card-guatemala-group-round-v2-backup");\n        localStorage.removeItem("golf-score-card-guatemala-group-draft-v1");'''
          if s.count(old)!=1: raise SystemExit(f'emergency reset anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "stableford.js"
          grep -Fq 'golf-score-card-guatemala-group-round-v2-backup' stableford.js
          git diff --quiet HEAD -- index-grupal.html api/session-grupal.js stableford-torneo.html
          node --check stableford.js
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stableford.js
          git commit -m 'Stableford V212 clear exact stale round storage keys'
          git push origin stableford-tournament-final