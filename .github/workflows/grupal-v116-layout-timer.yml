name: Grupal V116 layout timer
on:
  push:
    branches: [grupal-dev]
    paths:
      - .github/workflows/grupal-v116-layout-timer.yml
permissions:
  contents: write
jobs:
  patch-audit-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grupal-dev
          fetch-depth: 0
      - name: Patch V116
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html'); s=p.read_text(encoding='utf-8')
          def rep(old,new,count=1):
              global s
              n=s.count(old)
              if n!=count: raise SystemExit(f'Expected {count}, found {n}: {old[:140]!r}')
              s=s.replace(old,new,count)
          rep('<meta name="gscg-build" content="V115-FIELD-MIC-LAYOUT-20260817">','<meta name="gscg-build" content="V116-CARD-LAYOUT-TIMER-20260817">')
          rep('<h2>MARCAS - YARDAS</h2>','<h2>YARDAS</h2>')
          old='function renderCourseInfo(){const rows=["Negro","Azul","Blanco","Rojo","Amarillo"].map(k=>[k,TEES[k]]);$("courseInfo").innerHTML=`<div class="head">MARCA</div><div class="head">YARDAS</div><div class="head">COURSE RATING</div><div class="head">SLOPE RATING</div>${rows.map(([k,t])=>`<div><span class="tee-dot" style="background:${t.color};border:${k===\'Negro\'?\'1px solid #777\':\'0\'}"></span>${t.label}</div><div style="text-align:center"><span style="color:${k===\'Negro\'?\'#000\':t.color};font-weight:800;${k===\'Negro\'?\'background:#fff;padding:1px 5px;border-radius:2px;display:inline-block;\':\'\'}">${t.total.toLocaleString(\'en-US\')}</span></div><div style="text-align:center">${t.rating.toFixed(1)}</div><div style="text-align:center">${t.slope}</div>`).join("")}`}'
          new='function renderCourseInfo(){const rows=["Negro","Azul","Blanco","Rojo","Amarillo"].map(k=>[k,TEES[k]]);$("courseInfo").innerHTML=`<div class="head">YARDAS</div><div class="head">COURSE RATING</div><div class="head">SLOPE RATING</div>${rows.map(([k,t])=>`<div style="text-align:left"><span class="tee-dot" style="background:${t.color};border:${k===\'Negro\'?\'1px solid #777\':\'0\'}"></span><span style="color:${k===\'Negro\'?\'#000\':t.color};font-weight:800;${k===\'Negro\'?\'background:#fff;padding:1px 5px;border-radius:2px;display:inline-block;\':\'\'}">${t.total.toLocaleString(\'en-US\')}</span></div><div style="text-align:center">${t.rating.toFixed(1)}</div><div style="text-align:center">${t.slope}</div>`).join("")}`}'
          rep(old,new)
          rep('function roundIdleStatus(){return `Ronda activa · ${round.players.length} jugador${round.players.length===1?"":"es"}`}', 'function roundElapsedText(){const start=new Date(round.createdAt).getTime(),sec=Math.max(0,Math.floor((Date.now()-start)/1000)),hh=String(Math.floor(sec/3600)).padStart(2,"0"),mm=String(Math.floor((sec%3600)/60)).padStart(2,"0"),ss=String(sec%60).padStart(2,"0");return `${hh}:${mm}:${ss}`}\nfunction roundStartText(){return new Intl.DateTimeFormat("es-GT",{hour:"2-digit",minute:"2-digit"}).format(new Date(round.createdAt))}\nfunction roundIdleStatus(){return `Ronda activa · Inicio ${roundStartText()} · ${roundElapsedText()}`}',1)
          rep('$("status").textContent=round.configured?`Ronda activa · ${round.players.length} jugador${round.players.length===1?"":"es"}`:"";', '$("status").textContent=round.configured?roundIdleStatus():"";',1)
          rep('</style>','\n/* V116: compact field data + larger mic + homogeneous totals */\n.course-info-grid{grid-template-columns:.72fr .72fr .72fr;column-gap:6px;justify-content:start}\n.course-info-layout{grid-template-columns:minmax(0,1fr) 165px;gap:8px}\n.course-mic{width:153px;height:153px}.course-mic .mic-hit{inset:-50%}\n.summary td{font-size:12px}\n@media(max-width:800px){.official-course-info .course-info-layout{grid-template-columns:minmax(0,1fr) 95px;gap:2px}.course-info-grid{grid-template-columns:.72fr .72fr .72fr;gap:3px 2px;justify-content:start}.official-course-info .course-mic{width:85px;height:85px}.official-course-info .course-mic .mic-visual{font-size:50px;border-width:2px}.official-course-info .course-mic .mic-hit{inset:-50%}.summary td{font-size:15.6px}}\n</style>',1)
          rep('$("finalCardButton").classList.remove("hidden");$("finalCardButton").textContent=isRoundComplete()?"TARJETA DIGITAL FINAL":"TARJETA DIGITAL"}', '$("finalCardButton").classList.remove("hidden");$("finalCardButton").textContent=isRoundComplete()?"TARJETA DIGITAL FINAL":"TARJETA DIGITAL"}',1)
          marker='$("closeFinalCard")?.addEventListener'
          if marker not in s: raise SystemExit('Event marker not found')
          insert='setInterval(()=>{if(round.configured&&$("status"))$("status").textContent=roundIdleStatus()},1000);\n'
          idx=s.index(marker)
          s=s[:idx]+insert+s[idx:]
          p.write_text(s,encoding='utf-8')
      - name: Audit V116
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'V116-CARD-LAYOUT-TIMER-20260817' index-grupal.html
          grep -q '<h2>YARDAS</h2>' index-grupal.html
          ! grep -q '<div class="head">MARCA</div>' index-grupal.html
          grep -q 'grid-template-columns:.72fr .72fr .72fr' index-grupal.html
          grep -q 'course-mic{width:85px;height:85px}' index-grupal.html
          grep -q 'course-mic .mic-hit{inset:-50%}' index-grupal.html
          grep -q '.summary td{font-size:15.6px}' index-grupal.html
          grep -q 'function roundElapsedText' index-grupal.html
          grep -q 'Ronda activa · Inicio' index-grupal.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index-grupal.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/g.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/g.js
          git diff --check
          test "$(git diff --name-only)" = "index-grupal.html"
          git diff --quiet HEAD -- index.html api/session.js api/score.js api/session-grupal.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-grupal.html
          git commit -m "V116 compact field data enlarge mic and add round timer"
          git push origin grupal-dev
