name: Apply R24C LAB
on:
  push:
    branches: [lab/v407-r24-whatsapp-registration]
    paths: [.github/workflows/apply-r24c-lab.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/v407-r24-whatsapp-registration
          fetch-depth: 0
      - name: Apply verified R24C patch
        env:
          PATCH_B64: fatal: Invalid revision range b1a3ed8989e1893b68ca4313f251d292729cad94..0bcd975af9953adbc994d436b56f5776f1a4f755
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/r24c.patch
          git apply --index /tmp/r24c.patch
          rm .github/workflows/apply-r24c-lab.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: isolate update control from history overlay"
          git push origin HEAD:lab/v407-r24-whatsapp-registration
