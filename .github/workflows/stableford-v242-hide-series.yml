name: Stableford V242 hide series
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v242-hide-series.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
      - name: Hide only accumulated series block in live Stableford
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html');s=p.read_text(encoding='utf-8')
          anchor='''  $("status").textContent=`STABLEFORD · ${cfg.label} · SCRATCH · MARCAS ${stablefordTeeLabel(cfg)} · FECHA ${round.stablefordRoundNumber} DE 4`;'''
          new='''  $("stablefordSeriesSection")?.classList.add("hidden");\n  $("status").textContent=`STABLEFORD · ${cfg.label} · SCRATCH · MARCAS ${stablefordTeeLabel(cfg)} · FECHA ${round.stablefordRoundNumber} DE 4`;'''
          if s.count(anchor)!=1: raise SystemExit('status anchor mismatch')
          p.write_text(s.replace(anchor,new,1),encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq '$("stablefordSeriesSection")?.classList.add("hidden")' index-grupal.html
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html
          git commit -m 'Stableford V242 hide four-date classification from live card'
          git push origin stableford-tournament-final