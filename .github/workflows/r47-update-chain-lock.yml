name: R48 Update Chain Lock
on:
  push:
    branches:
      - lab/update-origin-canonical-r48
permissions:
  contents: write
jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/update-origin-canonical-r48
          fetch-depth: 5
      - name: Generate runtime payload lock
        run: node scripts/update-chain-lock.mjs
      - name: Verify runtime payload lock
        run: node scripts/update-chain-gate.mjs
      - name: Register R48 in both roadmaps and commit atomically
        shell: bash
        run: |
          set -euo pipefail
          marker='V407-R48 LAB · cierre atómico origen canónico ACTUALIZAR'
          block=$(cat <<'EOF'
          
          ## V407-R48 LAB · cierre atómico origen canónico ACTUALIZAR · 11 de septiembre de 2026
          
          - Cierre obligatorio del cambio autorizado del motor ACTUALIZAR para usar siempre el origen canónico `https://golf-sc-gt-lab.vercel.app` en release y shell.
          - `update-client-e.js` autorizado en R48 con hash `6fd5c7f3db13ccf05c86ec7cd74fad2451accbbe`.
          - Release R48: `V407-R48-CANONICAL-UPDATER-ORIGIN-20260911`.
          - Ambos ROADMAPS y `Intocables/UPDATE_CHAIN_PAYLOAD.lock.json` quedan sellados en el mismo commit atómico antes de Preview/Promote.
          - MAIN y MAESTRO permanecen intactos. La aceptación final sigue siendo física desde la app LAB instalada, sin reinstalar y conservando la ronda.
          EOF
          )
          if ! grep -Fq "$marker" ROADMAP_OVERALL.md; then printf '%s\n' "$block" >> ROADMAP_OVERALL.md; fi
          if ! grep -Fq "$marker" ROADMAP_A_DETALLE.md; then printf '%s\n' "$block" >> ROADMAP_A_DETALLE.md; fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Intocables/UPDATE_CHAIN_PAYLOAD.lock.json ROADMAP_OVERALL.md ROADMAP_A_DETALLE.md
          git diff --cached --quiet && exit 0
          git commit -m "R48 LAB: atomically close canonical updater origin and both roadmaps"
          git push origin HEAD:lab/update-origin-canonical-r48
