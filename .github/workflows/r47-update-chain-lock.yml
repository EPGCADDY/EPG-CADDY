name: R47 Update Chain Lock
on:
  push:
    branches:
      - lab/update-chain-hardening-r47
permissions:
  contents: write
jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/update-chain-hardening-r47
          fetch-depth: 2
      - name: Generate runtime payload lock
        run: node scripts/update-chain-lock.mjs
      - name: Verify runtime payload lock
        run: node scripts/update-chain-gate.mjs
      - name: Commit lock only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Intocables/UPDATE_CHAIN_PAYLOAD.lock.json
          git diff --cached --quiet && exit 0
          git commit -m "R47 LAB: seal automatic update payload fingerprint"
          git push origin HEAD:lab/update-chain-hardening-r47
