name: Stableford V224 manual Gross
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v224-manual-gross.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
          fetch-depth: 0
      - name: Make Stableford Gross cells editable and calculate points
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html'); s=p.read_text(encoding='utf-8')
          old='''  const cell=(key,h)=>`<td class="${key==="points"?"stableford-points":"gross-cell"}">${player?stablefordCell(player,h,key):""}</td>`;'''
          new='''  const cell=(key,h)=>{if(key==="points")return`<td class="stableford-points">${player?stablefordCell(player,h,key):""}</td>`;if(!player)return'<td class="gross-cell"></td>';const value=GSCStableford.holeResult(player?.holes?.[h],PAR[h-1]);const shown=value.recorded?(value.status==="x"?"X":String(value.gross??"")):"";return`<td class="gross-cell stableford-manual-cell"><input class="stableford-gross-input" inputmode="numeric" pattern="[0-9]*" maxlength="2" aria-label="${escapeHtml(player.name)} hoyo ${h} Gross" data-sf-player="${escapeHtml(player.id)}" data-sf-hole="${h}" value="${shown}"></td>`};'''
          if s.count(old)!=1: raise SystemExit('cell anchor mismatch')
          s=s.replace(old,new,1)
          old2='''  $("status").textContent=`STABLEFORD · ${cfg.label} · SCRATCH · MARCAS ${stablefordTeeLabel(cfg)} · FECHA ${round.stablefordRoundNumber} DE 4`;$("finalCardButton").classList.remove("hidden");$("finalCardButton").textContent=isRoundComplete()?"TARJETA DIGITAL FINAL":"TARJETA DIGITAL";renderRoundClockButton();renderStablefordSeries();'''
          new2='''  $("scorecard").querySelectorAll(".stableford-gross-input").forEach(input=>{input.addEventListener("click",e=>e.stopPropagation());input.addEventListener("touchstart",e=>e.stopPropagation(),{passive:true});input.addEventListener("change",()=>{const p=round.players.find(x=>x.id===input.dataset.sfPlayer),hole=Number(input.dataset.sfHole),raw=input.value.trim().toUpperCase();if(!p||!hole)return;if(raw===""){delete p.holes[hole];persist();render();return}const result=saveEntry({player:p.name,hole,status:raw==="X"?"x":null,gross:raw==="X"?null:Number(raw)});if(result.ok){persist();render()}else{input.value=stablefordCell(p,hole,"gross")}})});\n  $("status").textContent=`STABLEFORD · ${cfg.label} · SCRATCH · MARCAS ${stablefordTeeLabel(cfg)} · FECHA ${round.stablefordRoundNumber} DE 4`;$("finalCardButton").classList.remove("hidden");$("finalCardButton").textContent=isRoundComplete()?"TARJETA DIGITAL FINAL":"TARJETA DIGITAL";renderRoundClockButton();renderStablefordSeries();'''
          if s.count(old2)!=1: raise SystemExit('render anchor mismatch')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "index-grupal.html"
          grep -Fq 'stableford-gross-input' index-grupal.html
          grep -Fq 'saveEntry({player:p.name,hole' index-grupal.html
          grep -Fq 'persist();render()' index-grupal.html
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html
          git commit -m 'Stableford V224 enable manual Gross input with automatic points'
          git push origin stableford-tournament-final