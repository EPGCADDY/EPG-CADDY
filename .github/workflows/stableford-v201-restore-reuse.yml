name: Stableford voice restore exact V120 SAFE
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v201-restore-reuse.yml']
permissions:
  contents: write
jobs:
  patch-audit-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
          fetch-depth: 0
      - name: Restore exact V120 SAFE activation path only
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html'); s=p.read_text(encoding='utf-8')
          old='''      // Cada nueva activación usa transporte Realtime fresco; evita reutilizar\n      // una sesión iOS aparentemente conectada que ya dejó de entregar audio.\n      teardownRealtime();\n      voiceContext=context;\n      setMicConnecting(context,true);\n      await ensureSession();'''
          new='''      // Reutiliza el transporte Realtime mientras siga sano en el mismo contexto.\n      // Patrón comprobado físicamente en V120 SAFE: solo reconecta si iOS lo invalidó.\n      voiceContext=context;\n      setMicConnecting(context,true);\n      const reuse=realtimeReusableFor(context);\n      if(!reuse){\n        teardownRealtime();\n        voiceContext=context;\n        setMicConnecting(context,true);\n        await ensureSession();\n      }'''
          if s.count(old)!=1: raise SystemExit(f'guard activation block count={s.count(old)}')
          s=s.replace(old,new,1)
          # V120 SAFE does not wait for session.created after the data channel opens.
          old2='''      await opened;\n      await sessionCreated;\n      if(generation!==realtimeGeneration)throw new Error("Conexión reemplazada");'''
          new2='''      await opened;\n      if(generation!==realtimeGeneration)throw new Error("Conexión reemplazada");'''
          if s.count(old2)!=1: raise SystemExit(f'guard session-created wait count={s.count(old2)}')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
      - name: Differential audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "index-grupal.html"
          grep -q 'const reuse=realtimeReusableFor(context);' index-grupal.html
          ! grep -q 'await sessionCreated;' index-grupal.html
          git diff --quiet HEAD -- api/session-grupal.js stableford.js stableford-torneo.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index-grupal.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/g.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/g.js
          node test-voice-continuity.mjs
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
      - name: Commit exact correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html
          git commit -m 'Stableford restore exact V120 SAFE mic activation'
          git push origin stableford-tournament-final
