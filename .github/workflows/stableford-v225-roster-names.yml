name: Stableford V225 roster names
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v225-roster-names.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
          fetch-depth: 0
      - name: Correct only requested roster names
        shell: python
        run: |
          from pathlib import Path
          for fn in ['index-grupal.html','stableford.js']:
            p=Path(fn);s=p.read_text(encoding='utf-8')
            s=s.replace('["Jaime","Junior","Adolfo","Herny"]','["Jaime","Junior","Fito","Henry"]')
            p.write_text(s,encoding='utf-8')
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq '["Jaime","Junior","Fito","Henry"]' index-grupal.html
          ! grep -Fq '["Jaime","Junior","Adolfo","Herny"]' index-grupal.html
          node --check stableford.js
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-grupal.html stableford.js
          git commit -m 'Correct qualifying roster to Fito and Henry'
          git push origin stableford-tournament-final