name: Stableford V207 transcription recovery
on:
  push:
    branches: [stableford-tournament-final]
    paths: ['.github/workflows/stableford-v207-force-audio-transcription.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableford-tournament-final
          fetch-depth: 0
      - name: Ensure Stableford fresh session after permission and context change
        shell: python
        run: |
          from pathlib import Path
          p=Path('stableford.js'); s=p.read_text(encoding='utf-8')
          old='''            const reuse=typeof realtimeReusableFor==="function"?realtimeReusableFor(context):(typeof realtimeReady==="function"&&realtimeReady());\n            if(!reuse){\n              if(typeof setMicConnecting==="function")setMicConnecting(context,true);\n              teardownRealtime();\n              voiceContext=context;\n              await ensureSession();\n            }'''
          new='''            const reuse=typeof realtimeReusableFor==="function"?realtimeReusableFor(context):(typeof realtimeReady==="function"&&realtimeReady());\n            const stablefordContextMismatch=typeof realtimeSessionContext!=="undefined"&&realtimeSessionContext&&realtimeSessionContext!==context;\n            if(!reuse||stablefordContextMismatch){\n              if(typeof setMicConnecting==="function")setMicConnecting(context,true);\n              teardownRealtime();\n              voiceContext=context;\n              await ensureSession();\n            }'''
          if s.count(old)!=1: raise SystemExit(f'anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Validate frozen scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "stableford.js"
          grep -Fq 'stablefordContextMismatch' stableford.js
          git diff --quiet HEAD -- index-grupal.html api/session-grupal.js stableford-torneo.html
          node --check stableford.js
          node test-stableford.mjs
          node test-stableford-ui.mjs
          node test-stableford-torneo.mjs
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stableford.js
          git commit -m 'Stableford V207 recover transcription session context'
          git push origin stableford-tournament-final