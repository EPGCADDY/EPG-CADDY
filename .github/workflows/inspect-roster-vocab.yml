name: Inspect roster vocab
on:
  push:
    branches: [grupal-dev]
    paths: ['.github/workflows/inspect-roster-vocab.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grupal-dev
      - name: Inspect roster parser
        shell: python
        run: |
          from pathlib import Path
          s=Path('index-grupal.html').read_text(encoding='utf-8')
          for key in ['function parseRosterCommand','const QUERY_WORDS','function isAccumulatedQueryTranscript']:
              i=s.find(key)
              print('\n###',key,'at',i)
              print(s[i:i+5000] if i>=0 else 'NOT FOUND')
