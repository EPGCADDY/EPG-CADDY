name: R45 Card Share WhatsApp v2
on:
  push:
    branches:
      - hotfix/card-share-whatsapp-r45
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/card-share-whatsapp-r45
          fetch-depth: 2
      - name: Apply patch
        run: python3 scripts/apply-r45-card-share.py
      - name: Verify focused contract
        run: node test-r45-card-share.mjs && git diff --check
      - name: Commit final R45
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/card-share.js card-share.html index-grupal.html middleware.js test-r45-card-share.mjs ROADMAP_A_DETALLE.md ROADMAP_OVERALL.md
          git commit -m "V407-R45: send official card to registered WhatsApp"
          git push origin HEAD:hotfix/card-share-whatsapp-r45
