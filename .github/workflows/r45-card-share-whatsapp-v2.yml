name: R45 Roadmap Registration
on:
  push:
    branches:
      - hotfix/card-share-whatsapp-r45
permissions:
  contents: write
jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/card-share-whatsapp-r45
          fetch-depth: 2
      - name: Register V397 in both roadmaps
        shell: python
        run: |
          from pathlib import Path
          line='\nR45 regresión actualizada: `test-v397-card-in-out-back-contract.mjs` valida que ENVIAR TARJETA DIGITAL use el WhatsApp registrado y conserve PNG como fallback.\n'
          for name in ('ROADMAP_A_DETALLE.md','ROADMAP_OVERALL.md'):
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              if 'R45 regresión actualizada: `test-v397-card-in-out-back-contract.mjs`' not in text:
                  p.write_text(text+line,encoding='utf-8')
      - name: Commit roadmaps only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ROADMAP_A_DETALLE.md ROADMAP_OVERALL.md
          git commit -m "R45: register digital card regression in roadmaps"
          git push origin HEAD:hotfix/card-share-whatsapp-r45
