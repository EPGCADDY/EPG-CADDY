name: Grupal V118 field fix
on:
  push:
    branches: [grupal-dev]
    paths:
      - .github/workflows/grupal-v118-field-fix.yml
permissions:
  contents: write
jobs:
  patch-audit-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grupal-dev
          fetch-depth: 0
      - name: Patch V118
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html')
          s=p.read_text(encoding='utf-8')
          old='function renderCourseInfo(){const rows=["Negro","Azul","Blanco","Rojo","Amarillo"].map(k=>[k,TEES[k]]);$("courseInfo").innerHTML=`<div class="head">MARCA</div><div class="head">YARDAS</div><div class="head">COURSE RATING</div><div class="head">SLOPE RATING</div>${rows.map(([k,t])=>`<div><span class="tee-dot" style="background:${t.color};border:${k===\'Negro\'?\'1px solid #777\':\'0\'}"></span>${t.label}</div><div style="text-align:center"><span style="color:${k===\'Negro\'?\'#000\':t.color};font-weight:800;${k===\'Negro\'?\'background:#fff;padding:1px 5px;border-radius:2px;display:inline-block;\':\'\'}">${t.total.toLocaleString(\'en-US\')}</span></div><div style="text-align:center">${t.rating.toFixed(1)}</div><div style="text-align:center">${t.slope}</div>`).join("")}`}'
          new='function renderCourseInfo(){const rows=["Negro","Azul","Blanco","Rojo","Amarillo"].map(k=>[k,TEES[k]]);$("courseInfo").innerHTML=`<div class="head">YARDAS</div><div class="head">COURSE RATING</div><div class="head">SLOPE RATING</div>${rows.map(([k,t])=>`<div style="text-align:left"><span class="tee-dot" style="background:${t.color};border:${k===\'Negro\'?\'1px solid #777\':\'0\'}"></span><span style="color:${k===\'Negro\'?\'#000\':t.color};font-weight:800;${k===\'Negro\'?\'background:#fff;padding:1px 5px;border-radius:2px;display:inline-block;\':\'\'}">${t.total.toLocaleString(\'en-US\')}</span></div><div style="text-align:center">${t.rating.toFixed(1)}</div><div style="text-align:center">${t.slope}</div>`).join("")}`}'
          if s.count(old)!=1:
              raise SystemExit(f'Expected renderCourseInfo old block once, found {s.count(old)}')
          s=s.replace(old,new,1)
          s=s.replace('.course-mic{width:153px;height:153px}.course-mic .mic-hit{inset:-50%}', '.course-mic{width:199px;height:199px}.course-mic .mic-hit{inset:-50%}',1)
          s=s.replace('.official-course-info .course-mic{width:85px;height:85px}', '.official-course-info .course-mic{width:111px;height:111px}',1)
          s=s.replace('.official-course-info .course-mic .mic-visual{font-size:50px;border-width:2px}', '.official-course-info .course-mic .mic-visual{font-size:65px;border-width:2px}',1)
          p.write_text(s,encoding='utf-8')
      - name: Audit V118
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q '<div class="head">MARCA</div>' index-grupal.html
          grep -q '<div class="head">YARDAS</div><div class="head">COURSE RATING</div><div class="head">SLOPE RATING</div>' index-grupal.html
          grep -q 'course-mic{width:199px;height:199px}' index-grupal.html
          grep -q 'course-mic{width:111px;height:111px}' index-grupal.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index-grupal.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/g.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/g.js
          git diff --check
          test "$(git diff --name-only)" = "index-grupal.html"
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-grupal.html
          git commit -m "V118 remove MARCA column and enlarge field mic 30 percent"
          git push origin grupal-dev
