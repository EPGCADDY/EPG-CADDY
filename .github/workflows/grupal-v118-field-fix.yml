# trigger-v120
name: Grupal V120 complete score confirmation speech
on:
  push:
    branches: [grupal-dev]
    paths:
      - .github/workflows/grupal-v118-field-fix.yml
permissions:
  contents: write
jobs:
  patch-audit-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grupal-dev
          fetch-depth: 0
      - name: Patch V120
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-grupal.html')
          s=p.read_text(encoding='utf-8')
          def rep(old,new,count=1):
              global s
              n=s.count(old)
              if n!=count:
                  raise SystemExit(f'Expected {count}, found {n}: {old[:180]!r}')
              s=s.replace(old,new,count)

          rep('<meta name="gscg-build" content="V119-FIELD-GROSS-SYMBOLS-20260817">',
              '<meta name="gscg-build" content="V120-SCORE-VOICE-COMPLETE-20260818">')

          rep('''function grossGolfSpeech(score){
  if(!score||!Number.isInteger(score.gross)||!Number.isInteger(score.par))return"";
  const d=score.gross-score.par;''',
              '''function grossGolfSpeech(score){
  if(!score||!Number.isInteger(score.gross)||!Number.isInteger(score.par))return"";
  if(score.gross===1)return"hoyo en uno";
  const d=score.gross-score.par;''')

          rep('''    lines.push(`Hoyo ${h}. ${playerVoiceAlias(p)}. ${grossGolfSpeech(score)}. ${parSpeech(score.diff)}.`);''',
              '''    lines.push(`Hoyo ${h}, ${playerVoiceAlias(p)}, ${grossGolfSpeech(score)}, ${parSpeech(score.diff)}.`);''')

          rep('''  stopMonitorActive=reason!=="error";
  phase="speaking";
  if(stopMonitorActive&&micTrack)micTrack.enabled=true;
  if(audioEl){audioEl.volume=1;audioEl.muted=false;}''',
              '''  stopMonitorActive=false;
  phase="speaking";
  if(micTrack)micTrack.enabled=false;
  if(audioEl){audioEl.volume=1;audioEl.muted=false;}''')

          rep('''      if(result.confirmationSpeech)setTimeout(()=>{if(dc?.readyState==="open")speakAuthorized("score_confirmation",result.confirmationSpeech)},0);''',
              '''      if(result.confirmationSpeech)setTimeout(()=>{if(dc?.readyState==="open"&&!activeResponseId&&!speechPlaybackResponseId)speakAuthorized("score_confirmation",result.confirmationSpeech)},80);''')

          p.write_text(s,encoding='utf-8')
      - name: Audit V120
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'V120-SCORE-VOICE-COMPLETE-20260818' index-grupal.html
          grep -q 'if(score.gross===1)return"hoyo en uno"' index-grupal.html
          grep -q 'Hoyo ${h}, ${playerVoiceAlias(p)}, ${grossGolfSpeech(score)}, ${parSpeech(score.diff)}.' index-grupal.html
          grep -q 'stopMonitorActive=false' index-grupal.html
          grep -q 'if(micTrack)micTrack.enabled=false' index-grupal.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index-grupal.html').read_text(encoding='utf-8')
          assert s.count('function grossGolfSpeech') == 1
          assert s.count('function scoreConfirmationSpeech') == 1
          assert s.count('function speakAuthorized') == 1
          assert 'V119-FIELD-GROSS-SYMBOLS-20260817' not in s
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/g.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/g.js
          git diff --check
          test "$(git diff --name-only)" = "index-grupal.html"
          git diff --quiet HEAD -- index.html api/session.js api/score.js api/session-grupal.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-grupal.html
          git commit -m "V120 fix complete score confirmation speech"
          git push origin grupal-dev
