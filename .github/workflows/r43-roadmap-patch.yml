name: LAB R43 roadmap helper history

on:
  push:
    branches:
      - lab/r43-universal-ai-fallback

permissions:
  contents: write

jobs:
  register-r43-helper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lab/r43-universal-ai-fallback

      - name: Register temporary helper path in both roadmaps
        run: |
          python3 - <<'PY'
          from pathlib import Path
          marker = "Temporary helper history: `.github/workflows/r43-roadmap-patch.yml`"
          line = "\n- Temporary helper history: `.github/workflows/r43-roadmap-patch.yml` was used only to append the mandatory R43 roadmap registration and self-delete; it is not part of the final runtime or deployment.\n"
          for name in ["ROADMAP_OVERALL.md", "ROADMAP_A_DETALLE.md"]:
              p = Path(name)
              text = p.read_text(encoding="utf-8")
              if marker not in text:
                  p.write_text(text.rstrip()+line+"\n", encoding="utf-8")
          PY

      - name: Remove temporary workflow
        run: git rm .github/workflows/r43-roadmap-patch.yml

      - name: Commit roadmap helper history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "LAB R43: document temporary roadmap helper and remove it"
          git push origin HEAD:lab/r43-universal-ai-fallback
