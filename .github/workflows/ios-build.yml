name: Golf Score Card GT · iOS Build Check

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Block iOS build when ROADMAPS are incomplete
        env:
          ROADMAP_BASE_SHA: ${{ github.event.before }}
          ROADMAP_HEAD_SHA: ${{ github.sha }}
        run: node scripts/roadmap-gate.mjs "$ROADMAP_BASE_SHA" "$ROADMAP_HEAD_SHA"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build iOS Simulator
        working-directory: ios
        run: |
          xcodebuild \
            -project EPGCaddy.xcodeproj \
            -scheme EPGCaddy \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
