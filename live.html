  <style>
    :root{color-scheme:dark;--lime:#31ff00;--red:#ff4545;--gold:#e4c468;--line:#45494a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}.live-app{width:min(1500px,100%);margin:auto;padding:12px}.live-head{display:grid;grid-template-columns:92px 1fr;gap:13px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px;background:#050505}.live-head img{width:92px;height:92px;object-fit:contain}.live-head h1{margin:0;color:var(--lime);font-size:clamp(20px,4vw,34px);letter-spacing:.5px}.live-head p{margin:5px 0 0;color:#aaa;font-size:10px;line-height:1.35}.live-state{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:10px 0;padding:9px 11px;border:1px solid #255f1d;border-radius:8px;background:#061005;color:var(--lime);font-size:11px;font-weight:900}.live-state.warning{border-color:#6a571d;background:#151103;color:#ffd05a}.live-state.error{border-color:#6b2323;background:#160606;color:#ff7777}.live-dot{display:inline-block;width:9px;height:9px;margin-right:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;animation:pulse 1.3s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}.live-hub-add{display:block;width:min(620px,100%);min-height:52px;margin:10px auto;border:0;border-radius:9px;background:var(--lime);color:#000;font-weight:900}.live-summary{margin:10px 0;color:#aaa;font-size:10px}.live-grid{display:grid;gap:12px}.group-card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#030303}.group-head{display:flex;justify-content:space-between;gap:12px;align-items:start;padding:11px;border-bottom:1px solid #333}.group-head h2{margin:0;color:var(--lime);font-size:17px}.group-meta{margin-top:4px;color:#aaa;font-size:9px}.group-badge{padding:5px 7px;border:1px solid #555;border-radius:999px;color:#fff;font-size:8px;font-weight:900;white-space:nowrap}.player-live{padding:10px;border-bottom:1px solid #292c2d}.player-live:last-child{border-bottom:0}.player-title{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:7px}.player-title strong{font-size:14px}.player-title small{color:#bbb;font-size:9px}.score-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.score-live{min-width:1040px;width:100%;border-collapse:collapse;table-layout:fixed}.score-live th,.score-live td{height:31px;border:1px solid #444;padding:2px;text-align:center;font-size:10px}.score-live th:first-child,.score-live td:first-child{position:sticky;left:0;z-index:2;width:70px;background:#050505;text-align:left;padding-left:7px;font-weight:900}.score-live th{color:#bbb}.score-live td.filled{font-weight:900}.score-live td.under{color:var(--lime)}.score-live td.over{color:var(--red)}.player-total{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:7px}.player-total div{padding:7px 4px;border:1px solid #333;border-radius:6px;text-align:center}.player-total small{display:block;color:#888;font-size:7px}.player-total b{display:block;margin-top:2px;font-size:12px}.live-empty{padding:36px 14px;border:1px solid #333;border-radius:10px;color:#aaa;text-align:center;line-height:1.6}.load-more{display:block;width:min(420px,100%);min-height:46px;margin:14px auto;border:1px solid var(--lime);border-radius:8px;background:#050505;color:var(--lime);font-weight:900}.live-footer{padding:15px 4px;color:#686868;text-align:center;font-size:8px;line-height:1.45}@media(max-width:640px){.live-app{padding:7px}.live-head{grid-template-columns:64px 1fr}.live-head img{width:64px;height:64px}.live-state{grid-template-columns:1fr}.group-head{display:block}.group-badge{display:inline-block;margin-top:7px}.player-total{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
  <main class="live-app">
    <header class="live-head"><img src="/assets/official-logos/golf-score-card-gt-pwa-v345-192.png" alt="Golf Score Card GT"><div><h1>GOLF SCORE CARD GT. LIVE</h1><p>VISTA REMOTA · SÓLO LECTURA · NO REQUIERE INSTALAR LA APLICACIÓN</p></div></header>
