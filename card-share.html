<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Golf Score Card GT · Tarjeta Digital</title><style>html,body{margin:0;background:#000;color:#fff;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#state{padding:24px;text-align:center;color:#31ff00;font-weight:900}iframe{display:none;width:100%;height:100vh;border:0;background:#000}</style></head><body><div id="state">ABRIENDO TARJETA DIGITAL…</div><iframe id="card" title="Tarjeta Digital Oficial"></iframe><script src="/card-artifacts.js"></script><script>(async()=>{const state=document.getElementById('state'),frame=document.getElementById('card');try{const token=new URLSearchParams(location.hash.slice(1)).get('card')||'';if(!/^[0-9a-f-]{36}$/i.test(token))throw new Error('INVALID');const response=await fetch('/api/card-share',{method:'POST',headers:{'content-type':'application/json'},cache:'no-store',body:JSON.stringify({action:'read',token})}),data=await response.json();if(!response.ok||!data.ok)throw new Error(data.code||'FAILED');const artifact=window.GSCCardArtifacts.build(data.snapshot).global;frame.srcdoc=artifact.html;frame.style.display='block';state.remove()}catch(error){state.style.color='#ff5757';state.textContent='NO SE PUDO ABRIR LA TARJETA DIGITAL';}})();</script></body></html>
