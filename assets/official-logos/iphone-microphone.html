<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comprobación de micrófono · EPG Caddy</title><style>body{background:#090c0a;color:#fff;font:18px/1.5 system-ui;margin:24px auto;padding:0 18px;max-width:600px}button{font:inherit;background:#61f000;color:#101010;padding:16px;border:0;border-radius:12px}li{margin:12px 0}#phase{font-weight:700}meter{width:100%;height:32px}pre{white-space:pre-wrap;font:15px/1.6 system-ui}</style><h1>Comprobación del micrófono</h1><p>Dos pasos: comprobar sonido y comprobar reconocimiento. Sigue el mensaje en pantalla. No se guarda ni envía audio; el navegador puede usar su servicio de reconocimiento.</p><button id="start">Comprobar micrófono</button><button id="stop" hidden>Detener</button><p id="phase" role="status">Listo para comenzar.</p><meter id="level" min="0" max="0.1" value="0" aria-label="Nivel de sonido"></meter><pre id="results" aria-live="polite"></pre><script>
const $=id=>document.getElementById(id);let run=0,stream=null,context=null,recognition=null,timer=null,frame=null;
function log(text){$('results').textContent+=text+'\n'}
async function cleanup(){clearTimeout(timer);cancelAnimationFrame(frame);if(recognition){for(const key of ['onstart','onaudiostart','onsoundstart','onspeechstart','onresult','onerror','onend'])recognition[key]=null;try{recognition.abort()}catch{}recognition=null}stream?.getTracks().forEach(t=>t.stop());stream=null;if(context){const c=context;context=null;await c.close().catch(()=>{})}}
function finish(){ $('start').disabled=false;$('stop').hidden=true;$('phase').textContent='Comprobación terminada. Comparte una captura del resultado.' }
$('stop').onclick=async()=>{run++;await cleanup();log('DETENIDO por el usuario');finish()};
$('start').onclick=async()=>{const token=++run;$('start').disabled=true;$('stop').hidden=false;$('results').textContent='';$('phase').textContent='1 de 2 · Permite el micrófono y di: Hola, Colima, México.';
try{const acquired=await navigator.mediaDevices.getUserMedia({audio:true});if(token!==run){acquired.getTracks().forEach(t=>t.stop());return}stream=acquired;const track=stream.getAudioTracks()[0];log('Captura: '+track.readyState+'; silenciado: '+track.muted);context=new (window.AudioContext||window.webkitAudioContext)();await context.resume();const analyser=context.createAnalyser();analyser.fftSize=2048;context.createMediaStreamSource(stream).connect(analyser);const data=new Float32Array(analyser.fftSize);let peak=0;const sample=()=>{analyser.getFloatTimeDomainData(data);const rms=Math.sqrt(data.reduce((sum,v)=>sum+v*v,0)/data.length);peak=Math.max(peak,rms);$('level').value=rms;frame=requestAnimationFrame(sample)};sample();timer=setTimeout(async()=>{if(token!==run)return;log('Nivel máximo RMS: '+peak.toFixed(6));log(peak>0.003?'PASS · Entró señal de sonido (no identifica voz).':'SIN SEÑAL SUFICIENTE · No confirma entrada de voz.');await cleanup();if(token!==run)return;startRecognition(token)},5000)
}catch(e){if(token!==run)return;log('FAIL · Captura: '+e.name);await cleanup();finish()}};
function startRecognition(token){const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){log('FAIL · Este navegador no ofrece reconocimiento.');finish();return} $('phase').textContent='2 de 2 · Vuelve a decir: Hola, Colima, México.';recognition=new Recognition();recognition.lang='es-GT';recognition.continuous=true;recognition.interimResults=true;let results=0;const began=performance.now();for(const event of ['start','audiostart','soundstart','speechstart'])recognition['on'+event]=()=>log('Reconocimiento '+event+' · '+Math.round(performance.now()-began)+' ms');recognition.onresult=()=>{results++;log('PASS · Transcripción recibida (contenido omitido).')};recognition.onerror=e=>log('FAIL · Reconocimiento: '+e.error);recognition.onend=async()=>{if(token!==run)return;log('Resultados recibidos: '+results);if(!results)log('FAIL · Reconocimiento terminó sin transcripción.');await cleanup();finish()};try{recognition.start();timer=setTimeout(()=>{if(token!==run)return;log('Límite de prueba: 12 segundos.');try{recognition.stop()}catch{}timer=setTimeout(async()=>{await cleanup();finish()},1500)},12000)}catch(e){log('FAIL · Inicio: '+e.name);cleanup().then(finish)}}
window.addEventListener('pagehide',()=>{run++;cleanup()});
</script></html>
