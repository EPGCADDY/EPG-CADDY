<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Acceso · Golf Score Card GT</title><link rel="stylesheet" href="/scores-ui.css"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#020402;color:#fff;font-family:Arial,sans-serif;padding:24px}.box{width:min(520px,100%);border:1px solid #53605b;border-radius:24px;background:#070b08;padding:28px;box-shadow:0 0 45px #20ff0030}h1{margin:0 0 8px;color:#31ff00;font-size:28px}p{color:#c7ceca;line-height:1.45}.row{display:grid;gap:12px;margin-top:18px}input,button{min-height:54px;border-radius:14px;border:1px solid #65706b;background:#020302;color:#fff;padding:0 16px;font-size:16px;font-weight:800}button{border:2px solid #31ff00;color:#31ff00}.owner{display:none}.url{cursor:pointer;word-break:break-word;background:#000;border:1px solid #31ff00;padding:14px;border-radius:12px;color:#fff;line-height:1.5}.status{min-height:24px;color:#31ff00;font-weight:900;margin-top:14px}.danger{border-color:#ff4040;color:#ff6464}hr{border:0;border-top:1px solid #455;margin:12px 0}</style></head><body><main class="box"><h1>GOLF SCORE CARD GT</h1><p>Panel privado del propietario para crear únicamente el enlace compartido válido por 48 horas. Para abrir la aplicación, entra directamente a Registro; no necesitas credenciales.</p><section class="row" id="login"><input id="email" type="email" autocomplete="username" placeholder="CORREO"><input id="password" type="password" autocomplete="current-password" placeholder="CONTRASEÑA"><button id="signin">ENTRAR COMO PROPIETARIO</button></section><section class="row owner" id="owner"><button id="create">COMPARTIR APP 48 HORAS</button><div class="url" id="url" hidden role="button" tabindex="0" aria-label="Compartir invitación 48 horas por WhatsApp"></div><button id="copy" hidden>COPIAR ENLACE</button><button class="danger" id="revoke" hidden>REVOCAR ENLACE</button></section><div class="status" id="status" role="status"></div></main><script>
const $=id=>document.getElementById(id);let grantId="";
async function redeemInvite(){const pathMatch=location.pathname.match(/^\/invite\/([A-Za-z0-9_-]{43})$/),queryToken=new URL(location.href).searchParams.get("invite")||"",hashMatch=location.hash.match(/^#invite=([A-Za-z0-9_-]{43})$/),token=pathMatch?.[1]||(/^[A-Za-z0-9_-]{43}$/.test(queryToken)?queryToken:(hashMatch?.[1]||""));if(!token)return false;history.replaceState(null,"","/access.html");$("login").style.display="none";$("status").textContent="ABRIENDO INVITACIÓN…";try{const response=await fetch(`/api/app-access?action=redeem&token=${encodeURIComponent(token)}`,{method:"POST",credentials:"include"});if(!response.ok)throw new Error;location.replace("/index-grupal.html?source=guest48h");return true}catch{$('status').textContent="ENLACE INVÁLIDO, VENCIDO O SIN CUPOS";return false}}
async function call(action,options={}){const response=await fetch(`/api/app-access?action=${action}`,{credentials:"include",...options});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.code||"ERROR");return data}
function whatsappInviteText(url){return ["INVITACIÓN 48 HORAS","","TOCA EL ENLACE PARA ABRIR LA SCORE CARD:",url].join("\n")}function openWhatsAppInviteLink(url){const link=String(url||"").trim();if(!link)return false;location.assign("https://wa.me/?text="+encodeURIComponent(whatsappInviteText(link)));return true}async function refresh(){try{const data=await call("status");if(data.role==="owner"){$("login").style.display="none";$("owner").style.display="grid";$("status").textContent="CUENTA PROPIETARIA VERIFICADA"}}catch{$("status").textContent="ACCESO PROPIETARIO REQUERIDO"}}
$("signin").onclick=async()=>{try{const response=await fetch("/api/account?action=signin",{method:"POST",headers:{"content-type":"application/json"},credentials:"include",body:JSON.stringify({email:$("email").value,password:$("password").value})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(String(data?.code||data?.message||`HTTP_${response.status}`));await refresh()}catch(error){$("status").textContent=`NO SE PUDO VERIFICAR LA CUENTA PROPIETARIA · ${String(error?.message||"ERROR")}`}};
$("create").onclick=async()=>{try{const data=await call("create",{method:"POST"});grantId=data.id;$("url").textContent=data.url;$("url").hidden=false;$("copy").hidden=false;$("revoke").hidden=false;$("status").textContent=`VÁLIDO HASTA ${new Date(data.expiresAt).toLocaleString()} · ABRIENDO WHATSAPP`;openWhatsAppInviteLink(data.url)}catch(error){$("status").textContent=error.message}};
$("url").onclick=()=>openWhatsAppInviteLink($("url").textContent);$("url").onkeydown=event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();openWhatsAppInviteLink($("url").textContent)}};$("copy").onclick=async()=>{await navigator.clipboard.writeText($("url").textContent);$("status").textContent="ENLACE COPIADO"};
$("revoke").onclick=async()=>{try{await call("revoke",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:grantId})});$("url").hidden=$("copy").hidden=$("revoke").hidden=true;$("status").textContent="ENLACE REVOCADO"}catch(error){$("status").textContent=error.message}};
if(!location.pathname.startsWith("/invite/")&&!new URL(location.href).searchParams.has("invite")&&!location.hash.startsWith("#invite="))refresh();else redeemInvite();</script></body></html>
