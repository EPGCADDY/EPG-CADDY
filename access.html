<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Acceso · Golf Score Card GT</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#020402;color:#fff;font-family:Arial,sans-serif;padding:24px}.box{width:min(520px,100%);border:1px solid #53605b;border-radius:24px;background:#070b08;padding:28px;box-shadow:0 0 45px #20ff0030}h1{margin:0 0 8px;color:#31ff00;font-size:28px}p{color:#c7ceca;line-height:1.45}.row{display:grid;gap:12px;margin-top:18px}input,button{min-height:54px;border-radius:14px;border:1px solid #65706b;background:#020302;color:#fff;padding:0 16px;font-size:16px;font-weight:800}button{border:2px solid #31ff00;color:#31ff00}.owner{display:none}.url{word-break:break-word;background:#000;border:1px solid #31ff00;padding:14px;border-radius:12px;color:#fff;line-height:1.5}.status{min-height:24px;color:#31ff00;font-weight:900;margin-top:14px}.danger{border-color:#ff4040;color:#ff6464}hr{border:0;border-top:1px solid #455;margin:12px 0}</style></head><body><main class="box"><h1>GOLF SCORE CARD GT</h1><p>Acceso privado. Inicia sesión con la cuenta propietaria para abrir la aplicación o emitir un acceso limpio de 24 horas.</p><section class="row" id="login"><input id="email" type="email" autocomplete="username" placeholder="CORREO"><input id="password" type="password" autocomplete="current-password" placeholder="CONTRASEÑA"><button id="signin">ENTRAR COMO PROPIETARIO</button></section><section class="row owner" id="owner"><button id="open">ABRIR APLICACIÓN</button><button id="create">CREAR ENLACE DE 24 HORAS</button><div class="url" id="url" hidden></div><button id="copy" hidden>COPIAR ENLACE</button><button class="danger" id="revoke" hidden>REVOCAR ENLACE</button><button id="report">VER ACTIVIDAD ANÓNIMA</button><div class="url" id="reportData" hidden></div></section><div class="status" id="status" role="status"></div></main><script>
const $=id=>document.getElementById(id);let grantId="";
async function redeemInviteFromHash(){const match=location.hash.match(/^#invite=([A-Za-z0-9_-]{43})$/);if(!match)return false;const token=match[1];history.replaceState(null,"",location.pathname);$("login").style.display="none";$("status").textContent="ABRIENDO INVITACIÓN…";try{const response=await fetch(`/api/app-access?action=redeem&token=${encodeURIComponent(token)}`,{method:"POST",credentials:"include"});if(!response.ok)throw new Error;location.replace("/index-grupal.html?source=guest24h");return true}catch{$("status").textContent="ENLACE INVÁLIDO, VENCIDO O YA UTILIZADO";return false}}
async function call(action,options={}){const response=await fetch(`/api/app-access?action=${action}`,{credentials:"include",...options});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.code||"ERROR");return data}
async function refresh(){try{const data=await call("status");if(data.role==="owner"){$("login").style.display="none";$("owner").style.display="grid";$("status").textContent="CUENTA PROPIETARIA VERIFICADA"}}catch{$("status").textContent="ACCESO PROPIETARIO REQUERIDO"}}
$("signin").onclick=async()=>{try{const response=await fetch("/api/account?action=signin",{method:"POST",headers:{"content-type":"application/json"},credentials:"include",body:JSON.stringify({email:$("email").value,password:$("password").value})});if(!response.ok)throw new Error;await refresh()}catch{$("status").textContent="NO SE PUDO VERIFICAR LA CUENTA PROPIETARIA"}};
$("open").onclick=()=>location.href="/index-grupal.html?source=owner";
$("create").onclick=async()=>{try{const data=await call("create",{method:"POST"});grantId=data.id;$("url").textContent=data.url;$("url").hidden=false;$("copy").hidden=false;$("revoke").hidden=false;$("status").textContent=`VÁLIDO HASTA ${new Date(data.expiresAt).toLocaleString()}`}catch(error){$("status").textContent=error.message}};
$("copy").onclick=async()=>{await navigator.clipboard.writeText($("url").textContent);$("status").textContent="ENLACE COPIADO"};
$("revoke").onclick=async()=>{try{await call("revoke",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:grantId})});$("url").hidden=$("copy").hidden=$("revoke").hidden=true;$("status").textContent="ENLACE REVOCADO"}catch(error){$("status").textContent=error.message}};
$("report").onclick=async()=>{try{const data=await call("report",{method:"POST"}),items=data.items||[];$("reportData").hidden=false;$("reportData").innerHTML=items.length?items.map(item=>`<b>${new Date(item.created_at).toLocaleString()}</b><br>ABRIÓ: ${item.opened_at?"SÍ":"NO"} · MODALIDAD: ${(item.modality||"—").toUpperCase()} · JUGADORES: ${item.max_players} · HOYOS: ${item.holes_used} · ANOTACIONES: ${item.annotations_count} · ESTADO: ${item.revoked_at?"REVOCADO":new Date(item.expires_at)>new Date()?"ACTIVO":"VENCIDO"}`).join("<hr>"):"SIN ACTIVIDAD EN LAS ÚLTIMAS 48 HORAS"}catch(error){$("status").textContent=error.message}};
if(!location.hash.startsWith("#invite="))refresh();else redeemInviteFromHash();</script></body></html>
