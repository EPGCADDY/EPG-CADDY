<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Registro · Golf Score Card GT</title><link rel="stylesheet" href="/scores-ui.css"><style>body{margin:0;background:#020402;color:#fff;font:700 16px Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.entry{width:min(520px,calc(100% - 48px));padding:24px;border:1px solid #354038;border-radius:18px;background:#050706}.entry img{display:block;width:min(320px,100%);margin:0 auto 20px}.entry h1{font-size:20px;color:#31ff00}.entry label{display:block;margin:20px 0 8px}.entry input,.entry button{box-sizing:border-box;width:100%;min-height:52px;border-radius:10px;font:700 16px Arial,sans-serif;padding:12px}.entry input{background:#000;border:1px solid #31ff00;color:#fff}.entry button{margin-top:12px;background:#31ff00;color:#000;border:0}.entry p{line-height:1.5}.entry [role=status]{color:#31ff00;min-height:24px}</style></head><body><main class="entry"><img src="/assets/official-logos/golf-score-card-gt-horizontal-original.webp" alt="Golf Score Card Guatemala"><h1 id="entryTitle">REGISTRO</h1><p id="entryLead">Ingresa el código que te compartieron para abrir tu ronda.</p><form id="entryForm"><label for="entryCode">CÓDIGO DE ACCESO</label><input id="entryCode" name="code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" required maxlength="28" autofocus><button id="entryEnter" type="submit">ENTRAR</button></form><p id="entryStatus" role="status" aria-live="polite"></p></main><script src="/code-entry.js"></script></body></html>
