<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico real de actualización</title></head><body><h1>Diagnóstico real: controlador y caché</h1><p>Perfil de prueba. Sin datos de jugadores ni simulaciones de versión.</p><button id="check">COMPROBAR RECURSOS</button><pre id="status">Iniciando registro...</pre><pre id="resources"></pre><script>
const status=document.querySelector('#status'),resources=document.querySelector('#resources');let errors=[];
async function report(){try{const registrations=await navigator.serviceWorker.getRegistrations();const cacheNames=await caches.keys();status.textContent=JSON.stringify({controller:navigator.serviceWorker.controller?.scriptURL||null,registrations:registrations.map(r=>({scope:r.scope,installing:r.installing?.state,waiting:r.waiting?.state,active:r.active?.state})),caches:cacheNames,errors},null,2)}catch(e){status.textContent=e.message}}
navigator.serviceWorker.register('/service-worker.js',{scope:'/',updateViaCache:'none'}).then(r=>{r.addEventListener('updatefound',()=>{const w=r.installing;w?.addEventListener('statechange',report)});report()}).catch(e=>{errors.push(e.message);report()});setInterval(report,2000);
document.querySelector('#check').onclick=async()=>{resources.textContent='Consultando recursos reales...';try{const worker=await fetch('/service-worker.js',{cache:'no-store'}),source=await worker.text();const list=[...source.match(/const SHELL=\[([\s\S]*?)\];/)[1].matchAll(/"([^"]+)"/g)].map(m=>m[1]);list.push('/index-grupal.html');const result=await Promise.all(list.map(async path=>{try{const r=await fetch(path,{cache:'no-store'});return {path,status:r.status,type:r.headers.get('content-type'),redirected:r.redirected}}catch(e){return{path,error:e.message}}}));resources.textContent=JSON.stringify(result,null,2)}catch(e){resources.textContent=e.message}};
</script></body></html>
