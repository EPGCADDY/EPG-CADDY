<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Prueba del aviso de actualización</title><style>body{font:16px Arial;background:#101410;color:white}button{padding:12px;margin:5px}iframe{width:100%;height:480px;border:1px solid #31ff00}</style></head><body><h1>Prueba aislada del aviso</h1><p>Usa las funciones y CSS del paquete publicado. No tiene rondas, datos ni instalación.</p><button data-case="failure">FALLO DE RED</button><button data-case="new">VERSIÓN NUEVA</button><button data-case="current">VERSIÓN ACTUAL</button><div id="result">Cargando fuente real…</div><iframe title="Aviso con CSS real"></iframe><script>
(async()=>{const html=await(await fetch('/index-grupal.html?__gscg_build_check=1',{cache:'no-store'})).text();const start=html.indexOf('const CURRENT_APP_BUILD='),end=html.indexOf('$("mandatoryUpdateButton").addEventListener("click",installMandatoryUpdate)',start);if(start<0||end<0)throw Error('Fuente no reconocida');const styles=[...html.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/gi)].map(m=>m[1]).join('\n');const release=html.match(/<meta name="gscg-release" content="([^"]+)"/)[1];const frame=document.querySelector('iframe');frame.srcdoc='<head><meta name="gscg-release" content="'+release+'"><style>'+styles+'</style></head><body><div id="appReleaseBadge"></div><span id="appVersionId"></span><div class="mandatory-update" id="mandatoryUpdate"><div class="mandatory-update-card"><button id="mandatoryUpdateButton"><span id="mandatoryUpdateAction"></span></button></div></div><script>const $=id=>document.getElementById(id);'+html.slice(start,end)+'window.reviewCase=async function(kind){showCurrentBuild();window.fetch=async()=>{if(kind==="failure")throw Error("OFFLINE DE PRUEBA");return {ok:true,json:async()=>({release:CURRENT_APP_BUILD+(kind==="new"?"-NEXT":"")})}};await syncPublishedAppVersion()};<'+ '/script></body>';document.getElementById('result').textContent='Fuente publicada: '+release;for(const button of document.querySelectorAll('[data-case]'))button.onclick=async()=>{await frame.contentWindow.reviewCase(button.dataset.case);const el=frame.contentDocument.getElementById('mandatoryUpdate');document.getElementById('result').textContent=button.textContent+' · '+frame.contentDocument.getElementById('mandatoryUpdateAction').textContent+' · display='+frame.contentWindow.getComputedStyle(el).display};})();
</script></body></html>
