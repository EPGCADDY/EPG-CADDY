<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Prueba instalada R147.2.4 original</title></head><body><h1>Prueba instalada R147.2.4 original</h1><p>Solo perfil de prueba Preview. Conserva los datos del perfil. Tarjeta y menú originales del commit 8bccff9. Adaptador de preparación consume respuestas durante la instalación inicial; importa intacto el controlador original y conserva su navegación.</p><button id="prepare">PREPARAR CONTROLADOR ORIGINAL</button><button id="open" disabled>ABRIR MISMO ACCESO INSTALADO</button><pre id="status">PENDIENTE</pre><script>
const status=document.getElementById('status'),open=document.getElementById('open');
document.getElementById('prepare').onclick=async()=>{try{
 if(['golf-sc-gt-lab.vercel.app','epg-caddy.vercel.app'].includes(location.hostname))throw Error('Solo Preview de pruebas; prohibido en dominios fijos');
 status.textContent='Preparando instalación antigua real…';
 const registration=await navigator.serviceWorker.register('/tests/fixtures/r14724-preparation-worker.js',{scope:'/',updateViaCache:'none'});
 const worker=registration.installing||registration.waiting||registration.active;
 const progress=setInterval(()=>status.textContent=JSON.stringify({stage:'preparing',controller:navigator.serviceWorker.controller?.scriptURL,installing:registration.installing?.state,waiting:registration.waiting?.state,active:registration.active?.state,selected:worker.state},null,2),1000);
 if(worker.state!=='activated')await new Promise(resolve=>{const changed=()=>{if(worker.state==='activated'||worker.state==='redundant'){worker.removeEventListener('statechange',changed);resolve()}};worker.addEventListener('statechange',changed);changed()});
 clearInterval(progress);if(worker.state==='redundant')throw Error('Original controller install became redundant');
 const source=await(await fetch('/tests/fixtures/r14724-service-worker.js',{cache:'no-store'})).text();
 const prefix=source.match(/const CACHE_NAME="([^"]+)"/)[1];
 const cache=await caches.open(prefix+'-approved-r147-2-4-manual-update');
 for(const [path,fixture] of [['/index-grupal.html','r14724-card.html'],['/shortcuts-ui.js','r14724-shortcuts.js']]){const response=await fetch('/tests/fixtures/'+fixture,{cache:'no-store'});if(!response.ok)throw Error('Missing legacy fixture');await cache.put(path,response)}
 const approved=await(await cache.match('/index-grupal.html')).text();
 status.textContent=JSON.stringify({controller:navigator.serviceWorker.controller?.scriptURL,active:registration.active?.scriptURL,state:registration.active?.state,approvedRelease:approved.match(/<meta\s+name="gscg-release"\s+content="([^"]+)"/)[1],entry:'/pwa-launch.html',roundStorageChanged:false},null,2);open.disabled=false;
 }catch(error){status.textContent='FAIL: '+error.message}};
open.onclick=()=>location.assign('/pwa-launch.html');
</script></body></html>
