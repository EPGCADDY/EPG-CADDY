<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GSC · Presentación Final</title><style>:root{color-scheme:dark;--g:#39ff14;--bg:#020402;--line:#273027;--muted:#95a095}*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;height:100%}body{display:flex;flex-direction:column}.top{padding:12px 14px;border-bottom:1px solid var(--line);background:#030503}.brand{font-weight:900;letter-spacing:.09em;font-size:18px}.brand b{color:var(--g)}.sub{font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.12em}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;background:#000}.frame{position:relative;height:100%;max-height:calc(100vh - 150px);aspect-ratio:486/1014;max-width:100%;border:1px solid #202720;border-radius:14px;overflow:hidden;background:#000}video{width:100%;height:100%;object-fit:contain;background:#000;display:block}.chip{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.76);border:1px solid #3a433a;border-radius:999px;padding:5px 10px;font-size:10px;font-weight:800;white-space:nowrap}.controls{padding:10px 12px 14px;border-top:1px solid #191f19;background:#020302;display:grid;grid-template-columns:2fr 1fr;gap:8px}.controls button{min-height:48px;border-radius:11px;font-weight:900;border:1px solid #3a443a;background:#080b08;color:#fff;font-size:13px}.controls .main{background:var(--g);color:#001000;border-color:var(--g)}.status{grid-column:1/-1;text-align:center;color:var(--g);font-size:10px;font-weight:800;letter-spacing:.08em;min-height:14px}@media(min-width:700px){.brand{font-size:22px}.sub{font-size:11px}.controls{max-width:620px;width:100%;margin:auto}}</style></head><body><div class="top"><div class="brand">GOLF <b>SCORE CARD GT</b></div><div class="sub">PRESENTACIÓN AUDIOVISUAL INTERACTIVA · RECORRIDO REAL LAB</div></div><div class="stage"><div class="frame"><video id="v" playsinline preload="auto" muted src="https://cdn.creativeclaw.co/u/9cfd647d/videos/78070f08-43cd-46fe-adfd-4df4ea6159ac.mp4"></video><div class="chip" id="chip">Recorrido real LAB</div></div></div><div class="controls"><button class="main" id="play">▶ INICIAR PRESENTACIÓN</button><button id="reset">↺ REINICIAR</button><div class="status" id="status">LISTA · VIDEO REAL + NARRACIÓN NATURAL</div></div><script>(()=>{const v=document.getElementById('v'),play=document.getElementById('play'),reset=document.getElementById('reset'),status=document.getElementById('status'),chip=document.getElementById('chip');const segs=[{t:0,l:'Configuración inicial',u:'https://cdn.creativeclaw.co/u/9cfd647d/audio/b6e13094-c681-4505-b130-e35c62762c09.mp3'},{t:20,l:'Registro de jugadores',u:'https://cdn.creativeclaw.co/u/9cfd647d/audio/8feb8f6d-ad14-4e66-9baf-ca4029743fc7.mp3'},{t:85,l:'Score Card',u:'https://cdn.creativeclaw.co/u/9cfd647d/audio/31e1c6c5-62e7-43e8-a8cf-cbdbaa4c3d78.mp3'},{t:118,l:'Corrección de datos',u:'https://cdn.creativeclaw.co/u/9cfd647d/audio/9a60dc42-252b-41b0-a767-5497fd374f5f.mp3'},{t:145,l:'Modalidades',u:'https://cdn.creativeclaw.co/u/9cfd647d/audio/18fec1aa-6e19-4551-8eff-5b334b076e6d.mp3'},{t:166,l:'Tarjeta Digital',u:'https://cdn.creativeclaw.co/u/9cfd647d/audio/eb377782-e4e5-4f82-b294-0b3723902b1c.mp3'}];const aud=segs.map(s=>{const a=new Audio(s.u);a.preload='auto';return a});let active=-1;function stopA(){aud.forEach(a=>{a.pause();a.currentTime=0})}async function unlock(){for(const a of aud){try{a.volume=0;await a.play();a.pause();a.currentTime=0;a.volume=1}catch(e){}}}function sync(){if(v.paused)return;let i=-1;for(let n=0;n<segs.length;n++)if(v.currentTime>=segs[n].t)i=n;if(i>=0&&i!==active){stopA();active=i;chip.textContent=segs[i].l;aud[i].play().catch(()=>{});}}async function start(){stopA();active=-1;v.currentTime=0;await unlock();try{await v.play();play.textContent='❚❚ PAUSA';status.textContent='REPRODUCIENDO'}catch(e){status.textContent='TOCÁ PLAY NUEVAMENTE'}}play.onclick=async()=>{if(v.paused){await start()}else{v.pause();aud.forEach(a=>a.pause());play.textContent='▶ CONTINUAR';status.textContent='PAUSA'}};reset.onclick=start;v.ontimeupdate=sync;v.onended=()=>{stopA();play.textContent='▶ REPRODUCIR DE NUEVO';status.textContent='FINALIZADA';chip.textContent='Presentación finalizada'};})();</script></body></html>
