<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GOLF SCORE CARD GT · Presentación Final</title><style>html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100%}.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#000}.stage{width:100%;max-width:720px;position:relative;background:#000}video{width:100%;height:auto;display:block;background:#000;object-fit:contain}.controls{position:sticky;bottom:0;width:100%;max-width:720px;padding:12px;box-sizing:border-box;background:linear-gradient(transparent,rgba(0,0,0,.92) 35%)}button{width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;background:#d7b85f;color:#0a0a0a}.status{text-align:center;font-size:13px;opacity:.85;margin-top:8px}</style></head><body><div class="wrap"><div class="stage"><video id="v" playsinline preload="auto" src="https://cdn.creativeclaw.co/u/9cfd647d/videos/b967beca-2419-4f77-aa6b-8a671f7021ce.mp4"></video></div><div class="controls"><button id="play">▶ REPRODUCIR PRESENTACIÓN CON AUDIO</button><div class="status" id="status">Video real LAB · audio externo sincronizado</div></div></div><script>const v=document.getElementById('v'),btn=document.getElementById('play'),st=document.getElementById('status');const tracks=["https://cdn.creativeclaw.co/u/9cfd647d/audio/b6e13094-c681-4505-b130-e35c62762c09.mp3","https://cdn.creativeclaw.co/u/9cfd647d/audio/8feb8f6d-ad14-4e66-9baf-ca4029743fc7.mp3","https://cdn.creativeclaw.co/u/9cfd647d/audio/31e1c6c5-62e7-43e8-a8cf-cbdbaa4c3d78.mp3","https://cdn.creativeclaw.co/u/9cfd647d/audio/9a60dc42-252b-41b0-a767-5497fd374f5f.mp3","https://cdn.creativeclaw.co/u/9cfd647d/audio/18fec1aa-6e19-4551-8eff-5b334b076e6d.mp3","https://cdn.creativeclaw.co/u/9cfd647d/audio/eb377782-e4e5-4f82-b294-0b3723902b1c.mp3"];let idx=0,a=null,running=false;function stopAudio(){if(a){a.pause();a.src='';a=null}}function playTrack(i){if(i>=tracks.length){st.textContent='Narración completada';return}idx=i;stopAudio();a=new Audio(tracks[i]);a.preload='auto';a.volume=1;a.onended=()=>{if(running)playTrack(i+1)};a.onerror=()=>{st.textContent='Error cargando audio '+(i+1)};a.play().then(()=>{st.textContent='Audio activo · segmento '+(i+1)+' de '+tracks.length}).catch(()=>{st.textContent='Toca REPRODUCIR nuevamente para activar audio';running=false})}btn.addEventListener('click',async()=>{if(!running){running=true;btn.textContent='❚❚ PAUSAR';try{await v.play();playTrack(idx||0)}catch(e){running=false;btn.textContent='▶ REPRODUCIR PRESENTACIÓN CON AUDIO'}}else{running=false;v.pause();if(a)a.pause();btn.textContent='▶ CONTINUAR'}});v.addEventListener('ended',()=>{running=false;stopAudio();btn.textContent='↻ REPRODUCIR DE NUEVO';st.textContent='Presentación terminada';idx=0});</script></body></html>
