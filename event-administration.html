:10px;align-items:center;margin-bottom:13px}.player-title strong{font-size:15px;color:#31ff00;font-weight:900;text-transform:uppercase;text-decoration:none;border:0}.player-title small{color:#bbb;font-size:9px}.score-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.score-live{min-width:1040px;width:100%;border-collapse:collapse;table-layout:fixed}.score-live th,.score-live td{height:31px;border:1px solid #444;padding:2px;text-align:center;font-size:10px}.score-live th:first-child,.score-live td:first-child{position:sticky;left:0;z-index:2;width:74px;background:#050505;text-align:left;padding-left:7px;font-weight:900}.score-live th{color:#bbb}.score-live td.filled{font-weight:900}.score-live td.under,.player-total b.under{color:#31ff00}.score-live td.over,.player-total b.over{color:#ff4b55}.player-total-title{margin:15px 0 9px;padding-top:12px;border-top:1px solid #333;color:#31ff00;font-size:13px;font-weight:900;letter-spacing:.4px;text-align:center}.player-total{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:0}.player-total div{padding:7px 4px;border:1px solid #333;border-radius:6px;text-align:center}.player-total small{display:block;color:#888;font-size:7px;line-height:1.15}.player-total b{display:block;margin-top:2px;font-size:12px}@media(max-width:640px){main{padding:12px}dialog:has(.guest-live-card){width:98vw;max-height:90vh}.player-total{grid-template-columns:repeat(2,1fr)}}</style></head><body class="gsc-admin-page"><main><a data-gsc-close aria-label="Cerrar" href="/index-grupal.html?round_return=1">ATRÁS · MI TARJETA</a><h1>ADMINISTRAR TORNEOS Y GRUPOS</h1><button id="refresh">ACTUALIZAR LISTA</button><p id="status" role="status" aria-live="polite"></p><p id="directorySync" role="status" aria-live="polite">ACTUALIZACIÓN AUTOMÁTICA ACTIVA</p><section id="events"></section><dialog id="actionDialog"><form method="dialog"><button data-gsc-close aria-label="Cerrar">×</button><button data-gsc-menu type="button" onclick="this.closest('
