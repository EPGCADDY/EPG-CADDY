<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar rondas</title><link rel="stylesheet" href="/gsc-design-system.css"><style>body{margin:0;background:#050705;color:#fff;font:16px Arial}main{max-width:680px;margin:24px auto;padding:20px}h1,h2{color:#31ff00}button,a{min-height:44px;padding:12px;border:1px solid #31ff00;border-radius:10px;background:#080808;color:#31ff00;display:inline-block;margin:8px 4px 8px 0;font-weight:bold}input{display:block;box-sizing:border-box;width:100%;padding:12px;margin:8px 0;background:#111;color:white;border:1px solid #666;border-radius:8px}article,fieldset{border:1px solid #555;border-radius:12px;padding:16px;margin:16px 0}output{display:block;overflow-wrap:anywhere;color:#31ff00}button.danger{color:#ff5555;border-color:#ff5555}label{display:block}dialog{background:#080808;color:#fff;max-width:520px;width:80%;border:1px solid #31ff00;border-radius:14px}dialog::backdrop{background:#000c}</style></head><body><main><a href="/index-grupal.html?round_return=1">ATRÁS · MI TARJETA</a><h1>ADMINISTRAR RONDAS</h1><p>El propietario tiene control pleno. Cada permiso compartido corresponde a una persona y un evento; vence 24 horas después de terminarlo.</p><button id="ownerLogin">INICIAR SESIÓN DE PROPIETARIO</button><p id="identity"></p><p id="status" role="status" aria-live="polite"></p><section><h2>RECIBÍ UN CÓDIGO</h2><label>Código administrativo<input id="code" autocomplete="off"></label><button id="redeem">ACTIVAR MI PERMISO</button><button id="refresh">ACTUALIZAR LISTA</button></section><section id="events"></section><section><h2>COMPROBANTES DE ELIMINACIÓN</h2><div id="receipts"></div></section><dialog id="actionDialog"><form method="dialog"><button aria-label="Cerrar">X</button></form><section id="action"></section><p id="actionStatus" role="status"></p></dialog><script src="/auth-gate.js"></script><script type="module" src="/event-administration-ui.js"></script></main></body></html>
