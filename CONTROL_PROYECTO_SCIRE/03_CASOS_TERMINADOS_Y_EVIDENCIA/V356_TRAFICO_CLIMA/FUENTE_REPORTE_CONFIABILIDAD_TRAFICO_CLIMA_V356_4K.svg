  <text x="110" y="175" class="brand">GOLF SCORE CARD GT</text>
  <text x="110" y="285" class="title">REPORTE DE CONFIABILIDAD</text>
  <text x="110" y="350" class="subtitle">TRÁFICO VEHICULAR + CLIMA · REVISIÓN V356 · 28 AGOSTO 2026</text>

  <rect x="90" y="420" width="1980" height="430" rx="38" class="card"/>
  <text x="150" y="510" class="label">VEREDICTO MEDIDO</text>
  <text x="150" y="690" class="score">93.75%</text>
  <text x="980" y="565" class="metric">CONCORDANCIA TÉCNICA</text>
  <text x="980" y="630" class="body">30 de 32 criterios comparativos aprobados</text>
  <text x="980" y="690" class="body">Umbral exigido: 90% · Resultado: APROBADO</text>
  <text x="980" y="750" class="warn">NO ES 100% NI GARANTÍA DEL FUTURO REAL</text>
  <text x="150" y="810" class="small">Aprobado para Preview. Producción permanece intacta hasta validación física.</text>

  <text x="110" y="950" class="section">01 · DESCRIPCIÓN DE LA REVISIÓN</text>
  <rect x="90" y="990" width="1980" height="300" rx="28" class="card"/>
  <text x="145" y="1060" class="body">
    <tspan x="145" dy="0">Doble revisión funcional, temporal y comparativa de respuestas reales.</tspan>
    <tspan x="145" dy="54">Horizontes probados: AHORA · 30 MIN · 1 HORA · 3 HORAS · MAÑANA · PRÓXIMA SEMANA.</tspan>
    <tspan x="145" dy="54">Se verificaron ETA, distancia, demora, hora de salida, temperatura, viento y lluvia.</tspan>
    <tspan x="145" dy="54">La prueba bloquea presentar información actual como si fuera una estimación futura.</tspan>
  </text>

  <text x="110" y="1400" class="section">02 · PRODUCTOS Y FUENTES ESPECIALIZADAS</text>
  <rect x="90" y="1440" width="950" height="330" rx="28" class="card"/>
  <text x="145" y="1515" class="label">PRODUCTO REVISADO</text>
  <text x="145" y="1580" class="metric">GOLF SCORE CARD GT · V356</text>
  <text x="145" y="1640" class="body">Google Maps Routes · Open-Meteo</text>
  <text x="145" y="1695" class="small">Voz Cedar 1.15 · tráfico y clima estructurados</text>

  <rect x="1070" y="1440" width="1000" height="330" rx="28" class="card"/>
  <text x="1125" y="1515" class="label">COMPARADORES</text>
  <text x="1125" y="1580" class="body">Google Maps · AccuWeather</text>
  <text x="1125" y="1635" class="body">Meteoblue · The Weather Channel</text>
  <text x="1125" y="1690" class="small">Waze: destinos reconocidos; cálculo bloqueado</text>
  <text x="1125" y="1730" class="small">por verificación humana. No fue contado como PASS.</text>

  <text x="110" y="1880" class="section">03 · RESULTADOS PRINCIPALES</text>
  <rect x="90" y="1920" width="470" height="235" rx="26" class="card"/>
  <text x="140" y="1995" class="label">BANCO TOTAL</text><text x="140" y="2080" class="metric">99 / 99</text><text x="140" y="2125" class="pass">PASS</text>
