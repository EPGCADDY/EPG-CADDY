  <text x="145" y="4090" class="body">Inventariado en ROADMAP OVERALL, ROADMAP A DETALLE y Mapa Maestro de Archivos.</text>
  <text x="145" y="4150" class="warn">Producción no fue modificada. La validación física futura continúa siendo una puerta separada.</text>

  <text x="110" y="4255" class="small">REPORTE_CONFIABILIDAD_TRAFICO_CLIMA_V356_4K · 2160 × 4320 px · 300 dpi · 28 AGO 2026</text>
