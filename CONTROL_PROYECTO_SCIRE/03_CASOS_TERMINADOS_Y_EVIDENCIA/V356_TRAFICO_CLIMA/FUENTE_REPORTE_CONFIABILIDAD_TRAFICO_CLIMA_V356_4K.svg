  <rect x="90" y="2305" width="1980" height="440" rx="28" class="card"/>
  <text x="145" y="2375" class="label">RUTA / HORIZONTE</text><text x="1080" y="2375" class="label">GSC GT V356</text><text x="1570" y="2375" class="label">COMPARACIÓN / ESTADO</text>
  <line x1="145" y1="2405" x2="2015" y2="2405" class="line"/>
  <text x="145" y="2475" class="body">El Pulté → Pradera · AHORA</text><text x="1080" y="2475" class="body">36 min · 15.1 km</text><text x="1570" y="2475" class="pass">Maps 37 min · 15.0 km · PASS</text>
  <text x="145" y="2550" class="body">Country Club → Alta Vista · +1 H</text><text x="1080" y="2550" class="body">74 min · 30.1 km</text><text x="1570" y="2550" class="pass">Maps 55–110 min · 30.1 km · PASS</text>
  <text x="145" y="2625" class="body">Mayan Golf → El Pulté · +3 H</text><text x="1080" y="2625" class="body">61 min · 38.7 km</text><text x="1570" y="2625" class="pass">FUTURO BIEN ROTULADO · PASS</text>
  <text x="145" y="2700" class="body">El Pulté → Oakland · MAÑANA 08:00</text><text x="1080" y="2700" class="body">32 min · 21.6 km</text><text x="1570" y="2700" class="pass">SALIDA EXACTA · PASS</text>

  <text x="110" y="2855" class="section">05 · EJEMPLOS CLIMÁTICOS</text>
  <rect x="90" y="2895" width="1980" height="390" rx="28" class="card"/>
  <text x="145" y="2965" class="body">AHORA</text><text x="520" y="2965" class="body">25.5 °C · viento 12.5 km/h · parcialmente nublado</text>
  <text x="145" y="3030" class="body">30 MIN / 1 H</text><text x="520" y="3030" class="body">27.7 °C · lluvia 18% · viento 11.7 km/h</text>
  <text x="145" y="3095" class="body">3 HORAS</text><text x="520" y="3095" class="body">28.0 °C · lluvia 14% · viento 16.8 km/h</text>
  <text x="145" y="3160" class="body">MAÑANA</text><text x="520" y="3160" class="body">16.7–28.0 °C · pico lluvia 72% a las 17:00</text>
  <text x="145" y="3225" class="body">PRÓXIMA SEMANA</text><text x="520" y="3225" class="body">16.8–27.6 °C · pico lluvia 100% a las 17:00</text>

  <text x="110" y="3395" class="section">06 · OPINIÓN, CRITERIO Y RECOMENDACIÓN</text>
  <rect x="90" y="3435" width="1980" height="305" rx="28" class="card"/>
  <text x="145" y="3510" class="body"><tspan font-weight="800" fill="#ffffff">CALIFICACIÓN GENERAL: 9.4 / 10.</tspan> Confiable para Preview bajo el umbral ≥90%.</text>
  <text x="145" y="3570" class="body">La integración temporal quedó corregida y blindada contra reincidencia.</text>
  <text x="145" y="3630" class="body">Recomendación: prueba simultánea física en iPhone con Waze y verificación posterior del clima.</text>
  <text x="145" y="3690" class="warn">La aprobación anterior al 100% queda invalidada. No se volverá a usar sin evidencia física.</text>

