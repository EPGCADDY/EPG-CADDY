    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f9994"/><stop offset="0.5" stop-color="#f3f6f4"/><stop offset="1" stop-color="#8b9590"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .brand{font:800 42px 'DejaVu Sans',Arial,sans-serif;letter-spacing:7px;fill:#d8dfdc}
      .title{font:900 78px 'DejaVu Sans',Arial,sans-serif;fill:white;letter-spacing:1px}
