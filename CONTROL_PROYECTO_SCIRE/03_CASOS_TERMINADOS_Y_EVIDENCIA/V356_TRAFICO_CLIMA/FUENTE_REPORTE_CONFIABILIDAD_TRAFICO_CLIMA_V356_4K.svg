  <text x="635" y="1995" class="label">ESCENARIOS REALES</text><text x="635" y="2080" class="metric">12 / 12</text><text x="635" y="2125" class="pass">PASS</text>
  <rect x="1080" y="1920" width="470" height="235" rx="26" class="card"/>
  <text x="1130" y="1995" class="label">CRITERIOS</text><text x="1130" y="2080" class="metric">30 / 32</text><text x="1130" y="2125" class="pass">93.75%</text>
  <rect x="1575" y="1920" width="495" height="235" rx="26" class="card"/>
  <text x="1625" y="1995" class="label">PRODUCCIÓN</text><text x="1625" y="2080" class="metric">INTACTA</text><text x="1625" y="2125" class="pass">CONTROLADA</text>

