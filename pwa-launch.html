// This network entry is already used by installed R147.2.4 apps. Prepare the
// delivery worker before entering their approved cached card; do not approve

(function(){
  let opened=false;
  function openCard(){if(opened)return;opened=true;clearTimeout(deadline);location.replace('/index-grupal.html?source=pwa&launch='+Date.now())}
  const deadline=setTimeout(openCard,8000);
  if(!('serviceWorker' in navigator)){openCard();return}
  (async()=>{
    const registration=await navigator.serviceWorker.register('/service-worker.js',{scope:'/',updateViaCache:'none'});
    await registration.update();
    const pending=registration.installing||registration.waiting;
    if(pending&&pending.state!=='activated')await new Promise(resolve=>{
      const changed=()=>{if(pending.state==='activated'||pending.state==='redundant'){pending.removeEventListener('statechange',changed);resolve()}};
      pending.addEventListener('statechange',changed);changed();
    });
    if(pending)await new Promise(resolve=>{
      const changed=()=>{navigator.serviceWorker.removeEventListener('controllerchange',changed);clearTimeout(fallback);resolve()};
      const fallback=setTimeout(changed,250);
      navigator.serviceWorker.addEventListener('controllerchange',changed);
    });
  })().catch(()=>{}).finally(openCard);
})();
</script></body></html>
