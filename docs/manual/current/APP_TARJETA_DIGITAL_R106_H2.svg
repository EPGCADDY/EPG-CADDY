<text x="95" y="940" fill="#fff" font-family="Arial" font-size="25" font-weight="900">SECUENCIA DE SEGURIDAD</text>
<text x="95" y="990" fill="#aaa" font-family="Arial" font-size="22">1. Descarta una tarjeta preparada de otra modalidad.</text>
<text x="95" y="1030" fill="#aaa" font-family="Arial" font-size="22">2. Genera la tarjeta de la modalidad activa.</text>
<text x="95" y="1070" fill="#aaa" font-family="Arial" font-size="22">3. Valida modalidad, título y contenido antes de compartir.</text>
<text x="95" y="1110" fill="#aaa" font-family="Arial" font-size="22">4. Genera PNG/PDF y abre las opciones de envío del dispositivo.</text>
