<text x="585" y="112" fill="#31ff00" font-family="Arial" font-size="44" font-weight="900" text-anchor="middle">TARJETA DIGITAL · COMPARTIR</text>
<text x="585" y="162" fill="#fff" font-family="Arial" font-size="23" font-weight="800" text-anchor="middle">La salida conserva la modalidad activa y genera una imagen legible</text>
