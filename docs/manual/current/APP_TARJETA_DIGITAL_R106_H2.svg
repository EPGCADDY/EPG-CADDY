<rect x="135" y="258" width="900" height="78" rx="12" fill="#071007" stroke="#31ff00"/><text x="585" y="307" fill="#31ff00" font-family="Arial" font-size="28" font-weight="900" text-anchor="middle">TARJETA DE LA MODALIDAD CORRECTA</text>
<g fill="#111" stroke="#555"><rect x="135" y="365" width="900" height="68"/><rect x="135" y="433" width="900" height="68"/><rect x="135" y="501" width="900" height="68"/><rect x="135" y="569" width="900" height="68"/></g>
<g fill="#fff" font-family="Arial" font-size="22" font-weight="800"><text x="165" y="407">DATOS · JUGADORES · GROSS / NETO / RESULTADO</text><text x="165" y="475">CONTENIDO COMPLETO · SIN RECORTAR INFORMACIÓN</text><text x="165" y="543">PNG AJUSTADO AL CONTENIDO REAL</text><text x="165" y="611">SIN LIENZO NEGRO EXCESIVO ALREDEDOR</text></g>
