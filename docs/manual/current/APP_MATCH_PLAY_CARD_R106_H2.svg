<text x="110" y="930" fill="#aaa" font-family="Arial" font-size="22">La tarjeta compartida debe mostrar el símbolo visible en cada hoyo.</text>
<text x="110" y="970" fill="#aaa" font-family="Arial" font-size="22">No hace falta calcular mentalmente: color + símbolo explican el resultado.</text>
